<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Preselettiva PuntoZero</title>
<meta name="theme-color" content="#1D4E6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Preselettiva">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface2:#EBEFF3; --line:#D8DEE5;
  --ink:#16222C; --ink2:#4A5866; --ink3:#7A8794;
  --accent:#1D4E6B; --accent-ink:#FFFFFF; --accent-soft:#DCE8F0;
  --ok:#1E7A4C; --ok-soft:#DDF1E6; --bad:#B23A2E; --bad-soft:#F8E1DE; --warn:#9A6400; --warn-soft:#FBEFD6;
  --shadow:0 1px 2px rgba(16,30,45,.06),0 6px 16px -10px rgba(16,30,45,.25);
  --r:12px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F151A; --surface:#172028; --surface2:#1F2A33; --line:#2B3843;
    --ink:#E6EDF2; --ink2:#A9B6C1; --ink3:#7C8A96;
    --accent:#6FB3DB; --accent-ink:#0B1620; --accent-soft:#1B3242;
    --ok:#5CC48C; --ok-soft:#173326; --bad:#E57A6E; --bad-soft:#3A1F1C; --warn:#E0AE52; --warn-soft:#33291A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px -12px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 32px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:19px;margin:0;flex:1;line-height:1.2}
header.top .sub{display:block;font-size:12.5px;font-weight:500;color:var(--ink3)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:40px;height:40px;padding:0 12px;font-size:14px;font-weight:600}
.btn{text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 16px;font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wide{width:100%;display:block}
.btn:disabled{opacity:.45}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.muted{color:var(--ink3)} .small{font-size:13px}
.hidden{display:none!important}

/* home */
.intro{padding:14px 16px;margin-bottom:14px}
.intro p{margin:0;font-size:14px;color:var(--ink2)}
.blocks{display:grid;gap:10px}
.block{display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.block .ico{width:44px;height:44px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.block .t{flex:1;min-width:0}
.block .t b{display:block;font-size:16px}
.block .t span{font-size:13px;color:var(--ink3)}
.block .chev{color:var(--ink3);font-size:20px}
.block.soon{opacity:.6}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:20px;background:var(--surface2);color:var(--ink3)}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.bad{background:var(--bad-soft);color:var(--bad)}

/* esercitazioni */
.exlist{display:grid;gap:10px}
.ex{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left}
.ex .n{width:38px;height:38px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-weight:800;flex:none}
.ex .t{flex:1}
.ex .t b{display:block}
.ex .best{text-align:right;font-weight:800;font-size:18px}
.ex .best small{display:block;font-size:11px;font-weight:600;color:var(--ink3)}

/* pre-start */
.rules{padding:16px;margin:4px 0 14px}
.rules h2{font-size:17px;margin:0 0 8px}
.rules ul{margin:0;padding-left:18px;color:var(--ink2);font-size:14.5px}
.rules li{margin-bottom:4px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;margin-bottom:14px}
.switch input{width:22px;height:22px;accent-color:var(--accent)}

/* quiz */
.qbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qbar .prog{flex:1;height:6px;background:var(--surface2);border-radius:4px;overflow:hidden}
.qbar .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.timer{font-weight:800;font-size:15px;padding:4px 10px;border-radius:8px;background:var(--surface2)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.qcard{padding:18px 16px}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--ink3)}
.qtext{overflow-wrap:anywhere;font-size:17.5px;font-weight:600;margin:0 0 16px;line-height:1.4}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:15.5px}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:800;font-size:13px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:var(--accent-ink)}
.qnav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.clear{margin-top:10px;background:none;border:0;color:var(--ink3);font-size:13.5px;text-decoration:underline;padding:6px 0}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:16px}
.grid button{aspect-ratio:1;border:1px solid var(--line);background:var(--surface);border-radius:7px;font-size:12px;font-weight:700;padding:0}
.grid button.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.grid button.cur{outline:2px solid var(--ink);outline-offset:1px}
.submit{margin-top:16px}

/* result */
.score{padding:22px 16px;text-align:center;margin-bottom:14px}
.score .big{font-size:52px;font-weight:800;line-height:1;letter-spacing:-.02em}
.score .big small{font-size:20px;color:var(--ink3);font-weight:700}
.score .verdict{margin-top:8px;font-weight:700}
.score.pass .big,.score.pass .verdict{color:var(--ok)}
.score.fail .big,.score.fail .verdict{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}
.stat{background:var(--surface2);border-radius:10px;padding:10px 6px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--ink3)}
.lv{padding:14px 16px;margin-bottom:14px}
.lv h3{margin:0 0 10px;font-size:15px}
.lvrow{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;font-size:13.5px;margin-bottom:8px}
.lvrow .bar{height:8px;background:var(--surface2);border-radius:5px;overflow:hidden}
.lvrow .bar i{display:block;height:100%;background:var(--accent)}
.filt{display:flex;gap:8px;margin:6px 0 12px}
.filt button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:8px;font-size:13.5px;font-weight:600}
.filt button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rev{padding:14px 16px;margin-bottom:10px}
.rev .qhead{margin-bottom:6px}
.rev .qt{overflow-wrap:anywhere;font-weight:600;margin:0 0 10px}
.rev .ans{font-size:14.5px;padding:8px 10px;border-radius:8px;margin-bottom:6px}
.rev .ans.ok{background:var(--ok-soft);color:var(--ok)}
.rev .ans.bad{background:var(--bad-soft);color:var(--bad)}
.rev .ans.om{background:var(--warn-soft);color:var(--warn)}
.rev .exp{font-size:14px;color:var(--ink2);margin:8px 0 0;padding-top:8px;border-top:1px dashed var(--line)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--surface2);padding:2px 7px;border-radius:6px;color:var(--ink2)}

/* storico */
.hist{padding:4px 0}
.hrow{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px}
.hrow:last-child{border-bottom:0}
.hrow b.ok{color:var(--ok)} .hrow b.bad{color:var(--bad)}

/* modale */
.modal{position:fixed;inset:0;background:rgba(10,20,30,.5);display:grid;place-items:center;padding:20px;z-index:20}
.modal .box{background:var(--surface);border-radius:14px;padding:20px;max-width:420px;width:100%;box-shadow:var(--shadow)}
.modal h3{margin:0 0 8px;font-size:18px}
.modal p{margin:0 0 16px;color:var(--ink2);font-size:14.5px}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
footer{text-align:center;font-size:12px;color:var(--ink3);margin-top:22px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modal"></div>

<script>
/* ============================================================
   BANCA DATI DOMANDE
   Formato di ogni domanda: [livello, testo, corretta, errata1, errata2, errata3, spiegazione]
   ============================================================ */
const BANCA = {"CG":{"1":[[1,"In quale anno, con un referendum, gli italiani scelsero la Repubblica?","1946","1948","1945","1950","Il referendum istituzionale si tenne il 2 giugno 1946; per questo il 2 giugno è la Festa della Repubblica."],[1,"Quando è entrata in vigore la Costituzione italiana?","1° gennaio 1948","2 giugno 1946","25 aprile 1945","1° gennaio 1950","Approvata dall'Assemblea costituente il 22 dicembre 1947, la Costituzione è entrata in vigore il 1° gennaio 1948."],[1,"Qual è il capoluogo dell'Umbria?","Perugia","Terni","Foligno","Spoleto","Perugia è il capoluogo di regione; Terni è l'altro capoluogo di provincia."],[1,"Qual è il fiume più lungo d'Italia?","Il Po","Il Tevere","L'Adige","L'Arno","Il Po, con circa 650 km, è il fiume più lungo d'Italia."],[1,"Qual è la montagna più alta delle Alpi?","Il Monte Bianco","Il Monte Rosa","Il Cervino","Il Gran Sasso","Il Monte Bianco supera i 4.800 metri ed è la vetta più alta delle Alpi. Il Gran Sasso si trova negli Appennini."],[1,"Chi è l'autore de «I promessi sposi»?","Alessandro Manzoni","Giovanni Verga","Ugo Foscolo","Giacomo Leopardi","Il romanzo di Manzoni è ambientato in Lombardia nel Seicento; l'edizione definitiva è del 1840-42."],[1,"Qual è la capitale dell'Austria?","Vienna","Salisburgo","Innsbruck","Graz","Vienna è la capitale e la città più popolosa dell'Austria."],[1,"Chi è il capo dello Stato in Italia?","Il Presidente della Repubblica","Il Presidente del Consiglio dei ministri","Il Presidente del Senato","Il Presidente della Corte costituzionale","Secondo l'art. 87 della Costituzione il Presidente della Repubblica è il capo dello Stato e rappresenta l'unità nazionale."],[1,"Quanti anni dura il mandato del Presidente della Repubblica italiana?","7","5","6","4","Il Presidente della Repubblica è eletto per sette anni (art. 85 della Costituzione)."],[1,"In quale anno Cristoforo Colombo giunse in America?","1492","1498","1453","1519","Colombo raggiunse le Americhe il 12 ottobre 1492."],[1,"Chi affrescò la volta della Cappella Sistina?","Michelangelo Buonarroti","Raffaello Sanzio","Leonardo da Vinci","Sandro Botticelli","Michelangelo dipinse la volta tra il 1508 e il 1512 e, anni dopo, il Giudizio universale."],[1,"Qual è l'oceano più esteso della Terra?","Il Pacifico","L'Atlantico","L'Indiano","Il Glaciale Artico","L'Oceano Pacifico è il più grande per superficie."],[1,"Qual è il pianeta più vicino al Sole?","Mercurio","Venere","Marte","Terra","L'ordine a partire dal Sole è: Mercurio, Venere, Terra, Marte…"],[1,"In quale anno fu proclamato il Regno d'Italia?","1861","1870","1848","1871","Il Regno d'Italia fu proclamato il 17 marzo 1861. Roma divenne capitale solo nel 1871, dopo la presa del 1870."],[1,"Qual è la formula chimica dell'acqua?","H₂O","CO₂","O₂","NaCl","Una molecola d'acqua è formata da due atomi di idrogeno e uno di ossigeno. CO₂ è l'anidride carbonica, NaCl il sale da cucina."],[1,"Qual è il lago più grande d'Italia?","Il lago di Garda","Il lago Maggiore","Il lago Trasimeno","Il lago di Como","Il Garda è il più esteso; il Trasimeno, in Umbria, è il quarto per superficie."],[1,"In quale città si trova la celebre Torre pendente?","Pisa","Firenze","Siena","Lucca","La Torre pendente è il campanile della cattedrale di Pisa, in Piazza dei Miracoli."],[1,"Quale organo esercita la funzione legislativa in Italia?","Il Parlamento","Il Governo","Il Presidente della Repubblica","La Corte costituzionale","L'art. 70 della Costituzione affida la funzione legislativa alle due Camere; il Governo esercita il potere esecutivo."],[2,"Da quali organi è composto il Parlamento italiano?","Camera dei deputati e Senato della Repubblica","Camera dei deputati e Consiglio dei ministri","Senato della Repubblica e Corte costituzionale","Consiglio dei ministri e Presidenza della Repubblica","Il Parlamento è bicamerale: Camera dei deputati e Senato della Repubblica (art. 55)."],[2,"Chi nomina il Presidente del Consiglio dei ministri?","Il Presidente della Repubblica","Il Parlamento in seduta comune","I cittadini con voto diretto","Il Senato della Repubblica","Il Presidente della Repubblica nomina il Presidente del Consiglio e, su sua proposta, i ministri (art. 92); il Governo deve poi ottenere la fiducia delle Camere."],[2,"In quale anno l'Italia entrò nella Prima guerra mondiale?","1915","1914","1917","1918","La guerra iniziò nel 1914, ma l'Italia, inizialmente neutrale, entrò nel conflitto il 24 maggio 1915."],[2,"Quale di queste regioni NON confina con l'Umbria?","Abruzzo","Toscana","Lazio","Marche","L'Umbria confina con Toscana, Marche e Lazio. È l'unica regione dell'Italia peninsulare senza sbocco sul mare."],[2,"Quale di questi Paesi NON fa parte dell'Unione Europea?","Norvegia","Austria","Portogallo","Irlanda","La Norvegia fa parte dello Spazio economico europeo ma non dell'Unione Europea."],[2,"In quale anno cadde il muro di Berlino?","1989","1991","1961","1985","Il muro, costruito nel 1961, cadde il 9 novembre 1989; la Germania fu riunificata l'anno seguente."],[2,"Quale città fu capitale dell'Impero romano d'Oriente?","Costantinopoli","Roma","Ravenna","Milano","Costantinopoli (l'odierna Istanbul) fu capitale dell'Impero d'Oriente fino al 1453. Milano e poi Ravenna furono capitali dell'Impero d'Occidente."],[2,"Chi fu il primo Presidente del Consiglio del Regno d'Italia?","Camillo Benso, conte di Cavour","Giuseppe Garibaldi","Giuseppe Mazzini","Francesco Crispi","Cavour guidò il primo governo del Regno d'Italia nel 1861 e morì pochi mesi dopo."],[2,"Quale articolo della Costituzione afferma che «L'Italia è una Repubblica democratica, fondata sul lavoro»?","L'articolo 1","L'articolo 3","L'articolo 12","L'articolo 139","È il primo articolo. L'art. 3 riguarda l'uguaglianza, il 12 la bandiera, il 139 dice che la forma repubblicana non può essere oggetto di revisione."],[2,"Nella sequenza cronologica, quale evento viene per primo?","La scoperta dell'America","La Rivoluzione francese","L'Unità d'Italia","La Prima guerra mondiale","Scoperta dell'America 1492, Rivoluzione francese 1789, Unità d'Italia 1861, Prima guerra mondiale 1914."],[3,"Il 2 giugno 1946 gli italiani, oltre a votare per il referendum istituzionale, elessero:","L'Assemblea costituente","Il primo Parlamento repubblicano","Il Presidente della Repubblica","I consigli regionali","Nella stessa giornata fu eletta l'Assemblea costituente, che scrisse la Costituzione. Fu anche la prima consultazione nazionale in cui votarono le donne."],[3,"Quale delle seguenti coppie evento – secolo è corretta?","Rivoluzione francese – XVIII secolo","Scoperta dell'America – XVI secolo","Unità d'Italia – XVIII secolo","Caduta dell'Impero romano d'Occidente – X secolo","La Rivoluzione francese (1789) appartiene al Settecento, cioè al XVIII secolo. Il 1492 è nel XV secolo, il 1861 nel XIX, il 476 nel V."]],"2":[[1,"Qual è la capitale del Belgio?","Bruxelles","Anversa","Bruges","Liegi","Bruxelles è la capitale del Belgio e sede di molte istituzioni dell'Unione Europea."],[1,"Quale mare bagna Venezia?","Il mar Adriatico","Il mar Tirreno","Il mar Ionio","Il mar Ligure","Venezia sorge nella laguna veneta, sull'Adriatico settentrionale."],[1,"Chi è l'autore della poesia «L'infinito»?","Giacomo Leopardi","Giovanni Pascoli","Ugo Foscolo","Giosuè Carducci","«L'infinito» fu composto da Leopardi a Recanati tra il 1818 e il 1819."],[1,"Quante sono le regioni italiane?","20","21","19","22","Le regioni sono 20, cinque delle quali a statuto speciale."],[1,"Quante sono le regioni italiane a statuto speciale?","5","3","4","6","Sicilia, Sardegna, Valle d'Aosta, Trentino-Alto Adige e Friuli-Venezia Giulia."],[1,"Qual è il simbolo chimico dell'oro?","Au","Ag","Or","Fe","Au deriva dal latino aurum; Ag è l'argento, Fe il ferro."],[1,"Chi formulò la teoria della relatività?","Albert Einstein","Isaac Newton","Galileo Galilei","Enrico Fermi","Einstein pubblicò la relatività ristretta nel 1905 e quella generale nel 1915."],[1,"Chi scoprì la penicillina?","Alexander Fleming","Louis Pasteur","Robert Koch","Marie Curie","Fleming scoprì la penicillina nel 1928, dando origine agli antibiotici."],[1,"In quale anno terminò la Seconda guerra mondiale?","1945","1944","1946","1943","La guerra terminò in Europa nel maggio 1945 e, con la resa del Giappone, nel settembre 1945."],[1,"In quale giorno si celebra in Italia la Festa della Liberazione?","25 aprile","2 giugno","1° maggio","4 novembre","Il 25 aprile ricorda la liberazione dal nazifascismo (1945); il 2 giugno è la Festa della Repubblica."],[1,"Qual è il continente più popoloso?","L'Asia","L'Africa","L'Europa","L'America","In Asia vive circa il 60% della popolazione mondiale."],[1,"Qual è la moneta del Regno Unito?","La sterlina","L'euro","Il dollaro","Il franco","Il Regno Unito non ha mai adottato l'euro e usa la sterlina."],[1,"Chi è patrono d'Italia insieme a santa Caterina da Siena?","San Francesco d'Assisi","San Benedetto da Norcia","Sant'Antonio da Padova","San Pietro","San Francesco e santa Caterina sono patroni d'Italia dal 1939. San Benedetto è patrono d'Europa."],[1,"In quale città umbra si trova la Basilica di San Francesco?","Assisi","Gubbio","Orvieto","Spoleto","La Basilica di San Francesco, con gli affreschi di Giotto e Cimabue, si trova ad Assisi."],[1,"Quanti giorni ha un anno bisestile?","366","365","364","367","Nell'anno bisestile febbraio ha 29 giorni invece di 28."],[1,"Chi fu il primo uomo a camminare sulla Luna?","Neil Armstrong","Jurij Gagarin","Buzz Aldrin","Yuri Andropov","Armstrong scese sulla Luna il 20 luglio 1969 (missione Apollo 11), seguito da Aldrin. Gagarin fu il primo uomo nello spazio (1961)."],[1,"Quale organo del corpo umano pompa il sangue in tutto l'organismo?","Il cuore","Il fegato","I polmoni","I reni","Il cuore spinge il sangue nelle arterie; i polmoni lo ossigenano, i reni lo filtrano."],[1,"Qual è la lingua ufficiale del Brasile?","Il portoghese","Lo spagnolo","L'inglese","Il francese","Il Brasile fu colonia portoghese: è il Paese con il maggior numero di persone di lingua portoghese."],[2,"In quale regione nasce il fiume Tevere?","Emilia-Romagna","Umbria","Toscana","Lazio","Il Tevere nasce dal Monte Fumaiolo, in Emilia-Romagna, e attraversa Toscana, Umbria e Lazio prima di sfociare nel Tirreno."],[2,"Quale organo giudica sulla legittimità costituzionale delle leggi?","La Corte costituzionale","La Corte di cassazione","Il Consiglio di Stato","Il Presidente della Repubblica","Il controllo di costituzionalità delle leggi spetta alla Corte costituzionale (art. 134)."],[2,"Da quanti giudici è composta la Corte costituzionale?","15","9","12","21","15 giudici: un terzo nominati dal Presidente della Repubblica, un terzo dal Parlamento in seduta comune, un terzo dalle supreme magistrature (art. 135)."],[2,"Qual è l'età minima per essere eletti Presidente della Repubblica?","50 anni","40 anni","35 anni","45 anni","L'art. 84 della Costituzione richiede che il Presidente abbia compiuto cinquant'anni."],[2,"Che cosa istituirono i Trattati di Roma del 1957?","La Comunità economica europea (CEE)","L'Unione Europea","La NATO","L'ONU","Nel 1957 nacquero la CEE e l'Euratom. L'Unione Europea nasce con il Trattato di Maastricht (1992); la NATO è del 1949, l'ONU del 1945."],[2,"Quale evento segna convenzionalmente l'inizio della Seconda guerra mondiale?","L'invasione tedesca della Polonia","L'attacco giapponese a Pearl Harbor","Lo sbarco in Normandia","L'entrata in guerra dell'Italia","La Germania invase la Polonia il 1° settembre 1939. Pearl Harbor è del 1941, lo sbarco in Normandia del 1944."],[2,"Quale di questi poeti visse nel Trecento?","Francesco Petrarca","Giacomo Leopardi","Giosuè Carducci","Giovanni Pascoli","Petrarca (1304-1374) è del Trecento; Leopardi dell'Ottocento; Carducci e Pascoli tra Ottocento e Novecento."],[2,"In quale anno avvenne la marcia su Roma, che portò Mussolini al governo?","1922","1919","1925","1929","La marcia su Roma è dell'ottobre 1922; subito dopo il re affidò a Mussolini l'incarico di formare il gov oint","Outlook","Excel gestisce celle, formule e grafici; Word è un elaboratore di testi, PowerPoint serve per presentazioni, Outlook per la posta."],[1,"Un file con estensione .pdf è normalmente:","Un documento impaginato in formato portabile","Un file audio compresso","Un foglio di calcolo modificabile","Un programma eseguibile","PDF (Portable Document Format) conserva l'impaginazione indipendentemente dal dispositivo."],[1,"Che cosa si intende con «phishing»?","Un tentativo di ottenere dati riservati fingendosi un soggetto affidabile","Un programma che velocizza la connessione","La copia di sicurezza dei dati","Un tipo di cavo di rete","Il phishing usa email o siti falsi (banca, corriere, ente) per carpire password o dati di pagamento."],[1,"Che cosa indica la sigla URL?","L'indirizzo di una risorsa su Internet","Il nome del processore","Un tipo di memoria di massa","Un protocollo per la posta elettronica","URL (Uniform Resource Locator) è l'indirizzo che identifica una pagina o una risorsa in rete."],[1,"Quale combinazione di tasti, in Windows, copia l'elemento selezionato?","CTRL + C","CTRL + V","CTRL + X","CTRL + Z","CTRL+C copia, CTRL+V incolla, CTRL+X taglia, CTRL+Z annulla l'ultima operazione."],[1,"Che cos'è un sistema operativo?","Il software che gestisce le risorse hardware e permette di eseguire i programmi","Un programma per scrivere testi","Un componente fisico della scheda madre","Un antivirus preinstallato","Il sistema operativo (Windows, Linux, macOS, Android) fa da intermediario tra hardware, programmi e utente."],[1,"In un indirizzo email, che cosa separa il nome utente dal dominio?","Il simbolo @","Il punto","Il simbolo #","La barra /","Formato: nomeutente@dominio.it."],[1,"Quale dei seguenti è un browser?","Mozilla Firefox","Microsoft Access","Adobe Photoshop","WinZip","Firefox è un browser; Access è un database, Photoshop un programma di grafica, WinZip un compressore."],[1,"Che cos'è il «cloud storage»?","L'archiviazione di file su server rem ","«Rispondi» invia la risposta solo al mittente; «Rispondi a tutti» include tutti i destinatari."],[2,"Che cosa sono i «cookie» di un sito web?","Piccoli file salvati dal browser che memorizzano informazioni sulla navigazione","Virus che si attivano visitando un sito","Immagini pubblicitarie inserite nelle pagine","Programmi che velocizzano la connessione","I cookie conservano preferenze, sessioni di accesso o dati di tracciamento; per questo la legge richiede il consenso per quelli non tecnici."],[2,"Per mettere in ordine alfabetico un elenco di cognomi in una colonna di Excel si usa la funzione:","Ordina","Filtro avanzato","Convalida dati","Unisci celle","«Ordina» dispone le righe in ordine crescente o decrescente; il filtro nasconde righe, non le ordina."],[2,"Quale combinazione di tasti, in Windows, chiude la finestra o il programma attivo?","ALT + F4","CTRL + F4 + TAB","SHIFT + CANC","ALT + TAB","ALT+F4 chiude la finestra attiva; ALT+TAB passa da una finestra all'altra; SHIFT+CANC elimina definitivamente un file."],[2,"Un'operatrice deve allontanarsi per pochi minuti dalla postazione con dati sensibili aperti. Qual è il comportamento corretto?","Bloccare la sessione (ad esempio con il tasto Windows + L)","Spegnere il monitor lasciando la sessione aperta","Chiedere a un utente allo sportello di sorvegliare lo schermo","Ridurre a icona le finestre","Il blocco della sessione richiede la password per riprendere il lavoro; spegnere il monitor non protegge l'accesso."],[2,"Quale formato di immagine supporta la trasparenza ed è comune per loghi e grafiche web?","PNG","MP4","DOCX","WAV","Il PNG gestisce il canale di trasparenza; MP4 è video, DOCX un documento, WAV un file audio."],[2,"Nella memoria di un computer, la memoria cache serve a:","Conservare dati usati di frequente per renderli più rapidamente disponibili alla CPU","Archiviare i file in modo permanente","Collegare il computer alla rete","Stampare più velocemente","La cache è una memoria piccola e molto veloce che riduce i tempi di accesso ai dati più richiesti."],[2,"In PowerPoint, l'effetto che si vede nel passaggio da una diapositiva alla successiva si chiama:","Transizione","Animazione personalizzata","Layout","Schema colori","La transizione riguarda il cambio di diapositiva; l'animazione riguarda i singoli oggetti all'interno della diapositiva."],[2,"Un file .csv contiene tipicamente:","Dati tabellari in testo semplice separati da un delimitatore","Un video compresso","Un programma eseguibile","Un'immagine vettoriale","CSV (Comma-Separated Values): righe di testo con valori separati da virgola o punto e virgola, apribili in Excel."],[2,"Un collegamento (scorciatoia) sul desktop a un documento viene eliminato. Che cosa accade al documento originale?","Resta intatto nella sua posizione originale","Viene eliminato anche lui","Viene spostato nel Cestino","Diventa di sola lettura","Il collegamento è solo un puntatore: cancellarlo non tocca il file a cui rimanda."],[2,"Quale tra questi dati è corretto?","1 GB corrisponde a circa mille MB","1 GB corrisponde a circa mille KB","1 MB corrisponde a circa mille GB","1 KB corrisponde a circa mille MB","La scala è KB < MB < GB < TB; ogni passaggio vale circa 1000 (o 1024 nella convenzione binaria)."],[3,"Un ufficio subisce un attacco ransomware che cifra tutti i file del server. Quale misura, adottata prima dell'attacco, avrebbe permesso il recupero più rapido senza pagare?","Backup regolari conservati offline o separati dalla rete","Un monitor più grande per ogni postazione","Una password più lunga per il Wi-Fi degli ospiti","L'installazione di un secondo browser","Se il backup è scollegato dalla rete il ransomware non può cifrarlo, e i dati si ripristinano senza pagare il riscatto."],[3,"In Excel, in B1 c'è =A1*2. Si inserisce una nuova riga sopra la riga 1. Che cosa accade alla formula, che ora si trova in B2?","Diventa =A2*2 e continua a riferirsi allo stesso dato","Resta =A1*2 e si riferisce alla nuova riga vuota","Restituisce sempre un errore","Viene cancellata","Quando si inseriscono righe, Excel aggiorna automaticamente i riferimenti perché puntino alle stesse celle, che si sono spostate in basso."],[3,"Un utente deve inviare via email a un collega un foglio Excel con dati personali di pazienti. Quale soluzione riduce di più il rischio in caso di invio al destinatario sbagliato?","Proteggere il file con una password comunicata al collega su un canale diverso","Scrivere «riservato» nell'oggetto dell'email","Inviare il file in formato .csv","Mettere il file in una cartella compressa senza password","La cifratura con password rende il file illeggibile a chi lo riceve per errore; comunicare la password su un altro canale evita che viaggi insieme al file."]],"4":[[1,"Che cos'è la PEC?","La posta elettronica certificata, che dà valore legale all'invio e alla ricezione dei messaggi","Un programma per creare presentazioni","Un tipo di chiavetta USB protetta","Un sistema per pagare online con carta di credito","La PEC attesta invio e consegna del messaggio con ricevute che hanno valore legale, come una raccomandata con ricevuta di ritorno."],[1,"Che cos'è lo SPID?","Il Sistema Pubblico di Identità Digitale per accedere ai servizi online della Pubblica Amministrazione","Un antivirus gratuito del Ministero","Un formato di file per documenti firmati","Un tipo di connessione in fibra ottica","Con lo SPID il cittadino accede con un'unica identità ai servizi online di PA e privati aderenti."],[1,"Che cos'è un «driver»?","Il software che permette al sistema operativo di comunicare con una periferica","Il cavo che collega la stampante","Un utente amministratore del computer","Un programma per navigare in Internet","Il driver traduce i comandi del sistema operativo in istruzioni comprensibili per un dispositivo (stampante, scheda video…)."],[1,"Un file con estensione .txt contiene:","Testo semplice, senza formattazione","Un'immagine ad alta risoluzione","Un foglio di calcolo con formule","Un file audio","Il .txt contiene solo caratteri, senza grassetti, tabelle o immagini."],[1,"Che cosa significa «scaricare» (download) un file?","Trasferirlo da Internet o da un server al proprio dispositivo","Trasferirlo dal proprio dispositivo a un server","Cancellarlo definitivamente","Comprimerlo per ridurne la dimensione","Download = dal server al proprio dispositivo; upload = dal proprio dispositivo al server."],[1,"Che cosa si intende per «freeware»?","Software distribuito gratuitamente","Software che si può usare solo senza connessione","Software a pagamento con abbonamento","Software privo di interfaccia grafica","Freeware significa uso gratuito, non necessariamente con codice sorgente aperto."],[1,"Quale componente elabora le immagini da visualizzare sul monitor?","La scheda video (GPU)","La scheda di rete","L'hard disk","La porta USB","La GPU (Graphics Processing Unit) calcola le immagini e le invia al monitor."],[1,"Che cos'è il Wi-Fi?","Una tecnologia per collegare i dispositivi a una rete senza fili","Un tipo di cavo di rete","Un programma di posta elettronica","Un sistema operativo per tablet","Il Wi-Fi collega dispositivi a una rete locale tramite onde radio."],[1,"In PowerPoint, quale tasto avvia la presentazione dalla prima diapositiva?","F5","F1","F12","ESC","F5 avvia la presentazione dall'inizio; ESC la interrompe; F1 apre la guida."],[1,"In Word, quale strumento crea un elenco con simboli all'inizio di ogni voce?","Elenco puntato","Interlinea","Allineamento giustificato","Colonne","L'elenco puntato antepone un simbolo a ogni paragrafo; l'elenco numerato un numero progressivo."],[1,"Che cos'è una «cartella» in un sistema operativo?","Un contenitore che raggruppa file e altre cartelle","Un file eseguibile","Un tipo di virus","Una periferica di archiviazione","Le cartelle organizzano i file in una struttura gerarchica ad albero."],[1,"Una webcam è un dispositivo:","Di input","Di output","Di memorizzazione permanente","Di alimentazione","La webcam acquisisce immagini e le invia al computer: è un dispositivo di ingresso."],[1,"Che cosa si intende per «malware»?","Qualsiasi software progettato per danneggiare o accedere senza autorizzazione a un sistema","Un programma di videoscrittura","Un aggiornamento ufficiale del sistema","Un componente hardware difettoso","Malware è il termine generale che comprende virus, worm, trojan, spyware, ransomware."],[1,"Un file con estensione .mp4 contiene normalmente:","Un video","Un documento di testo","Un database","Un foglio di calcolo","MP4 è un formato contenitore usato soprattutto per video."],[2,"In Excel, A1:A5 contengono 3, 8, 5, 10, 6. Quale valore restituisce =CONTA.SE(A1:A5;\">5\")?","3","4","24","2","I valori maggiori di 5 sono 8, 10 e 6: tre celle (il 5 non è maggiore di 5)."],[2,"Il numero decimale 20 in binario si scrive:","10100","10010","11000","10110","20 = 16 + 4 → 10100."],[2,"Il percorso C:\\Documenti\\Referti\\2026\\esame.pdf indica che il file esame.pdf si trova:","Nella cartella 2026, contenuta in Referti, contenuta in Documenti, sul disco C","Nella cartella Documenti, direttamente sul disco C","Nella cartella Referti, fuori dal disco C","Sul desktop, in una cartella chiamata C","Il percorso si legge da sinistra a destra, dalla radice del disco fino al file: ogni barra rovescia separa una cartella dalla successiva."],[2,"Qual è il vantaggio principale di un gestore di password (password manager)?","Permette di usare password diverse e complesse per ogni servizio senza doverle ricordare","Elimina la necessità di qualsiasi password","Rende il computer più veloce","Impedisce di ricevere spam","Il password manager conserva in modo cifrato password uniche per ogni account; l'utente ricorda solo la password principale."],[2,"Un utente carica 200 foto sul cloud: quale caratteristica della connessione conta di più?","La velocità di upload","La velocità di download","La risoluzione del monitor","La capienza della RAM","Caricare file verso un server dipende dalla banda in u i pubbliche sono sempre più lente","Perché la banca blocca automaticamente il conto","Perché il telefono si scarica più in fretta","Su reti aperte e non protette il traffico può essere intercettato; per operazioni sensibili meglio la rete mobile o una connessione protetta."],[2,"Un file occupa 2 GB e una chiavetta USB ha 1,5 GB liberi. Che cosa si può affermare?","Il file non può essere copiato sulla chiavetta così com'è","Il file può essere copiato perché la chiavetta è USB","Il file verrà compresso automaticamente","Il file verrà copiato ma senza estensione","Lo spazio libero (1,5 GB) è inferiore alla dimensione del file (2 GB)."],[2,"Quale azione aiuta a riconoscere un sito web falso che imita quello di una banca?","Controllare con attenzione l'indirizzo nella barra del browser","Verificare che il sito abbia molte immagini","Controllare che la pagina si carichi velocemente","Verificare che il sito abbia il logo della banca","I siti di phishing copiano grafica e logo, ma l'indirizzo è diverso da quello ufficiale (anche per una sola lettera)."],[3,"Uno sportello deve registrare ogni giorno gli incassi di 5 operatori e ottenere automaticamente il totale mensile per operatore. Quale strumento è più adatto?","Un foglio di calcolo con una riga per incasso e formule di somma per operatore","Un documento Word con una tabella da sommare a mano","Una presentazione PowerPoint aggiornata ogni giorno","Un file di testo con gli importi scritti in sequenza","Il foglio di calcolo ricalcola i totali automaticamente (es. con SOMMA.SE per operatore) e riduce gli errori manuali."],[3,"Un'operatrice ha scritto un documento importante sul PC dell'ufficio. Il disco si guasta. In quale situazione avrebbe perso meno lavoro?","Se avesse avuto il salvataggio automatico su una cartella di rete o cloud","Se avesse salvato il file in due cartelle dello stesso disco","Se avesse stampato solo la prima pagina","Se avesse chiuso Word senza salvare","Due copie sullo stesso disco si perdono insieme; la copia su un sistema diverso (rete o cloud) sopravvive al guasto."],[3,"In Excel A1 = 10 e B1 = 0. Quale formula evita che compaia un messaggio di errore quando si calcola A1/B1?","=SE(B1=0;\"\";A1/B1)","=A1/B1","=SOMMA(A1/B1)","=MEDIA(A1;B1)","La divisione per zero genera l'errore #DIV/0!; con SE si controlla prima che B1 sia diverso da zero. SOMMA(A1/B1) restituirebbe comunque l'errore."]],"5":[[1,"Che cosa indica, in Excel, il riferimento B3?","La cella all'incrocio tra la colonna B e la riga 3","La terza cella della riga B","Il terzo foglio della cartella di lavoro","La colonna B moltiplicata per 3","In Excel le colonne sono indicate da lettere e le righe da numeri: B3 = colonna B, riga 3."],[1,"Che cos'è la memoria ROM?","Una memoria di sola lettura che conserva i dati anche senza alimentazione","Una memoria volatile di lavoro","Un disco esterno rimovibile","La memoria della scheda video","ROM = Read Only Memory: contiene istruzioni permanenti, ad esempio il firmware di avvio."],[1,"Quale linguaggio si usa per descrivere la struttura delle pagine web?","HTML","SQL","ZIP","USB","HTML (HyperText Markup Language) definisce titoli, paragrafi, link e immagini di una pagina web."],[1,"Che cos'è un «trojan» (cavallo di Troia)?","Un malware nascosto dentro un programma apparentemente innocuo","Un antivirus per smartphone","Un dispositivo di rete senza fili","Un tipo di backup automatico","Il trojan si presenta come software utile ma, una volta installato, esegue azioni dannose."],[1,"Quale tasto, in Windows, cattura un'immagine dello schermo?","Stamp (Print Screen)","Canc","Ins","Bloc Num","Il tasto Stamp copia negli Appunti l'immagine dello schermo, che si può poi incollare."],[1,"Quale tipo di grafico di Excel è più adatto a mostrare come un totale si suddivide in parti percentuali?","Il grafico a torta","Il grafico a linee","Il grafico a dispersione","Il grafico azionario","Il grafico a torta rappresenta le parti di un intero; quello a linee è adatto agli andamenti nel tempo."],[1,"Che cos'è LibreOffice?","Una suite per l'ufficio gratuita e open source","Un sistema operativo per server","Un browser per dispositivi mobili","Un antivirus a pagamento","LibreOffice comprende Writer (testi), Calc (fogli di calcolo) e Impress (presentazioni)."],[1,"Che cos'è un «link» (collegamento ipertestuale)?","Un elemento che, cliccato, porta a un'altra pagina o risorsa","Un cavo di rete","Un tipo di file compresso","Una cartella del disco","Il link collega un testo o un'immagine a un'altra pagina, a un documento o a un indirizzo email."],[1,"Che cosa conserva la «cronologia» di un browser?","L'elenco dei siti visitati","Le password della posta elettronica","I file di sistema del computer","L'elenco dei programmi installati","La cronologia registra le pagine visitate e può essere cancellata dall'utente."],[1,"Un terabyte (TB) è:","Maggiore di un gigabyte","Minore di un megabyte","Uguale a un gigabyte","Minore di un kilobyte","Ordine crescente: KB < MB < GB < TB."],[1,"Una stampante multifunzione, oltre a stampare, di solito può:","Scansionare e fotocopiare","Elaborare i programmi al posto della CPU","Aumentare la memoria del computer","Collegare il computer alla rete elettrica","La multifunzione unisce stampante, scanner e fotocopiatrice (talvolta anche fax)."],[1,"In Word, l'allineamento che distribuisce il testo in modo uniforme tra i margini sinistro e destro si chiama:","Giustificato","Centrato","A sinistra","Rientro sporgente","Il testo giustificato è allineato su entrambi i margini."],[1,"Che cos'è Linux?","Un sistema operativo","Un programma di videoscrittura","Un tipo di processore","Un formato audio","Linux è un sistema operativo open source; Ubuntu e Fedora sono sue distribuzioni."],[1,"Che cos'è un «allegato» in un'email?","Un file inviato insieme al messaggio","Il campo con l'indirizzo del destinatario","La firma automatica in fondo al messaggio","Un messaggio di risposta automatica","L'allegato è un file (documento, immagine, PDF) unito al messaggio di posta."],[2,"Il numero binario 1111 a quale numero decimale corrisponde?","15","16","4","1111","8 + 4 + 2 + 1 = 15."],[2,"In Excel A1 = 4, A2 = 6, A3 = 10. Quale risultato restituisce =SOMMA(A1:A3)/A1?","5","20","2,5","4","SOMMA = 20; 20 diviso A1 (4) = 5."],[2,"Il programma di un computer si è bloccato e non risponde ai comandi. Quale combinazione di tasti permette di aprire la schermata da cui avviare Gestione attività?","CTRL + ALT + CANC","CTRL + SHIFT + A","ALT + F1","FN + ESC","CTRL+ALT+CANC apre una schermata di sistema da cui si può avviare Gestione attività e chiudere il programma bloccato."],[2,"Che cosa garantisce la navigazione «in incognito» (o privata) del browser?","Che cronologia e cookie della sessione non vengano salvati sul dispositivo","Che il sito visitato non possa sapere chi si collega","Che la connessione sia protetta da qualsiasi virus","Che il datore di lavoro non possa vedere il traffico di rete","La modalità privata non salva dati sul dispositivo, ma non rende anonimi: sito, gestore di rete e datore di lavoro possono vedere il traffico."],[2,"In un foglio Excel con 500 righe di prenotazioni, si vogliono vedere solo quelle di un certo reparto senza cancellare le altre. Quale strumento si usa?","Filtro","Ordina","Elimina righe","Unisci e allinea al centro","Il filtro nasconde temporaneamente le righe che non soddisfano il criterio, senza cancellarle."],[2,"In Word, l'interlinea regola:","La distanza tra le righe di un paragrafo","La distanza tra le parole","La dimensione dei caratteri","La larghezza dei margini","L'interlinea (singola, 1,5, doppia…) stabilisce lo spazio verticale tra le righe."],[2,"Un utente apre un sito e il browser segnala «La connessione non è privata / certificato non valido». Qual è la scelta più prudente?","Non inserire dati personali e abbandonare il sito","Inserire comunque le credenziali","Disattivare l'antivirus per accedere","Salvare la pagina tra i preferiti","L'avviso indica che l'identità del sito non è verificabile o la cifratura non è affidabile: il rischio è che qualcuno intercetti i dati."],[2,"Che cos'è un server?","Un computer che fornisce servizi o risorse ad altri computer della rete","Un computer usato solo per i videogiochi","Un cavo che collega due computer","Un programma che scrive testi","Il server offre servizi (posta, file, pagine web, database) ai computer client che lo interrogano."],[2,"In un'email, a cosa serve la firma automatica?","A inserire in automatico nome, ruolo e recapiti in fondo ai messaggi","A garantire il valore legale del messaggio","A cifrare il contenuto dell'email","A bloccare lo spam","La firma automatica è solo un testo predefinito; non va confusa con la firma digitale, che ha valore legale."],[2,"Quante combinazioni diverse si ottengono con 1 byte?","256","8","128","1024","1 byte = 8 bit → 2^8 = 256 combinazioni (valori da 0 a 255)."],[2,"Quale tra questi comportamenti rispetta le buone pratiche di sicurezza in ufficio?","Non annotare la password su un foglio attaccato al monitor","Usare la stessa password per tutti i servizi","Comunicare la propria password ai colleghi per comodità","Disattivare gli aggiornamenti per non perdere tempo","Le credenziali sono personali e vanno custodite; riusarle o condividerle moltiplica i rischi."],[2,"Un grafico a linee in Excel è particolarmente adatto a rappresentare:","L'andamento delle prenotazioni mese per mese","La percentuale di uomini e donne tra gli utenti","L'elenco alfabetico dei medici","Il testo di un regolamento","Il grafico a linee mostra l'evoluzione di un valore nel tempo."],[2,"Un file PDF viene inviato con un nome come «Fattura_scaduta.pdf.exe». Che cosa si deve sospettare?","Che sia un programma eseguibile camuffato da documento","Che sia un PDF con doppia protezione","Che sia un PDF compresso","Che sia un'immagine scansionata","Conta l'ultima estensione: .exe. La doppia estensione è un trucco classico per far aprire un malware."],[3,"Un operatore riceve dal responsabile, via chat interna, il messaggio: «Sono in riunione, comprami subito 5 carte regalo e mandami i codici». Il tono è insolito. Qual è la reazione corretta?","Verificare la richiesta con il responsabile tramite un altro canale prima di agire","Eseguire subito per non contrariare il responsabile","Inoltrare i codici a un collega perché li invii lui","Ignorare definitivamente ogni messaggio del responsabile","È uno schema tipico di truffa (account compromesso o falso): urgenza, richiesta insolita, pagamenti non tracciabili. Si verifica sempre su un canale indipendente."],[3,"In Excel si vuole calcolare in C2:C100 il prezzo con IVA al 22% dei valori di B2:B100, con l'aliquota scritta una sola volta in E1. Quale formula va scritta in C2 per poterla copiare in basso?","=B2*(1+$E$1)","=B2*(1+E1)","=$B$2*(1+$E$1)","=B2+22","Il prezzo deve cambiare riga per riga (B2 relativo), l'aliquota deve restare fissa ($E$1 assoluto). Con E1 relativo, copiando, il riferimento scivolerebbe su celle vuote."],[3,"In un ufficio i documenti condivisi vengono salvati sul PC di un solo collega e gli altri li ricevono via chiavetta. Qual è il problema principale di questa organizzazione?","Rischio di versioni diverse dello stesso file e perdita dei dati se quel PC si guasta","Il consumo eccessivo di carta","La lentezza del monitor","L'impossibilità di stampare","Senza un archivio condiviso unico e con backup, le copie circolano disallineate e un solo guasto può far perdere tutto."]]},"ING":{"1":[[1,"She ______ a doctor.","is","are","am","be","Con he/she/it il verbo «to be» al presente è «is»."],[1,"What is the plural of «child»?","children","childs","childes","childrens","«Child» ha un plurale irregolare: «children»."],[1,"«Thirty» means:","trenta","tredici","tre","trecento","Thirty = 30; thirteen = 13; three = 3; three hundred = 300."],[1,"The opposite of «cheap» is:","expensive","poor","low","easy","Cheap = economico; il contrario è expensive (costoso)."],[1,"I ______ to the office by bus every day.","go","goes","going","gone","Present simple, prima persona: «I go». La -s si aggiunge solo con he/she/it."],[1,"What is the past simple of «to go»?","went","goed","gone","going","«Go» è irregolare: go – went – gone. «Gone» è il participio passato."],[1,"«Mercoledì» in English is:","Wednesday","Tuesday","Thursday","Monday","Monday lunedì, Tuesday martedì, Wednesday mercoledì, Thursday giovedì."],[1,"There ______ two chairs in the room.","are","is","be","am","Con un soggetto plurale si usa «there are»."],[1,"My brother is ______ than me.","taller","tall","tallest","more tall","Comparativo di maggioranza degli aggettivi brevi: aggettivo + -er + than."],[2,"Come si dice in inglese «libreria», nel senso di negozio che vende libri?","bookshop","library","bookkeeper","bookmaker","«Library» è un falso amico: significa biblioteca. Il negozio è «bookshop» (o «bookstore»)."],[2,"If it rains tomorrow, we ______ at home.","will stay","would stay","stayed","stay","Periodo ipotetico di primo tipo (situazione reale o probabile): if + present, will + verbo."],[2,"She has lived in Rome ______ 2015.","since","for","from","ago","«Since» si usa con un momento preciso d'inizio (2015); «for» con una durata (for ten years)."],[2,"I have been waiting ______ two hours.","for","since","during","ago","«Two hours» è una durata, quindi si usa «for»."],[2,"The report ______ by the manager yesterday.","was written","has written","wrote","is writing","Forma passiva al passato (c'è «yesterday»): was/were + participio passato."],[2,"The man ______ car was stolen called the police.","whose","who","which","whom","«Whose» indica possesso: l'uomo la cui auto è stata rubata."],[2,"You ______ smoke in the hospital: it's forbidden.","mustn't","don't have to","needn't","can","«Mustn't» esprime un divieto; «don't have to» e «needn't» indicano che una cosa non è necessaria."],[2,"What does «eventually» mean?","alla fine","eventualmente","evidentemente","immediatamente","Falso amico: «eventually» significa «alla fine, prima o poi». «Eventualmente» si traduce «possibly» o «if necessary»."],[2,"Choose the correct sentence.","He doesn't like coffee.","He don't like coffee.","He not like coffee.","He doesn't likes coffee.","Negativa del present simple alla terza persona: doesn't + verbo base (senza -s)."],[2,"I'm looking forward ______ you.","to seeing","to see","seeing","for seeing","In «look forward to», «to» è una preposizione: è seguita dalla forma in -ing."],[2,"Which word is a synonym of «to begin»?","to start","to finish","to stop","to end","Begin e start significano entrambi «iniziare»."],[2,"At the moment she ______ on the phone.","is talking","talks","talked","has talk","«At the moment» indica un'azione in corso: present continuous (am/is/are + -ing)."],[2,"How ______ money do you need?","much","many","lot","few","«Money» è un nome non numerabile: si usa «how much». «How many» si usa con i numerabili."],[2,"The meeting is ______ Monday ______ 10 o'clock.","on – at","in – at","on – in","at – on","Con i giorni si usa «on» (on Monday), con le ore «at» (at 10 o'clock)."],[2,"What does «receipt» mean?","ricevuta","ricetta","ricevimento","reception","Receipt = ricevuta, scontrino. «Ricetta» di cucina è «recipe», quella del medico «prescription»."],[2,"On the phone, what does «Please hold the line» mean?","Resti in linea, per favore","Riattacchi, per favore","Richiami più tardi, per favore","Parli più forte, per favore","«Hold the line» = rimanere in linea, attendere senza riattaccare."],[3,"If I ______ more time, I would learn Spanish.","had","have","would have","will have","Periodo ipotetico di secondo tipo (situazione irreale nel presente): if + past simple, would + verbo."],[3,"She said: «I am tired». → She said that she ______ tired.","was","be","has been","will be","Nel discorso indiretto introdotto da un verbo al passato, il present simple diventa past simple: «am» → «was»."],[3,"Which sentence has the same meaning as «I haven't seen him for years»?","It's years since I last saw him.","I saw him for the first time years ago.","I have seen him every year.","I will see him in a few years.","Entrambe le frasi dicono che sono passati anni dall'ultima volta che l'ho visto."],[3,"By the time we arrived at the station, the train ______.","had already left","has already left","will already leave","already leaves","Past perfect: un'azione avvenuta prima di un'altra azione passata (il treno era partito prima che arrivassimo)."],[3,"«Patients must bring their health card and a valid ID. Appointments cancelled less than 24 hours in advance will be charged.» Which statement is true?","A patient who cancels 12 hours before the appointment will pay","Patients only need their health card","Cancellations are always free","Appointments cannot be cancelled","Le disdette fatte con meno di 24 ore di anticipo vengono addebitate: 12 ore prima rientra nel caso. Servono sia la tessera sanitaria sia un documento d'identità."]],"2":[[1,"We ______ very happy yesterday.","were","was","are","be","Past simple di «to be»: I/he/she/it was, you/we/they were. «Yesterday» richiede il passato."],[1,"What is the plural of «woman»?","women","womans","womens","womanes","Plurale irregolare: woman → women (come man → men)."],[1,"«Fifteen» means:","quindici","cinquanta","cinque","centocinquanta","Fifteen = 15; fifty = 50; five = 5."],[1,"The opposite of «early» is:","late","soon","fast","first","Early = presto, in anticipo; late = tardi, in ritardo."],[1,"He ______ football every Sunday.","plays","play","playing","is play","Present simple alla terza persona singolare: si aggiunge -s (he plays)."],[1,"What is the past simple of «to buy»?","bought","buyed","brought","buied","Buy – bought – bought. «Brought» è il passato di «bring» (portare)."],[1,"«Luglio» in English is:","July","June","August","January","June = giugno, July = luglio, August = agosto."],[1,"I can't find ______ keys.","my","me","I","mine","Davanti a un nome si usa l'aggettivo possessivo «my»; «mine» è il pronome (the keys are mine)."],[1,"This is the ______ film I have ever seen.","best","better","good","most good","Superlativo irregolare di «good»: good – better – the best."],[2,"What does «magazine» mean?","rivista","magazzino","negozio","quotidiano","Falso amico: magazine = rivista. Magazzino si dice «warehouse»; il quotidiano è «newspaper»."],[2,"If you heat ice, it ______.","melts","melt","would melt","melted","Periodo ipotetico di tipo zero (verità generali): if + present, present."],[2,"I ______ in this company for five years, and I'm still here.","have worked","work","am working","working","Un'azione iniziata nel passato che continua nel presente, con «for», richiede il present perfect."],[2,"She went to the pharmacy ______ some medicine.","to buy","for buy","buying","for to buy","Per esprimere lo scopo si usa l'infinito con «to»: «to buy» (per comprare)."],[2,"English ______ in many countries.","is spoken","speaks","is speaking","spoke","Forma passiva al presente: is/are + participio passato (l'inglese «è parlato»)."],[2,"This is the office ______ I work.","where","which","who","whose","Per indicare un luogo si usa il relativo «where» (l'ufficio dove lavoro)."],[2,"You ______ bring your passport: your ID card is enough.","don't have to","mustn't","must","have to","«Don't have to» = non è necessario. «Mustn't» significherebbe che è vietato portarlo."],[2,"What does «actually» mean?","in realtà","attualmente","attivamente","esattamente","Falso amico: actually = in realtà, effettivamente. «Attualmente» si traduce «currently» o «at present»."],[2,"Choose the correct question.","Where does she work?","Where she works?","Where does she works?","Where do she work?","Domanda al present simple, terza persona: does + soggetto + verbo base (senza -s)."],[2,"Would you mind ______ the window?","opening","to open","open","opened","Dopo «mind» si usa la forma in -ing."],[2,"Which word is a synonym of «to help»?","to assist","to refuse","to prevent","to ignore","Help e assist significano «aiutare, assistere»."],[2,"Look! It ______.","is snowing","snows","snowed","has snow","«Look!» segnala un'azione in corso in questo momento: present continuous."],[2,"There aren't ______ people in the waiting room.","many","much","a lot","little","«People» è plurale numerabile: nelle negative si usa «many». «A lot» richiederebbe «of»."],[2,"My birthday is ______ July.","in","on","at","by","Con i mesi si usa «in» (in July); con le date precise «on» (on 5th July)."],[2,"What does «sensible» mean?","assennato, ragionevole","sensibile","sensuale","sensazionale","Falso amico: sensible = assennato, di buon senso. «Sensibile» si traduce «sensitive»."],[2,"What does «Could you spell your surname, please?» mean?","Può dirmi il suo cognome lettera per lettera?","Può ripetere il suo nome di battesimo?","Può firmare qui, per favore?","Può parlare più lentamente?","To spell = fare lo spelling, dire le lettere una per una; surname = cognome."],[3,"If she had studied, she ______ the exam.","would have passed","would pass","will pass","passed","Periodo ipotetico di terzo tipo (passato irreale): if + past perfect, would have + participio passato."],[3,"He asked me: «Where do you live?» → He asked me where ______.","I lived","did I live","do I live","lived I","Nella domanda indiretta si usa l'ordine affermativo (soggetto + verbo) e, con verbo introduttivo al passato, il tempo arretra: «I lived»."],[3,"Which sentence has the same meaning as «It isn't necessary to book in advance»?","You don't need to book in advance.","You mustn't book in advance.","You must book in advance.","You can't book in advance.","«Don't need to» esprime assenza di necessità. «Mustn't» e «can't» esprimono un divieto o un'impossibilità."],[3,"I ______ here since 2020, and I still love it.","have lived","lived","am living","had lived","«Since 2020» più «still» indicano una situazione iniziata nel passato e ancora in corso: present perfect."],[3,"«The CUP office is open Monday to Friday, 8:00–13:00. On Tuesdays and Thursdays it also opens in the afternoon, 14:30–17:00.» On which days can you go to the office at 15:00?","On Tuesdays and Thursdays","Every day from Monday to Friday","Only on Mondays","On Saturdays","Alle 15:00 l'ufficio è aperto solo nelle aperture pomeridiane, cioè il martedì e il giovedì."]],"3":[[1,"Where ______ you from?","are","is","am","do","Con «you» il verbo «to be» è «are»: «Where are you from?» (Di dove sei?)."],[1,"What is the plural of «mouse» (the animal)?","mice","mouses","mices","mouse","Plurale irregolare: mouse → mice."],[1,"«Eighty» means:","ottanta","otto","diciotto","ottocento","Eighty = 80; eight = 8; eighteen = 18."],[1,"The opposite of «heavy» is:","light","strong","big","hard","Heavy = pesante; light = leggero."],[1,"She ______ TV every evening.","watches","watch","watching","is watch","Terza persona singolare del present simple: i verbi in -ch prendono -es (watches)."],[1,"What is the past simple of «to write»?","wrote","writed","written","writ","Write – wrote – written. «Written» è il participio passato."],[1,"«Autunno» in English is:","autumn","spring","winter","summer","Spring = primavera, summer = estate, autumn = autunno, winter = inverno."],[1,"Can I use ______ pen?","your","you","yours","yourself","Davanti a un nome serve l'aggettivo possessivo «your»."],[1,"Rome is ______ than Perugia.","bigger","big","biggest","more big","Comparativo di «big»: si raddoppia la consonante finale e si aggiunge -er (bigger)."],[2,"What does «parents» mean?","genitori","parenti","padrini","fratelli","Falso amico: parents = genitori. I parenti sono «relatives»."],[2,"Unless you hurry, you ______ the bus.","will miss","would miss","miss","missed","«Unless» significa «se non» e regge il periodo ipotetico di primo tipo: unless + present, will + verbo."],[2,"I ______ my keys! I can't open the door.","have lost","lose","am losing","had lose","Il present perfect indica un'azione passata con conseguenze nel presente (ora non posso aprire)."],[2,"She's very good ______ maths.","at","in","on","for","«Good at» = bravo in qualcosa."],[2,"The new hospital ______ next year.","will be built","will build","builds","is building","Passivo al futuro: will be + participio passato (l'ospedale non costruisce, viene costruito)."],[2,"The doctor ______ I spoke to was very kind.","who","which","whose","where","Per le persone si usa il relativo «who» (o «that»); «which» si usa per cose e animali."],[2,"You ______ see a doctor: that cough is getting worse.","should","shouldn't","mustn't","needn't","«Should» esprime un consiglio: dovresti andare dal medico."],[2,"What does «library» mean?","biblioteca","libreria","libraio","librettista","Falso amico: library = biblioteca. La libreria (negozio) è «bookshop»."],[2,"Choose the correct sentence.","I've never been to London.","I've never went to London.","I never have been to London.","I haven't never been to London.","Present perfect con «never» tra ausiliare e participio. In inglese non si usa la doppia negazione."],[2,"I'm used to ______ early.","getting up","get up","got up","gets up","In «be used to» (essere abituato a), «to» è una preposizione: è seguita dalla forma in -ing."],[2,"Which word is a synonym of «to finish»?","to complete","to begin","to open","to start","Finish e complete significano «finire, completare»."],[2,"When I arrived, they ______ dinner.","were having","have","are having","has had","Past continuous: un'azione in corso nel passato, interrotta dal mio arrivo."],[2,"I have ______ friends in London.","a few","a little","much","any","«Friends» è numerabile: «a few» (alcuni). «A little» e «much» si usano con i non numerabili; «any» nelle frasi affermative non va."],[2,"The train leaves ______ 7:15.","at","on","in","for","Con l'ora precisa si usa «at»."],[2,"What does «fabric» mean?","tessuto","fabbrica","fabbro","fabbricato","Falso amico: fabric = tessuto, stoffa. Fabbrica si dice «factory»."],[2,"What does «I'm afraid the doctor is not available» mean?","Mi dispiace, il medico non è disponibile","Ho paura del medico","Il medico ha paura","Il medico arriverà presto","«I'm afraid» è una formula di cortesia per dare una notizia sgradita: «mi dispiace, temo che…»."],[3,"I wish I ______ how to drive.","knew","know","would know","have known","Dopo «I wish», per un desiderio riferito al presente si usa il past simple: vorrei saper guidare (ma non so)."],[3,"«Someone has stolen my bike.» → «My bike ______.»","has been stolen","was stealing","has stolen","is stolen","La frase passiva mantiene il tempo (present perfect): has been + participio passato."],[3,"Which sentence has the same meaning as «She started working here three years ago»?","She has been working here for three years.","She worked here three years ago.","She will work here for three years.","She works here since three years.","Iniziare tre anni fa e lavorarci ancora si esprime con il present perfect continuous + for. «Works here since» è un errore tipico degli italiani."],[3,"Not only ______ late, but he also forgot the documents.","did he arrive","he arrived","he did arrive","arrived he","Con «not only» a inizio frase si ha l'inversione: ausiliare + soggetto + verbo (did he arrive)."],[3,"«To book a specialist visit you need a prescription from your GP. You can book online, by phone or at any CUP desk.» Which statement is true?","Without a prescription from your GP you cannot book a specialist visit","You can only book at a CUP desk","Online booking is not available","Your GP books the visit for you","Serve la prescrizione del medico di famiglia (GP = General Practitioner); la prenotazione si può fare online, per telefono o allo sportello."]],"4":[[1,"I ______ a student.","am","is","are","be","Con «I» il verbo «to be» al presente è «am»."],[1,"What is the plural of «tooth»?","teeth","tooths","teeths","toothes","Plurale irregolare: tooth → teeth (come foot → feet)."],[1,"«Twelve» means:","dodici","venti","due","duecento","Twelve = 12; twenty = 20; two = 2."],[1,"The opposite of «open» is:","closed","empty","free","broken","Open = aperto; closed = chiuso."],[1,"They ______ in Perugia.","live","lives","living","is live","Con «they» il present simple non prende la -s."],[1,"What is the past simple of «to see»?","saw","seed","seen","sawed","See – saw – seen. «Seen» è il participio passato."],[1,"«Dicembre» in English is:","December","November","October","September","September settembre, October ottobre, November novembre, December dicembre."],[1,"This book is ______.","mine","my","me","I","A fine frase, senza un nome dopo, si usa il pronome possessivo «mine» (è mio)."],[1,"Today is ______ than yesterday.","colder","cold","coldest","more cold","Comparativo degli aggettivi brevi: cold → colder than."],[2,"What does «argument» mean?","litigio, discussione","argomento","arguzia","accordo","Falso amico: argument = litigio o discussione animata. L'argomento di un discorso è «topic» o «subject»."],[2,"If I were you, I ______ that job.","would accept","will accept","accept","accepted","«If I were you» (se fossi in te) introduce un consiglio con il secondo tipo di periodo ipotetico: would + verbo."],[2,"How long ______ you known her?","have","do","are","did","«How long» con un'azione che continua fino a oggi richiede il present perfect: have you known."],[2,"He apologized ______ being late.","for","of","about","to","Si dice «apologize for something» (scusarsi per qualcosa)."],[2,"The results ______ tomorrow morning.","will be published","will publish","publish","are publishing","Passivo al futuro: i risultati non pubblicano, vengono pubblicati."],[2,"The book ______ you gave me is very interesting.","that","who","whose","where","Per le cose si usa il relativo «that» (o «which»); «who» si usa per le persone."],[2,"It's very late: you ______ go to bed.","had better","had better to","have better","would better","«Had better» + verbo base (senza «to») esprime un consiglio forte."],[2,"What does «to pretend» mean?","fingere","pretendere","prestare","preferire","Falso amico: to pretend = fingere. «Pretendere» si traduce «to demand» o «to expect»."],[2,"Choose the correct sentence.","There is a lot of traffic today.","There are a lot of traffic today.","There is many traffic today.","There is a lot traffic today.","«Traffic» è non numerabile: vuole il verbo al singolare e «a lot of» (non «many»)."],[2,"She stopped ______ because it was bad for her health.","smoking","to smoke","smoke","smoked","«Stop + -ing» = smettere di fare qualcosa. «Stop + to» significa fermarsi per fare qualcosa (qui non ha senso)."],[2,"Which word is a synonym of «big»?","large","small","tiny","thin","Big e large significano «grande»; small e tiny sono contrari."],[2,"While I ______, the phone rang.","was cooking","cooked","am cooking","cook","Azione in corso nel passato (past continuous) interrotta da un'azione breve (past simple)."],[2,"Can I have ______ water, please?","some","many","a","few","«Water» è non numerabile; nelle richieste cortesi si usa «some»."],[2,"We arrived ______ Rome late at night.","in","at","on","to","Con città e Paesi si dice «arrive in»; «arrive at» si usa con luoghi più piccoli (the station). «Arrive to» è un errore."],[2,"What does «estate» mean?","proprietà, tenuta","estate (la stagione)","stato","esteta","Falso amico: estate = proprietà, tenuta (real estate = beni immobili). La stagione estiva è «summer»."],[2,"What does «Please fill in this form» mean?","Compili questo modulo, per favore","Firmi questo modulo, per favore","Consegni questo modulo, per favore","Stampi questo modulo, per favore","To fill in = compilare; form = modulo. Firmare si dice «to sign»."],[3,"If he had left earlier, he ______ here now.","would be","would have been","will be","is","Periodo ipotetico misto: condizione nel passato (had left) con conseguenza nel presente (now), quindi would + verbo base."],[3,"«Don't touch it», she told me. → She told me ______ it.","not to touch","don't touch","to not touching","not touching","Nel discorso indiretto un ordine negativo diventa «tell someone not to + verbo»."],[3,"Which sentence has the same meaning as «I'm sure he isn't at home»?","He can't be at home.","He mustn't be at home.","He shouldn't be at home.","He needn't be at home.","Per una deduzione negativa quasi certa si usa «can't be». «Mustn't» esprime un divieto, non una deduzione."],[3,"The documents ______ before the meeting starts.","must be signed","must sign","must signing","must be sign","Passivo con verbo modale: modale + be + participio passato."],[3,"«Please arrive 15 minutes before your appointment. If you are more than 10 minutes late, your appointment may be rescheduled.» Luca's appointment is at 9:00. At what time is he asked to arrive?","8:45","9:10","9:00","8:50","Gli si chiede di arrivare 15 minuti prima: alle 8:45. Le 9:10 sono il limite oltre il quale l'appuntamento può essere spostato."]],"5":[[1,"______ is your name?","What","Who","Where","How","«What is your name?» = Come ti chiami? (letteralmente: qual è il tuo nome?)."],[1,"What is the plural of «box»?","boxes","boxs","boxies","box","I nomi che finiscono in -x, -s, -sh, -ch prendono -es al plurale."],[1,"«Forty» means:","quaranta","quattordici","quattro","quattrocento","Forty = 40 (attenzione: si scrive senza la «u» di four); fourteen = 14."],[1,"The opposite of «young» is:","old","new","little","tall","Young = giovane; old = vecchio, anziano."],[1,"My sister ______ a car.","has","have","having","is have","Terza persona singolare di «to have» al presente: has."],[1,"What is the past simple of «to come»?","came","comed","come","coming","Come – came – come. Il participio passato è uguale all'infinito."],[1,"«Venerdì» in English is:","Friday","Saturday","Sunday","Thursday","Thursday giovedì, Friday venerdì, Saturday sabato, Sunday domenica."],[1,"Where are ______ children?","their","there","they","them","«Their» è l'aggettivo possessivo (i loro figli); «there» significa «là»."],[1,"Mount Everest is the ______ mountain in the world.","highest","higher","high","most high","Superlativo degli aggettivi brevi: the + aggettivo + -est."],[2,"What does «lecture» mean?","lezione, conferenza","lettura","lettera","lettore","Falso amico: lecture = lezione universitaria o conferenza. La lettura è «reading»."],[2,"If you ______ any problems, call me.","have","will have","would have","had","In una frase con «if» riferita al futuro si usa il presente, non «will»."],[2,"We ______ each other since we were children.","have known","know","knew","are knowing","«Since» indica una situazione che dura dal passato a oggi: present perfect. «Know» non si usa alla forma progressiva."],[2,"It depends ______ the weather.","on","of","from","by","Si dice «depend on» (dipendere da)."],[2,"Your application ______ within ten days.","will be processed","will process","processes","is processing","Passivo al futuro: la domanda viene esaminata, non esamina."],[2,"The woman ______ son is my student lives next door.","whose","who","which","that","«Whose» esprime possesso: la donna il cui figlio è mio studente."],[2,"______ I open the window? It's hot in here.","Shall","Must","Will","Do","Per offrirsi di fare qualcosa si usa «Shall I…?» (Apro la finestra?)."],[2,"What does «to attend» mean?","partecipare, frequentare","attendere","attenzionare","attrarre","Falso amico: to attend = frequentare, partecipare (to attend a course). Attendere si dice «to wait»."],[2,"Choose the correct sentence.","She has just finished her work.","She has finished just her work.","She just has finish her work.","She has just finish her work.","«Just» (appena) si mette tra ausiliare e participio passato: has just finished."],[2,"I'd like ______ an appointment, please.","to make","making","make","made","Dopo «would like» si usa l'infinito con «to». Si dice «make an appointment»."],[2,"Which word is a synonym of «to buy»?","to purchase","to sell","to rent","to lend","Buy e purchase significano «acquistare»; sell = vendere, rent = affittare, lend = prestare."],[2,"What ______ you doing at 8 pm yesterday?","were","was","did","are","Past continuous alla seconda persona: were you doing."],[2,"There is ______ sugar left: we need to buy some.","little","few","many","a few","«Sugar» è non numerabile: «little» (poco). Few, many e a few si usano con i numerabili."],[2,"The pharmacy is ______ the bank and the post office.","between","among","through","along","«Between» indica una posizione in mezzo a due cose; «among» in mezzo a più di due."],[2,"What does «stamp» mean?","francobollo, timbro","stampa","stampante","stambecco","Stamp = francobollo o timbro. La stampa (giornali) è «the press», la stampante «printer»."],[2,"What does «Sorry, I didn't catch your name» mean?","Scusi, non ho capito il suo nome","Scusi, non ricordo il suo nome","Scusi, non conosco il suo nome","Scusi, ho sbagliato il suo nome","«Didn't catch» = non ho sentito o capito bene."],[3,"It's time we ______ home.","went","go","will go","have gone","Dopo «It's time + soggetto» si usa il past simple, anche se il senso è presente: è ora che andiamo a casa."],[3,"«I will call you tomorrow», he said. → He said he ______ me the next day.","would call","will call","called","calls","Nel discorso indiretto «will» diventa «would» e «tomorrow» diventa «the next day»."],[3,"Which sentence has the same meaning as «It's possible that she missed the train»?","She may have missed the train.","She must miss the train.","She should miss the train.","She can't have missed the train.","Possibilità riferita al passato: may/might have + participio passato. «Can't have» esprime il contrario (è impossibile che)."],[3,"Hardly ______ the office when it started to rain.","had I left","I had left","did I left","I left","Con «hardly» a inizio frase si ha l'inversione con il past perfect: Hardly had I left… when… (Ero appena uscito quando…)."],[3,"«Exemption from the prescription charge must be shown at the desk before payment. No refunds will be given afterwards.» Which statement is true?","If you show your exemption after paying, you will not get a refund","Refunds are always possible","Exemptions are not accepted at the desk","You must pay before showing your exemption","L'esenzione dal ticket va mostrata prima di pagare; dopo non si ottiene alcun rimborso."]]},"LD":{"1":[[1,"Se l'affermazione «Tutti gli studenti hanno superato l'esame» è falsa, quale delle seguenti è necessariamente vera?","Almeno uno studente non ha superato l'esame","Nessuno studente ha superato l'esame","Alcuni studenti hanno superato l'esame","Tutti gli studenti sono stati bocciati","La negazione di «tutti sono…» è «almeno uno non è…». Non si può sapere se qualcuno lo abbia superato o se tutti siano stati bocciati."],[1,"Marco è più alto di Luca e Luca è più alto di Piero. Quindi:","Marco è più alto di Piero","Piero è più alto di Marco","Luca è il più basso","Non si può stabilire chi sia il più alto","La relazione «più alto di» è transitiva: Marco > Luca > Piero."],[1,"«Se piove, Anna prende l'ombrello». Oggi piove. Quindi:","Anna prende l'ombrello","Anna non esce di casa","Anna non prende l'ombrello","Non si può dire nulla","È la forma più semplice di deduzione (modus ponens): se la condizione si verifica, si verifica anche la conseguenza."],[2,"«Se Paolo studia, supera l'esame». Paolo non ha superato l'esame. Quindi:","Paolo non ha studiato","Paolo ha studiato","L'esame era troppo difficile","Paolo supererà l'esame la prossima volta","Se la conseguenza non si è verificata, non si è verificata neppure la condizione (modus tollens)."],[2,"«Se Paolo studia, supera l'esame». Paolo ha superato l'esame. Quindi:","Non si può stabilire con certezza se Paolo abbia studiato","Paolo ha sicuramente studiato","Paolo sicuramente non ha studiato","L'esame era facile","La frase dice cosa succede se Paolo studia, non esclude che possa superare l'esame anche per altre ragioni. Concludere che ha studiato è un errore logico (affermazione del conseguente)."],[2,"«Tutti i medici sono laureati. Alcuni laureati sono sportivi». Quale conclusione è corretta?","Non si può concludere che qualche medico sia sportivo","Alcuni medici sono sportivi","Tutti gli sportivi sono medici","Nessun medico è sportivo","Gli sportivi potrebbero essere tutti laureati non medici: dalle premesse non segue nulla sul rapporto tra medici e sportivi."],[2,"«Tutti i gatti sono felini. Tutti i felini sono carnivori». Quindi:","Tutti i gatti sono carnivori","Tutti i carnivori sono gatti","Alcuni carnivori non sono felini","Nessun carnivoro è un gatto","L'insieme dei gatti è contenuto in quello dei felini, che è contenuto in quello dei carnivori. Non si può invertire la relazione."],[2,"In una fila Anna è davanti a Bruno, Carla è dietro a Bruno e Dario è davanti ad Anna. Chi è l'ultimo della fila?","Carla","Bruno","Anna","Dario","L'ordine, dal primo all'ultimo, è: Dario, Anna, Bruno, Carla."],[2,"Se l'affermazione «Nessun impiegato è arrivato in ritardo» è falsa, quale delle seguenti è necessariamente vera?","Almeno un impiegato è arrivato in ritardo","Tutti gli impiegati sono arrivati in ritardo","Nessun impiegato è arrivato puntuale","Alcuni impiegati non sono arrivati in ritardo","La negazione di «nessuno» è «almeno uno». Non si sa se siano stati tutti in ritardo o solo alcuni."],[2,"«Luca può salire sul treno solo se ha il biglietto». Luca è salito sul treno. Quindi:","Luca ha il biglietto","Luca non ha il biglietto","Luca ha pagato una multa","Non si può stabilire se Luca abbia il biglietto","«Solo se» indica una condizione necessaria: se Luca è salito, la condizione (avere il biglietto) doveva essere soddisfatta."],[2,"Il pacco A pesa più di B, C pesa meno di B e D pesa più di A. Qual è il pacco più leggero?","C","B","A","D","L'ordine dal più pesante al più leggero è D, A, B, C."],[2,"Se dopodomani è giovedì, che giorno era ieri?","Lunedì","Martedì","Mercoledì","Domenica","Se dopodomani è giovedì, oggi è martedì; quindi ieri era lunedì."],[2,"La figlia di mia sorella, per me, è:","Mia nipote","Mia cugina","Mia zia","Mia cognata","I figli di fratelli e sorelle sono nipoti; i cugini sono i figli degli zii."],[2,"«Alcuni impiegati parlano inglese. Tutti quelli che parlano inglese hanno un diploma». Quale affermazione è necessariamente vera?","Alcuni impiegati hanno un diploma","Tutti gli impiegati hanno un diploma","Tutti i diplomati parlano inglese","Alcuni impiegati non parlano inglese","Gli impiegati che parlano inglese hanno il diploma, quindi almeno alcuni impiegati sono diplomati. «Alcuni» non implica «alcuni no»: potrebbero parlare inglese tutti."],[2,"Parto da casa camminando verso nord, giro a destra e poi ancora a destra. In che direzione sto camminando?","Sud","Nord","Est","Ovest","Da nord, girando a destra si va verso est; girando ancora a destra si va verso sud."],[2,"«Tutti i dipendenti che lavorano allo sportello indossano il badge». Giulia non indossa il badge. Quindi:","Giulia non lavora allo sportello","Giulia lavora allo sportello","Giulia ha dimenticato il badge","Giulia è in ferie","Se lavorasse allo sportello indosserebbe il badge; poiché non lo indossa, non lavora allo sportello (modus tollens)."],[3,"L'affermazione «Non è vero che Marco è sia medico sia avvocato» equivale a:","Marco non è medico oppure non è avvocato","Marco non è né medico né avvocato","Marco è medico ma non avvocato","Marco è avvocato ma non medico","Negare «A e B» significa affermare «non A oppure non B» (almeno una delle due cose è falsa). Marco potrebbe essere solo medico, solo avvocato o nessuno dei due."],[2,"Luisa è più giovane di Maria e più vecchia di Nadia. Olga è più giovane di Nadia. Chi è la più anziana?","Maria","Luisa","Nadia","Olga","Dalla più anziana alla più giovane: Maria, Luisa, Nadia, Olga."],[2,"«Ogni volta che suona l'allarme, il custode apre la porta». Oggi il custode ha aperto la porta. Quindi:","Non è detto che l'allarme sia suonato","L'allarme è sicuramente suonato","L'allarme sicuramente non è suonato","Il custode ha commesso un errore","Il custode potrebbe aprire la porta anche per altri motivi: dall'effetto non si risale con certezza alla causa."],[2,"«Nessun rettile è un mammifero. Tutti i serpenti sono rettili». Quindi:","Nessun serpente è un mammifero","Alcuni serpenti sono mammiferi","Tutti i rettili sono serpenti","Alcuni mammiferi sono rettili","I serpenti sono contenuti tra i rettili, che sono del tutto separati dai mammiferi."],[3,"Tutti i colleghi di Elena parlano inglese; la maggior parte di loro parla anche francese e nessuno parla tedesco. Marco è un collega di Elena. Quindi:","Marco parla inglese e potrebbe parlare francese","Marco parla sicuramente inglese e francese","Marco parla francese ma non inglese","Marco potrebbe parlare tedesco","Che parli inglese è certo (tutti i colleghi); il francese lo parla «la maggior parte», quindi per Marco è solo possibile; il tedesco è escluso."],[3,"Su un'isola vivono cavalieri, che dicono sempre la verità, e furfanti, che mentono sempre. A dice: «B è un furfante». B dice: «A e io siamo dello stesso tipo». Che cosa sono A e B?","A è un cavaliere, B è un furfante","A è un furfante, B è un cavaliere","Sono entrambi cavalieri","Sono entrambi furfanti","Se A fosse furfante, B sarebbe cavaliere e direbbe il vero; ma A e B sarebbero di tipo diverso, quindi B mentirebbe: contraddizione. Allora A è cavaliere, B è furfante, e la frase di B («siamo dello stesso tipo») è infatti falsa."],[3,"A, B, C e D siedono su quattro sedie in fila numerate da 1 a 4. A non siede a nessuna delle due estremità; B siede sulla sedia 4; C siede accanto a B. Su quale sedia siede D?","1","2","3","Non si può stabilire","C accanto a B (sedia 4) deve stare sulla 3. A non è alle estremità, quindi è sulla 2. Resta la sedia 1 per D."],[3,"«Se il negozio è aperto, le luci sono accese. Le luci sono spente, quindi il negozio è chiuso». Quale ragionamento ha la stessa struttura logica?","Se c'è il sole, Marta va al mare. Marta non è al ma
