re, quindi non c'è il sole","Se c'è il sole, Marta va al mare. Marta è al mare, quindi c'è il sole","Se c'è il sole, Marta va al mare. Non c'è il sole, quindi Marta non va al mare","Se c'è il sole, Marta va al mare. C'è il sole, quindi Marta va al mare","Lo schema è «se A allora B; non B, quindi non A» (modus tollens). La seconda e la terza opzione sono ragionamenti scorretti; la quarta è corretta ma ha un'altra struttura (modus ponens)."],[3,"In un circolo, essere socio è condizione necessaria ma non sufficiente per partecipare al torneo. Quale affermazione è corretta?","Chi partecipa al torneo è socio","Tutti i soci partecipano al torneo","Chi non partecipa al torneo non è socio","Alcuni non soci partecipano al torneo","Necessaria: senza essere soci non si partecipa, quindi tutti i partecipanti sono soci. Non sufficiente: essere socio non basta, quindi non tutti i soci partecipano."],[3,"In una gara Aldo è arrivato prima di Bea ma dopo Carlo; Dora è arrivata dopo Carlo. Non ci sono arrivi a pari merito. Quale affermazione è certamente vera?","Carlo è arrivato primo","Dora è arrivata ultima","Bea è arrivata ultima","Aldo è arrivato secondo","Aldo, Bea e Dora sono tutti arrivati dopo Carlo, quindi Carlo è primo. La posizione di Dora rispetto ad Aldo e Bea non è nota: le altre affermazioni sono solo possibili."],[3,"Di queste tre affermazioni una sola è vera: (1) la chiave è nel cassetto; (2) la chiave non è nel cassetto; (3) la chiave è nella borsa. Che cosa si può concludere con certezza?","La chiave non è nella borsa","La chiave è nel cassetto","La chiave è nella borsa","La chiave non è nel cassetto","La (1) e la (2) si contraddicono: una delle due è per forza vera. Poiché solo una affermazione è vera, la (3) è falsa. Non si sa invece se la chiave sia nel cassetto."],[3,"Qual è la negazione di «Almeno un candidato ha risposto a tutte le domande»?","Ogni candidato ha lasciato almeno una domanda senza risposta","Nessun candidato ha risposto ad alcuna domanda","Tutti i candidati hanno risposto a tutte le domande","Almeno un candidato non ha risposto a nessuna domanda","La negazione di «almeno uno ha fatto tutto» è «nessuno ha fatto tutto», cioè ciascuno ha tralasciato almeno qualcosa."],[3,"In un certo anno il 3 marzo è lunedì. Che giorno della settimana è il 1° aprile dello stesso anno?","Martedì","Lunedì","Mercoledì","Domenica","Marzo ha 31 giorni: dal 3 marzo al 1° aprile passano 29 giorni, cioè 4 settimane e 1 giorno. Da lunedì si arriva a martedì."],[3,"Il padre di Luca è l'unico figlio maschio di mio nonno paterno. Sapendo che Luca non sono io, Luca per me è:","Mio fratello","Mio cugino","Mio nipote","Mio zio","L'unico figlio maschio del mio nonno paterno è mio padre. Luca ha il mio stesso padre, quindi è mio fratello."]],"2":[[1,"Paola è più veloce di Rita e Rita è più veloce di Sara. Chi è la più lenta?","Sara","Rita","Paola","Non si può stabilire","Paola > Rita > Sara: la più lenta è Sara."],[1,"«Tutti i cani sono mammiferi. Fido è un cane». Quindi:","Fido è un mammifero","Tutti i mammiferi sono cani","Fido non è un mammifero","Alcuni cani non sono mammiferi","Fido appartiene all'insieme dei cani, che è interamente contenuto in quello dei mammiferi."],[1,"Oggi è mercoledì. Che giorno sarà fra tre giorni?","Sabato","Venerdì","Domenica","Giovedì","Mercoledì + 3 giorni: giovedì, venerdì, sabato."],[2,"«Se un documento è firmato, è valido». Il documento X è valido. Quindi:","Non si può stabilire se X sia firmato","X è sicuramente firmato","X sicuramente non è firmato","Tutti i documenti validi sono firmati","La regola non dice che la firma sia l'unico modo per rendere valido un documento: dalla validità non si risale alla firma."],[2,"«Se la caldaia funziona, in casa fa caldo». In casa fa freddo. Quindi:","La caldaia non funziona","La caldaia funziona","È inverno","Qualcuno ha aperto le finestre","Se la conseguenza (caldo) è falsa, è falsa anche la condizione (caldaia funzionante)."],[2,"«Tutte le rose del giardino sono rosse». Questo fiore del giardino non è rosso. Quindi:","Non è una rosa","È una rosa","È un tulipano","È appassito","Se fosse una rosa del giardino sarebbe rossa; poiché non è rosso, non è una rosa. Di che fiore si tratti non è dato sapere."],[2,"«Alcuni infermieri sono donatori di sangue. Tutti i donatori di sangue fanno controlli periodici». Quale affermazione è necessariamente vera?","Alcuni infermieri fanno controlli periodici","Tutti gli infermieri fanno controlli periodici","Chi fa controlli periodici è un donatore","Nessun infermiere fa controlli periodici","Gli infermieri che donano sangue fanno i controlli, quindi almeno alcuni infermieri li fanno."],[2,"Se l'affermazione «Qualche ufficio è chiuso il sabato» è falsa, quale delle seguenti è necessariamente vera?","Nessun ufficio è chiuso il sabato","Tutti gli uffici sono chiusi il sabato","Almeno un ufficio è chiuso il sabato","Tutti gli uffici sono chiusi la domenica","Negare «qualche ufficio è chiuso» significa dire che nessun ufficio è chiuso."],[2,"Cinque auto sono in fila: la rossa è davanti alla blu, la blu è davanti alla gialla, la verde è dietro alla gialla e la nera è l'ultima. Quale auto è la prima?","La rossa","La blu","La verde","La gialla","L'ordine è: rossa, blu, gialla, verde, nera."],[2,"Il figlio del fratello di mia madre, per me, è:","Mio cugino","Mio nipote","Mio zio","Mio fratello","Il fratello di mia madre è mio zio; suo figlio è mio cugino."],[2,"Sono rivolto verso est. Mi giro di 180 gradi e poi giro a sinistra. Verso dove sono rivolto?","Sud","Nord","Est","Ovest","Da est, un giro di 180° porta a ovest; guardando a ovest, la sinistra è il sud."],[2,"Se ieri era domenica, che giorno sarà dopodomani?","Mercoledì","Martedì","Giovedì","Lunedì","Se ieri era domenica oggi è lunedì; dopodomani sarà mercoledì."],[2,"«Solo i soci possono votare in assemblea». Carlo ha votato. Quindi:","Carlo è socio","Carlo non è socio","Tutti i soci hanno votato","Non si può stabilire se Carlo sia socio","«Solo i soci» indica una condizione necessaria: chi ha votato è per forza socio."],[2,"«Nessun pesce respira con i polmoni. Il tonno è un pesce». Quindi:","Il tonno non respira con i polmoni","Il tonno respira con i polmoni","Alcuni pesci respirano con i polmoni","Nessun animale che respira con i polmoni vive in mare","Il tonno appartiene ai pesci, ai quali la premessa esclude la respirazione polmonare."],[2,"Giorgio ha 3 anni più di Elena; Elena ha 5 anni meno di Franco. Chi è il più grande dei tre?","Franco","Giorgio","Elena","Giorgio e Franco hanno la stessa età","Prendendo come riferimento Elena: Giorgio ha 3 anni in più, Franco 5 in più. Il più grande è Franco."],[2,"«Ogni volta che Luca va in palestra, il giorno dopo è stanco». Oggi Luca non è stanco. Quindi:","Ieri Luca non è andato in palestra","Ieri Luca è andato in palestra","Domani Luca andrà in palestra","Luca non va mai in palestra","Se ieri fosse andato in palestra oggi sarebbe stanco; non lo è, quindi ieri non ci è andato. Non si può dire nulla sugli altri giorni."],[2,"«Tutti gli iscritti al corso hanno superato il test». Anna non ha superato il test. Quindi:","Anna non è iscritta al corso","Anna è iscritta al corso","Il test era difficile","Anna si iscriverà al prossimo corso","Se fosse iscritta avrebbe superato il test; non l'ha superato, quindi non è iscritta."],[2,"«Alcuni A sono B. Nessun B è C». Quale conclusione è corretta?","Alcuni A non sono C","Nessun A è C","Tutti gli A sono C","Alcuni C sono A","Gli A che sono B non possono essere C, quindi almeno alcuni A non sono C. Degli altri A non si sa nulla."],[2,"«Tutti i dipendenti del reparto X usano il computer; alcuni di loro usano anche il tablet». Sara usa il tablet. Quindi:","Non si può stabilire se Sara lavori nel reparto X","Sara lavora nel reparto X","Sara non usa il computer","Sara sicuramente non lavora nel reparto X","Usare il tablet non è esclusivo del reparto X: le premesse non permettono di collocare Sara."],[3,"Su un'isola vivono cavalieri, che dicono sempre la verità, e furfanti, che mentono sempre. A dice: «B e io siamo entrambi furfanti». Che cosa sono A e B?","A è un furfante, B è un cavaliere","A è un cavaliere, B è un furfante","Sono entrambi furfanti","Sono entrambi cavalieri","Un cavaliere non potrebbe dire di essere furfante, quindi A è furfante e la sua frase è falsa: non sono entrambi furfanti, perciò B è un cavaliere."],[3,"Cinque libri sono su uno scaffale. Il blu è all'estremità sinistra, il nero all'estremità destra; il giallo è a destra del rosso; il verde sta tra il rosso e il giallo, accanto a entrambi. Quale libro occupa la posizione centrale?","Il verde","Il rosso","Il giallo","Il blu","Posizioni 1 e 5: blu e nero. Nelle posizioni 2, 3, 4 vanno, nell'ordine, rosso, verde, giallo. Al centro (posizione 3) c'è il verde."],[3,"Un vaso è stato rotto da una sola persona tra A, B e C, e una sola delle tre dice il vero. A: «È stato B». B: «Non sono stato io». C: «Non sono stato io». Chi ha rotto il vaso?","C","A","B","Non si può stabilire","Se fosse stato A, direbbero il vero B e C (due verità); se fosse stato B, direbbero il vero A e C. Solo se è stato C dice il vero una sola persona (B)."],[3,"Quale dei seguenti ragionamenti è logicamente corretto?","Tutti i pediatri sono medici; Laura è pediatra; quindi Laura è medico","Tutti i pediatri sono medici; Laura è medico; quindi Laura è pediatra","Se piove, la strada è bagnata; la strada è bagnata; quindi piove","Se piove, la strada è bagnata; non piove; quindi la strada è asciutta","Solo il primo è valido. Il secondo e il terzo risalgono dalla conseguenza alla causa; il quarto nega la condizione e ne deduce, senza fondamento, la negazione della conseguenza."],[3,"«Presentare lo scontrino è condizione sufficiente per ottenere il rimborso». Quale affermazione è corretta?","Chi presenta lo scontrino ottiene il rimborso","Chi ottiene il rimborso ha presentato lo scontrino","Chi non presenta lo scontrino non ottiene il rimborso","Solo con lo scontrino si ottiene il rimborso","Sufficiente significa che basta: con lo scontrino il rimborso è garantito. Non esclude che si possa ottenere il rimborso anche in altro modo."],[3,"Qual è la negazione di «Ogni sportello ha almeno un operatore»?","Almeno uno sportello non ha alcun operatore","Nessuno sportello ha operatori","Ogni sportello ha un solo operatore","Almeno uno sportello ha più di un operatore","Per negare «ogni sportello ha almeno un operatore» basta che esista uno sportello senza operatori."],[3,"Se il 10 di un mese è venerdì, che giorno della settimana era il 1° dello stesso mese?","Mercoledì","Giovedì","Martedì","Venerdì","Dal 1° al 10 passano 9 giorni. Il 3 è venerdì (10 − 7); il 1° è due giorni prima: mercoledì."],[3,"In una classe di 25 alunni, 15 studiano inglese e 12 francese; ognuno studia almeno una delle due lingue. Quanti alunni le studiano entrambe?","2","3","0","27","15 + 12 = 27 iscrizioni per 25 alunni: le 2 in più corrispondono agli alunni contati due volte, cioè quelli che studiano entrambe le lingue."],[3,"Marta mente sempre. Un giorno dice: «Oggi non è lunedì e ieri non era domenica». Che giorno è?","Lunedì","Domenica","Martedì","Non si può stabilire","Le due parti della frase dicono la stessa cosa (se oggi fosse lunedì, ieri sarebbe domenica). Poiché Marta mente, la frase è falsa: oggi è lunedì."],[3,"Paolo è più alto di Rino ma più basso di Sergio; Tino è più basso di Rino; Ugo è più alto di Tino. Quale affermazione è certamente vera?","Tino è il più basso","Sergio è il più alto","Ugo è più alto di Paolo","Ugo è più basso di Rino","Sergio > Paolo > Rino > Tino, e anche Ugo supera Tino: Tino è il più basso. La posizione di Ugo rispetto agli altri non è nota."],[3,"Anna dice: «La madre di quell'uomo è la suocera di mia madre». Quell'uomo, rispetto ad Anna, è:","Il padre o uno zio paterno","Il fratello","Il nonno","Un cugino","La suocera della madre di Anna è la madre del padre di Anna (nonna paterna). I suoi figli sono il padre di Anna o i fratelli di lui, cioè gli zii paterni."]],"3":[[1,"«Tutti i quadrati sono rettangoli». Questa figura è un quadrato. Quindi:","È un rettangolo","Non è un rettangolo","È un triangolo","Tutti i rettangoli sono quadrati","La figura appartiene ai quadrati, che sono tutti contenuti nei rettangoli."],[1,"Il libro A costa più del libro B; B costa più di C. Qual è il libro più economico?","C","B","A","Non si può stabilire","A > B > C: il più economico è C."],[1,"Se l'affermazione «Luigi ha sempre ragione» è falsa, allora:","Almeno una volta Luigi ha torto","Luigi ha sempre torto","Luigi non ha mai ragione","Luigi ha quasi sempre ragione","Negare «sempre» significa dire «non sempre»: basta una volta in cui ha torto."],[2,"«Se Marco vince la gara, riceve una medaglia». Marco non ha vinto. Quindi:","Non si può stabilire se Marco abbia ricevuto una medaglia","Marco non ha ricevuto alcuna medaglia","Marco ha ricevuto una medaglia","Marco vincerà la prossima gara","La regola dice cosa accade se vince, non cosa accade se non vince (potrebbe ricevere una medaglia anche per un secondo posto). Concludere «nessuna medaglia» è l'errore di negazione dell'antecedente."],[2,"«Chi ha la tessera entra gratis». Laura ha pagato l'ingresso. Quindi:","Laura non ha la tessera","Laura ha la tessera","L'ingresso costa poco","Laura ha perso la tessera","Se avesse la tessera entrerebbe gratis; poiché ha pagato, non ce l'ha (modus tollens)."],[2,"«Tutti i musicisti del gruppo suonano la chitarra; alcuni di loro suonano anche il pianoforte». Quale affermazione è necessariamente vera?","Alcuni musicisti del gruppo suonano sia la chitarra sia il pianoforte","Tutti i musicisti del gruppo suonano il pianoforte","Chi suona il pianoforte fa parte del gruppo","Nessun musicista del gruppo suona solo la chitarra","I musicisti che suonano il pianoforte suonano anche la chitarra, come tutti gli altri del gruppo."],[2,"Sul podio di una gara: Elisa non è prima, Franca è seconda e Gaia non è terza. Chi è prima?","Gaia","Elisa","Franca","Non si può stabilire","Franca è seconda. Elisa non è prima, quindi è terza. Resta il primo posto per Gaia (che infatti non è terza)."],[2,"Cammino 3 km verso nord e poi 4 km verso est. A quale distanza in linea d'aria mi trovo dal punto di partenza?","5 km","7 km","1 km","12 km","I due tratti formano i cateti di un triangolo rettangolo: √(3² + 4²) = √25 = 5 km."],[2,"Il suocero è:","Il padre del coniuge","Il marito della sorella","Il fratello del coniuge","Il nonno dei cugini","Suocero e suocera sono i genitori del marito o della moglie; il marito della sorella e il fratello del coniuge sono cognati."],[2,"«Nessun impiegato dell'ufficio fuma». Gino fuma. Quindi:","Gino non è un impiegato dell'ufficio","Gino è un impiegato dell'ufficio","Gino fuma solo fuori dall'ufficio","Alcuni impiegati dell'ufficio fumano","Se Gino fosse impiegato dell'ufficio non fumerebbe; fuma, quindi non lo è."],[2,"Se oggi è martedì, che giorno era 10 giorni fa?","Sabato","Domenica","Venerdì","Giovedì","7 giorni fa era martedì; altri 3 giorni indietro si arriva a sabato."],[2,"«Alcuni soci sono pensionati. Tutti i pensionati hanno la tessera verde». Quale affermazione è necessariamente vera?","Alcuni soci hanno la tessera verde","Tutti i soci hanno la tessera verde","Chi ha la tessera verde è pensionato","Nessun socio ha la tessera verde","I soci pensionati hanno la tessera verde, quindi almeno alcuni soci ce l'hanno."],[2,"Qual è la negazione di «Qualche treno è in ritardo»?","Nessun treno è in ritardo","Tutti i treni sono in ritardo","Qualche treno non è in ritardo","Qualche treno è in anticipo","«Qualche» (almeno uno) si nega con «nessuno»."],[2,"Nel test Anna ha preso più di Bice, Carla meno di Bice e Diana più di Anna. Chi ha preso il voto più basso?","Carla","Bice","Anna","Diana","Dal più alto al più basso: Diana, Anna, Bice, Carla."],[2,"«Ogni studente che consegna in ritardo perde un punto». Marco non ha perso punti. Quindi:","Marco non ha consegnato in ritardo","Marco ha consegnato in ritardo","Marco non ha consegnato","Marco ha preso il voto massimo","Se avesse consegnato in ritardo avrebbe perso un punto; non l'ha perso, quindi ha consegnato in tempo."],[2,"«Se è un giorno festivo, la biblioteca è chiusa». Oggi la biblioteca è aperta. Quindi:","Oggi non è un giorno festivo","Oggi è un giorno festivo","Oggi è domenica","La biblioteca apre anche nei festivi","Se fosse festivo sarebbe chiusa; è aperta, quindi non è festivo."],[2,"«Tutti gli sportelli aperti hanno la coda». Lo sportello 3 non ha la coda. Quindi:","Lo sportello 3 non è aperto","Lo sportello 3 è aperto","Lo sportello 3 è il più veloce","Nessuno sportello ha la coda","Se fosse aperto avrebbe la coda; non ce l'ha, quindi non è aperto."],[2,"«Alcuni X sono Y. Alcuni Y sono Z». Quale conclusione è corretta?","Non si può concludere nulla sul rapporto tra X e Z","Alcuni X sono Z","Nessun X è Z","Tutti gli X sono Z","Gli Y che sono X e gli Y che sono Z potrebbero essere elementi diversi: due premesse con «alcuni» non permettono conclusioni."],[2,"«Ogni sabato Paolo va al mercato». Oggi Paolo è al mercato. Quindi:","Non è detto che oggi sia sabato","Oggi è sicuramente sabato","Oggi sicuramente non è sabato","Paolo va al mercato tutti i giorni","La frase non esclude che Paolo vada al mercato anche in altri giorni."],[3,"Su un'isola vivono cavalieri, che dicono sempre la verità, e furfanti, che mentono sempre. A dice: «Almeno uno di noi due è un furfante». Che cosa sono A e B?","A è un cavaliere, B è un furfante","A è un furfante, B è un cavaliere","Sono entrambi furfanti","Sono entrambi cavalieri","Se A fosse furfante, la sua frase sarebbe vera (lui stesso è un furfante): impossibile. Quindi A è cavaliere, la frase è vera e il furfante deve essere B."],[3,"Ada, Bea, Ciro, Dino ed Ezio siedono su una panca. Ada è all'estremità sinistra; Bea è accanto ad Ada; Ciro non è accanto a Bea; Dino è alla destra di Ciro. Chi siede al centro?","Ezio","Ciro","Dino","Bea","Ada 1, Bea 2. Ciro non può stare in 3 (accanto a Bea) e deve avere Dino alla sua destra: Ciro 4, Dino 5. Al centro (3) resta Ezio."],[3,"Una moneta è in una di tre scatole. Scatola 1: «La moneta è qui». Scatola 2: «La moneta non è qui». Scatola 3: «La moneta non è nella scatola 1». Una sola scritta è vera. Dove si trova la moneta?","Nella scatola 2","Nella scatola 1","Nella scatola 3","Non si può stabilire","Se fosse nella 1, sarebbero vere le scritte 1 e 2; se fosse nella 3, le scritte 2 e 3. Solo con la moneta nella 2 è vera una sola scritta (la 3)."],[3,"«Tutti i treni regionali fermano a Spello; il treno delle 8 non ferma a Spello; quindi non è un regionale». Quale ragionamento ha la stessa struttura?","Tutti i soci pagano la quota; Rossi non paga la quota; quindi Rossi non è socio","Tutti i soci pagano la quota; Rossi paga la quota; quindi Rossi è socio","Tutti i soci pagano la quota; Rossi non è socio; quindi non paga la quota","Tutti i soci pagano la quota; Rossi è socio; quindi paga la quota","Schema: «tutti gli A sono B; x non è B; quindi x non è A». La seconda e la terza opzione sono ragionamenti non validi; la quarta è valida ma ha un'altra struttura."],[3,"«Il sistema si avvia solo se viene inserita la password». Quale affermazione è corretta?","Se il sistema si è avviato, la password è stata inserita","Se la password viene inserita, il sistema si avvia sicuramente","Se il sistema non si avvia, la password non è stata inserita","Inserire la password è condizione sufficiente per l'avvio","«Solo se» indica una condizione necessaria: senza password niente avvio, ma la password da sola potrebbe non bastare (potrebbe servire altro)."],[3,"Qual è la negazione di «Tutti i candidati hanno almeno una risposta esatta»?","Almeno un candidato non ha nessuna risposta esatta","Nessun candidato ha risposte esatte","Tutti i candidati hanno tutte le risposte esatte","Almeno un candidato ha almeno una risposta sbagliata","Basta un candidato con zero risposte esatte per rendere falsa l'affermazione."],[3,"In un anno non bisestile il 1° gennaio è giovedì. Che giorno della settimana è il 1° febbraio?","Domenica","Sabato","Lunedì","Giovedì","Gennaio ha 31 giorni = 4 settimane + 3 giorni: da giovedì si avanza di 3 giorni fino a domenica."],[3,"In un ufficio di 40 dipendenti, 22 vengono al lavoro in auto, 15 in bici e 8 usano entrambi i mezzi. Quanti non usano né l'auto né la bici?","11","3","19","29","Chi usa almeno un mezzo: 22 + 15 − 8 = 29. Gli altri sono 40 − 29 = 11."],[3,"Tra Luca e Marco uno dice sempre il vero e l'altro mente sempre. Luca dice: «Io e Marco diciamo entrambi il vero». Chi è il sincero?","Marco","Luca","Entrambi","Nessuno dei due","Se Luca fosse sincero direbbero il vero entrambi, ma uno dei due mente: impossibile. Quindi Luca mente e il sincero è Marco."],[3,"In una corsa Elio arriva prima di Fabio, Gino arriva dopo Fabio e Ivo arriva prima di Gino. Non ci sono pari merito. Quale affermazione è certamente vera?","Gino è arrivato ultimo","Elio è arrivato primo","Ivo è arrivato secondo","Fabio è arrivato terzo","Elio, Fabio e Ivo arrivano tutti prima di Gino, che quindi è ultimo. L'ordine tra Ivo, Elio e Fabio non è determinato del tutto."],[3,"Il nonno materno di mio figlio è mio padre. Allora io sono:","La madre del bambino","Il padre del bambino","Lo zio del bambino","Il nonno paterno del bambino","Il nonno materno è il padre della madre. Se è mio padre, la madre del bambino sono io."]],"4":[[1,"«Tutti gli uccelli hanno le piume». Il merlo è un uccello. Quindi:","Il merlo ha le piume","Il merlo non ha le piume","Tutti gli animali con le piume sono merli","Alcuni uccelli non hanno le piume","Il merlo appartiene agli uccelli, che per premessa hanno tutti le piume."],[1,"Rosa arriva prima di Sara e Sara arriva prima di Tina. Chi arriva per prima?","Rosa","Sara","Tina","Non si può stabilire","Rosa precede Sara, che precede Tina."],[1,"«Se Claudio ha la febbre, resta a casa». Claudio ha la febbre. Quindi:","Claudio resta a casa","Claudio va al lavoro","Claudio non ha la febbre","Non si può dire nulla","La condizione si è verificata, quindi si verifica anche la conseguenza."],[2,"«Se il semaforo è rosso, le auto si fermano». Le auto non si sono fermate. Quindi:","Il semaforo non era rosso","Il semaforo era rosso","Il semaforo era guasto","Le auto andavano troppo veloci","Se fosse stato rosso le auto si sarebbero fermate; non si sono fermate, quindi non era rosso (modus tollens)."],[2,"«Se Ugo mangia troppo, gli viene mal di stomaco». Ugo ha mal di stomaco. Quindi:","Non è detto che Ugo abbia mangiato troppo","Ugo ha sicuramente mangiato troppo","Ugo non ha mangiato nulla","Ugo deve andare dal medico","Il mal di stomaco potrebbe avere altre cause: dall'effetto non si risale con certezza a quella causa."],[2,"«Nessun gatto abbaia». Tom abbaia. Quindi:","Tom non è un gatto","Tom è un gatto","Tom è un cane","Alcuni gatti abbaiano","Se Tom fosse un gatto non abbaierebbe. Che sia un cane è possibile ma non dimostrato."],[2,"«Tutti i libri dello scaffale sono in inglese; alcuni libri dello scaffale sono gialli». Quale affermazione è necessariamente vera?","Alcuni libri gialli sono in inglese","Tutti i libri gialli sono in inglese","Tutti i libri in inglese sono sullo scaffale","Nessun libro giallo è in italiano","I libri gialli dello scaffale sono in inglese come tutti gli altri dello scaffale; degli altri libri gialli non si sa nulla."],[2,"Quale fatto basterebbe a rendere falsa la frase «Tutti gli uffici sono dotati di stampante»?","L'ufficio 5 non ha la stampante","L'ufficio 5 ha due stampanti","Alcuni uffici hanno la stampante","Nessuna stampante è a colori","Un'affermazione universale è smentita da un solo controesempio: un ufficio senza stampante."],[2,"In una graduatoria Nadia precede Omar, Piero segue Omar, Quinto precede Nadia e Rita viene subito dopo Omar e prima di Piero. Chi è al quarto posto?","Rita","Omar","Piero","Nadia","L'ordine è: Quinto, Nadia, Omar, Rita, Piero."],[2,"Il padre di mio cugino può essere:","Mio zio","Mio nonno","Mio fratello","Mio nipote","I cugini sono figli degli zii: il padre di un cugino è uno zio (o il marito di una zia)."],[2,"Guardo verso nord. Giro a sinistra, poi ancora a sinistra, poi a destra. Verso dove guardo?","Ovest","Est","Nord","Sud","Nord → sinistra: ovest → sinistra: sud → destra: ovest."],[2,"Se l'altro ieri era venerdì, che giorno sarà domani?","Lunedì","Domenica","Sabato","Martedì","L'altro ieri venerdì, ieri sabato, oggi domenica: domani sarà lunedì."],[2,"«Si accede al corso avanzato solo se si è superato il corso base». Elena frequenta il corso avanzato. Quindi:","Elena ha superato il corso base","Elena non ha frequentato il corso base","Elena è la migliore del corso","Non si può stabilire se abbia superato il corso base","«Solo se» indica una condizione necessaria: chi è nel corso avanzato ha per forza superato il base."],[2,"«Tutti i dipendenti assunti nel 2020 hanno seguito il corso sulla privacy». Rita non ha seguito il corso. Quindi:","Rita non è stata assunta nel 2020","Rita è stata assunta nel 2020","Rita seguirà il corso l'anno prossimo","Il corso non era obbligatorio","Se fosse stata assunta nel 2020 avrebbe seguito il corso; non l'ha seguito, quindi non è stata assunta quell'anno."],[2,"Andrea ha il doppio degli anni di Bruno; Bruno ha 4 anni più di Carlo; Carlo ha 6 anni. Quanti anni ha Andrea?","20","12","16","24","Bruno = 6 + 4 = 10; Andrea = 2 × 10 = 20."],[2,"«Quando nevica, la scuola chiude». Oggi la scuola è aperta. Quindi:","Oggi non nevica","Oggi nevica","Oggi è domenica","La scuola non chiude mai","Se nevicasse la scuola sarebbe chiusa; è aperta, quindi non nevica."],[2,"«Alcune piante del vivaio sono grasse. Nessuna pianta grassa ha bisogno di molta acqua». Quale affermazione è necessariamente vera?","Alcune piante del vivaio non hanno bisogno di molta acqua","Nessuna pianta del vivaio ha bisogno di molta acqua","Tutte le piante del vivaio hanno bisogno di molta acqua","Le piante che hanno bisogno di molta acqua sono grasse","Le piante grasse del vivaio non hanno bisogno di molta acqua; per le altre piante del vivaio non si sa nulla."],[2,"«Tutti gli Z sono W. Nessun W è K». Quale conclusione è corretta?","Nessuno Z è K","Alcuni Z sono K","Tutti i K sono Z","Alcuni W sono K","Gli Z sono contenuti nei W, che non hanno nulla in comune con i K: quindi neppure gli Z."],[2,"«Ogni mattina in cui c'è il sole, Mara va a correre». Stamattina Mara non è andata a correre. Quindi:","Stamattina non c'era il sole","Stamattina c'era il sole","Mara è malata","Mara corre solo di sera","Se ci fosse stato il sole sarebbe andata a correre; non ci è andata, quindi non c'era il sole."],[3,"Su un'isola vivono cavalieri, che dicono sempre la verità, e furfanti, che mentono sempre. A dice: «B è un cavaliere». B dice: «A e io siamo di tipo diverso». Che cosa sono A e B?","Sono entrambi furfanti","Sono entrambi cavalieri","A è un cavaliere, B è un furfante","A è un furfante, B è un cavaliere","Se A fosse cavaliere, anche B lo sarebbe, ma allora la frase di B («siamo diversi») sarebbe falsa: impossibile. Quindi A è furfante, e B non è un cavaliere: sono entrambi furfanti, e infatti B mente dicendo che sono diversi."],[3,"Cinque uffici in un corridoio sono numerati da 1 a 5. Sara è nell'ufficio 1 e Tea nel 3; Ugo è in un ufficio con numero pari; Vito non è accanto a Tea; Zeno è accanto a Vito. In quale ufficio lavora Zeno?","4","2","5","Non si può stabilire","Vito non può stare nel 2 o nel 4 (accanto a Tea) e l'1 è occupato: Vito è nel 5. Zeno, accanto a Vito, è nel 4; Ugo è nel 2."],[3,"Uno tra Aldo, Bruno e Carlo ha mangiato la torta e una sola delle tre frasi è vera. Aldo: «Non sono stato io». Bruno: «Non è stato Carlo». Carlo: «È stato Aldo». Chi ha mangiato la torta?","Carlo","Aldo","Bruno","Non si può stabilire","Se fosse stato Aldo sarebbero vere le frasi di Bruno e di Carlo; se fosse stato Bruno, quelle di Aldo e di Bruno. Solo se è stato Carlo è vera una frase sola (quella di Aldo)."],[3,"Quale dei seguenti ragionamenti contiene un errore logico?","Se Anna è a Roma, è in Italia; Anna è in Italia; quindi è a Roma","Se Anna è a Roma, è in Italia; Anna non è in Italia; quindi non è a Roma","Se Anna è a Roma, è in Italia; Anna è a Roma; quindi è in Italia","Tutti i romani sono italiani; Anna è romana; quindi è italiana","Essere in Italia non implica essere a Roma: Anna potrebbe trovarsi in qualsiasi altra città italiana (affermazione del conseguente). Gli altri tre ragionamenti sono validi."],[3,"«Si ottiene il bonus se e solo se si superano i 100 punti». Chi non ha ottenuto il bonus:","Non ha superato i 100 punti","Ha superato i 100 punti","Potrebbe aver superato i 100 punti","Ha esattamente 100 punti","«Se e solo se» indica una condizione necessaria e sufficiente: senza bonus, i 100 punti non sono stati superati. Avere esattamente 100 punti è possibile, ma non certo."],[3,"Qual è la negazione di «Ogni giorno qualcuno arriva in ritardo»?","C'è almeno un giorno in cui nessuno arriva in ritardo","Ogni giorno nessuno arriva in ritardo","Qualcuno arriva sempre in ritardo","C'è almeno un giorno in cui tutti arrivano in ritardo","Si negano entrambi i quantificatori: «ogni giorno» diventa «almeno un giorno», «qualcuno» diventa «nessuno»."],[3,"Se il 25 dicembre è mercoledì, che giorno della settimana è il 6 gennaio successivo?","Lunedì","Mercoledì","Domenica","Martedì","Dal 25 dicembre al 6 gennaio passano 12 giorni (6 fino al 31 dicembre, più 6 di gennaio): 12 = 7 + 5. Mercoledì + 5 giorni = lunedì."],[3,"In un gruppo di 30 persone, 18 hanno un cane, 10 un gatto e 5 hanno sia un cane sia un gatto. Quante persone hanno solo il cane?","13","18","23","8","Dei 18 che hanno un cane, 5 hanno anche il gatto: solo cane = 18 − 5 = 13."],[3,"Paolo mente il lunedì, il martedì e il mercoledì e dice il vero negli altri giorni. Un giorno dice: «Ieri ho mentito». In quale giorno può aver detto questa frase?","Lunedì o giovedì","Solo giovedì","Solo lunedì","Mercoledì o domenica","Giovedì dice il vero, e ieri (mercoledì) ha davvero mentito. Lunedì mente, e infatti ieri (domenica) aveva detto il vero. Negli altri giorni la frase risulterebbe incoerente."],[3,"Quattro scatole hanno pesi diversi. A pesa più di B; C pesa meno di A; D pesa più di C. Quale affermazione è certamente vera?","C non è la più pesante","A è la più pesante","B è la più leggera","D pesa più di A","C pesa meno sia di A sia di D, quindi non può essere la più pesante. Le altre affermazioni sono solo possibili."],[3,"Il fratello di mia madre ha un figlio e una figlia. Questa figlia, per mia madre, è:","La nipote","La cugina","La sorella","La figlia","È la figlia del fratello di mia madre: per mia madre è una nipote (per me è una cugina)."]],"5":[[1,"«Tutti i metalli conducono l'elettricità». Il rame è un metallo. Quindi:","Il rame conduce l'elettricità","Il rame non conduce l'elettricità","Tutti i conduttori sono metalli","Alcuni metalli non conducono","Il rame appartiene ai metalli, che per premessa conducono tutti l'elettricità."],[1,"Oggi è venerdì. Che giorno era ieri?","Giovedì","Sabato","Mercoledì","Domenica","Il giorno che precede il venerdì è il giovedì."],[1,"Gianni è più vecchio di Ivo e Ivo è più vecchio di Lara. Chi è il più giovane?","Lara","Ivo","Gianni","Non si può stabilire","Gianni > Ivo > Lara per età: la più giovane è Lara."],[2,"«Se il treno è in ritardo, Carla perde la coincidenza». Carla non ha perso la coincidenza. Quindi:","Il treno non era in ritardo","Il treno era in ritardo","Carla ha preso un taxi","La coincidenza era in ritardo","Se il treno fosse stato in ritardo, Carla avrebbe perso la coincidenza; non l'ha persa, quindi il treno era in orario."],[2,"«Se Dario si allena, vince la gara». Dario non si è allenato. Quindi:","Non si può stabilire se Dario abbia vinto","Dario ha sicuramente perso","Dario ha sicuramente vinto","Dario non ha partecipato alla gara","La regola non dice cosa accade se Dario non si allena: potrebbe vincere comunque. Concludere che ha perso è l'errore di negazione dell'antecedente."],[2,"«Solo chi ha prenotato può essere servito allo sportello». Maria è stata servita. Quindi:","Maria aveva prenotato","Maria non aveva prenotato","Tutti quelli che prenotano vengono serviti","Non si può stabilire se Maria avesse prenotato","La prenotazione è condizione necessaria: chi è stato servito aveva prenotato."],[2,"«Alcuni studenti della classe giocano a calcio. Tutti quelli che giocano a calcio si allenano il martedì». Quale affermazione è necessariamente vera?","Alcuni studenti della classe si allenano il martedì","Tutti gli studenti della classe si allenano il martedì","Chi si allena il martedì gioca a calcio","Nessuno studente della classe si allena il martedì","Gli studenti che giocano a calcio si allenano il martedì, quindi almeno alcuni studenti della classe lo fanno."],[2,"Qual è la negazione di «Almeno un dipendente lavora di sabato»?","Nessun dipendente lavora di sabato","Tutti i dipendenti lavorano di sabato","Almeno un dipendente non lavora di sabato","Alcuni dipendenti lavorano di domenica","«Almeno uno» si nega con «nessuno»."],[2,"Nella coda a uno sportello ci sono quattro persone. Gino è il primo, Franco è subito dopo Gino, Elsa è subito dopo Franco e Ilaria è l'ultima. In quale posizione si trova Elsa?","Terza","Seconda","Quarta","Prima","Gino 1°, Franco 2°, Elsa 3°, Ilaria 4°."],[2,"La moglie di mio fratello, per me, è:","Mia cognata","Mia nuora","Mia suocera","Mia cugina","Il coniuge di un fratello o di una sorella è un cognato o una cognata; la nuora è la moglie del figlio."],[2,"Sono rivolto verso sud e giro a destra di 90 gradi. Verso dove sono rivolto?","Ovest","Est","Nord","Sud","Guardando a sud, la destra corrisponde all'ovest."],[2,"Fra quattro giorni sarà lunedì. Che giorno è oggi?","Giovedì","Venerdì","Mercoledì","Sabato","Si torna indietro di 4 giorni da lunedì: domenica, sabato, venerdì, giovedì."],[2,"«Tutti gli oggetti di questa scatola sono di plastica». La penna non è di plastica. Quindi:","La penna non è in questa scatola","La penna è in questa scatola","La penna è di metallo","Nessun oggetto di plastica è una penna","Se fosse nella scatola sarebbe di plastica; non lo è, quindi non si trova lì. Di che materiale sia non è detto."],[2,"«Nessun socio del club ha meno di 18 anni». Luca ha 16 anni. Quindi:","Luca non è socio del club","Luca è socio del club","Luca diventerà socio a 18 anni","Il club accetta i minorenni","Se Luca fosse socio avrebbe almeno 18 anni; ne ha 16, quindi non è socio."],[2,"Tra 5 anni Marta avrà il triplo degli anni che oggi ha sua figlia, che ha 12 anni. Quanti anni ha oggi Marta?","31","36","41","17","Tra 5 anni Marta avrà 3 × 12 = 36 anni: oggi ne ha 36 − 5 = 31."],[2,"«Tutti i dipendenti del turno di notte ricevono un'indennità. Alcuni dipendenti che ricevono l'indennità lavorano a Terni». Quale conclusione è corretta?","Non si può concludere che qualche dipendente del turno di notte lavori a Terni","Alcuni dipendenti del turno di notte lavorano a Terni","Tutti i dipendenti del turno di notte lavorano a Terni","Nessun dipendente del turno di notte lavora a Terni","L'indennità potrebbe essere data anche ad altri: quelli di Terni potrebbero essere dipendenti con indennità ma non del turno di notte."],[2,"«Alcuni P sono Q. Tutti i Q sono R». Quale conclusione è corretta?","Alcuni P sono R","Tutti i P sono R","Tutti gli R sono Q","Nessun P è R","I P che sono Q sono anche R, quindi almeno alcuni P sono R."],[2,"«Ogni volta che Sofia è in ritardo, prende il taxi». Oggi Sofia ha preso il taxi. Quindi:","Non è detto che oggi Sofia fosse in ritardo","Oggi Sofia era sicuramente in ritardo","Oggi Sofia sicuramente non era in ritardo","Sofia prende sempre il taxi","Sofia potrebbe prendere il taxi anche per altri motivi."],[2,"«Nessun documento incompleto viene accettato». La domanda di Piero è stata accettata. Quindi:","La domanda di Piero era completa","La domanda di Piero era incompleta","La domanda di Piero è stata controllata due volte","Tutte le domande complete vengono accettate","Se fosse stata incompleta non sarebbe stata accettata; poiché è stata accettata, era completa."],[3,"Su un'isola vivono cavalieri, che dicono sempre la verità, e furfanti, che mentono sempre. A dice: «B è un furfante». B dice: «C è un furfante». C dice: «A e B sono entrambi furfanti». Che cosa sono i tre?","A furfante, B cavaliere, C furfante","A cavaliere, B furfante, C cavaliere","Tutti e tre furfanti","A cavaliere, B cavaliere, C furfante","Se C fosse cavaliere, A e B sarebbero furfanti; ma allora A, dicendo «B è furfante», direbbe il vero: impossibile. Quindi C è furfante, B (che lo dice) è cavaliere e A (che accusa B) è furfante. La frase di C è infatti falsa."],[3,"Quattro colleghi, A, B, C e D, parcheggiano in quattro posti in fila numerati da 1 a 4. C è nel posto 2; D non è nel posto 4; A e B non sono vicini. In quale posto è D?","3","1","4","Non si può stabilire","Se D fosse nel posto 1, A e B occuperebbero il 3 e il 4, che sono vicini. Quindi D è nel 3, e A e B sono nell'1 e nel 4."],[3,"L'auto nuova di Gio è rossa, blu o verde, e una sola di queste tre frasi è vera. Anna: «È rossa o blu». Bea: «Non è blu». Carla: «È verde». Di che colore è l'auto?","Blu","Rossa","Verde","Non si può stabilire","Se fosse rossa sarebbero vere le frasi di Anna e di Bea; se fosse verde, quelle di Bea e di Carla. Solo con l'auto blu è vera una frase sola (quella di Anna)."],[3,"«Tutti i pittori sono artisti; alcuni artisti sono famosi; quindi alcuni pittori sono famosi». Questo ragionamento:","Non è valido, perché gli artisti famosi potrebbero non essere pittori","È valido, perché i pittori sono artisti","È valido, perché la conclusione è vera nella realtà","Non è valido, perché nessun pittore è famoso","La validità dipende dalla forma, non dalla verità della conclusione nella realtà: gli artisti famosi potrebbero essere tutti scultori o musicisti."],[3,"Nella frase «Se piove, il campo è bagnato», la pioggia è per il campo bagnato una condizione:","Sufficiente","Necessaria","Necessaria e sufficiente","Né necessaria né sufficiente","«Se A allora B»: A basta a produrre B (sufficiente). Non è necessaria, perché il campo potrebbe bagnarsi anche per altre ragioni (irrigazione)."],[3,"Qual è la negazione di «Nessuno sportello è chiuso e tutti gli operatori sono presenti»?","Almeno uno sportello è chiuso oppure almeno un operatore è assente","Tutti gli sportelli sono chiusi e tutti gli operatori sono assenti","Almeno uno sportello è chiuso e almeno un operatore è assente","Nessuno sportello è aperto oppure nessun operatore è presente","Negare «A e B» significa «non A oppure non B»: basta che una sola delle due parti sia falsa."],[3,"In un anno bisestile il 1° febbraio è sabato. Che giorno della settimana è il 1° marzo?","Domenica","Sabato","Lunedì","Venerdì","Nell'anno bisestile febbraio ha 29 giorni = 4 settimane + 1 giorno: da sabato si passa a domenica."],[3,"A un corso, 12 persone parlano inglese, 9 spagnolo, 4 parlano entrambe le lingue e 3 non ne parlano nessuna. Quante persone ci sono in tutto?","20","28","17","24","Chi parla almeno una lingua: 12 + 9 − 4 = 17; aggiungendo le 3 che non ne parlano nessuna si ottiene 20."],[3,"Di due fratelli, uno mente sempre e l'altro dice sempre il vero. Uno dei due dice: «Almeno uno di noi due mente». Chi ha parlato?","Il fratello sincero","Il fratello bugiardo","Non si può stabilire","Hanno parlato entrambi","La frase è vera (uno dei due mente davvero), quindi l'ha pronunciata chi dice sempre il vero."],[3,"Vera ha più punti di Walter; Xenia ne ha meno di Walter; Yuri più di Vera; Zoe meno di Vera ma più di Xenia. Non ci sono pari merito. Quale affermazione è certamente vera?","Xenia ha il punteggio più basso","Zoe è terza","Walter è secondo","Zoe ha più punti di Walter","Xenia sta sotto Walter e sotto Zoe, che a loro volta stanno sotto Vera e Yuri: è ultima. L'ordine tra Zoe e Walter non è determinato."],[3,"Un uomo, che non ha fratelli, indica una foto e dice: «Il padre di quest'uomo è il figlio di mio padre». Chi è l'uomo nella foto?","Suo figlio","Lui stesso","Suo padre","Suo nipote","Senza fratelli, «il figlio di mio padre» è lui stesso. Quindi il padre dell'uomo nella foto è lui: nella foto c'è suo figlio."]]},"LN":{"1":[[1,"Quanto è il 15% di 200?","30","15","20","35","200 × 15 / 100 = 30. Trucco: il 10% è 20, il 5% è 10."],[1,"Quanto sono i 3/4 di 80?","60","20","40","75","80 : 4 = 20; 20 × 3 = 60."],[1,"Completare la successione: 2, 4, 6, 8, …","10","9","12","16","Si aggiunge 2 a ogni termine."],[2,"Un'operatrice registra 45 prenotazioni in 3 ore. Quante ne registra in 5 ore allo stesso ritmo?","75","60","90","70","45 : 3 = 15 prenotazioni all'ora; 15 × 5 = 75."],[2,"Un articolo costa 80 € ed è scontato del 25%. Qual è il prezzo finale?","60 €","55 €","65 €","20 €","Il 25% di 80 è 20; 80 − 20 = 60 €. Attenzione: 20 € è lo sconto, non il prezzo."],[2,"Qual è la media aritmetica di 6, 8, 10 e 12?","9","8","10","36","(6 + 8 + 10 + 12) : 4 = 36 : 4 = 9."],[2,"Completare la successione: 3, 6, 12, 24, …","48","30","36","42","Ogni termine è il doppio del precedente."],[2,"Completare la successione: 1, 4, 9, 16, 25, …","36","30","34","49","Sono i quadrati dei numeri naturali: 1², 2², 3², 4², 5², 6² = 36."],[2,"Se 5 operai costruiscono un muro in 12 giorni, quanti giorni impiegano 6 operai che lavorano allo stesso ritmo?","10","14","15","11","Proporzionalità inversa: il lavoro totale è 5 × 12 = 60 giornate-operaio; 60 : 6 = 10 giorni."],[2,"Quanto si ottiene dividendo 45 per 0,5?","90","22,5","45,5","9","Dividere per 0,5 equivale a moltiplicare per 2: 45 × 2 = 90."],[2,"Un'auto percorre 180 km in 2 ore. Qual è la sua velocità media?","90 km/h","80 km/h","100 km/h","360 km/h","Velocità = spazio : tempo = 180 : 2 = 90 km/h."],[2,"Il 20% di un numero è 14. Qual è il numero?","70","28","56","84","Se il 20% (cioè 1/5) vale 14, il numero intero vale 14 × 5 = 70."],[2,"Quanto fa 2/3 + 1/6?","5/6","3/9","1/2","3/6","Si porta tutto in sesti: 4/6 + 1/6 = 5/6."],[2,"Completare la successione: 5, 8, 11, 14, …","17","16","18","15","Si aggiunge 3 a ogni termine."],[2,"Un orologio segna le 9:45. Che ora segnerà fra 2 ore e 30 minuti?","12:15","11:75","12:45","11:15","9:45 + 2 ore = 11:45; + 30 minuti = 12:15."],[2,"Se x + 7 = 3x − 5, quanto vale x?","6","2","12","−6","Portando le x a destra e i numeri a sinistra: 7 + 5 = 3x − x, cioè 12 = 2x, quindi x = 6."],[2,"In una classe di 24 studenti i 3/8 sono ragazze. Quanti sono i ragazzi?","15","9","16","12","Le ragazze sono 24 × 3/8 = 9; i ragazzi sono 24 − 9 = 15."],[2,"Quanti secondi ci sono in un'ora e un quarto?","4500","3600","4200","75","1 ora e 15 minuti = 75 minuti; 75 × 60 = 4500 secondi."],[2,"Luca ha il triplo dei soldi di Marco; insieme hanno 60 €. Quanti euro ha Luca?","45","20","40","15","Marco = 1 parte, Luca = 3 parti: 4 parti = 60 €, una parte = 15 €. Luca ha 3 × 15 = 45 €."],[3,"Completare la successione: 2, 3, 5, 9, 17, 33, …","65","49","64","66","Ogni termine è il doppio del precedente meno 1: 33 × 2 − 1 = 65. (Le differenze raddoppiano: 1, 2, 4, 8, 16, 32.)"],[3,"Completare la successione: 3, 5, 9, 15, 23, …","33","31","29","35","Le differenze tra termini consecutivi sono 2, 4, 6, 8: la prossima è 10, quindi 23 + 10 = 33."],[3,"Il prezzo di un prodotto aumenta del 10% e poi diminuisce del 10%. Rispetto al prezzo iniziale, il prezzo finale è:","Inferiore dell'1%","Uguale","Superiore dell'1%","Inferiore del 10%","Con un prezzo di 100: +10% → 110; −10% di 110 = −11 → 99. Lo sconto si calcola su una base più alta, quindi il risultato è l'1% in meno."],[3,"Tre soci si dividono 1.500 € in parti proporzionali a 2, 3 e 5. Quanto riceve chi ottiene la parte maggiore?","750 €","500 €","600 €","300 €","Le parti totali sono 2 + 3 + 5 = 10; una parte vale 150 €; la maggiore è 5 × 150 = 750 €."],[3,"Un rubinetto riempie una vasca in 6 ore, un altro in 3 ore. Aperti insieme, in quanto tempo la riempiono?","2 ore","4 ore e 30 minuti","9 ore","1 ora e 30 minuti","In un'ora il primo riempie 1/6, il secondo 1/3 = 2/6: insieme 3/6 = 1/2 di vasca all'ora. Servono quindi 2 ore."],[3,"Lanciando un dado a sei facce, qual è la probabilità di ottenere un numero pari?","1/2","1/3","1/6","2/3","I casi favorevoli sono 2, 4 e 6 (tre su sei): 3/6 = 1/2."],[3,"Anna ha 4 anni più di Bea. Fra 6 anni la somma delle loro età sarà 40. Quanti anni ha oggi Anna?","16","12","17","20","Oggi la somma è 40 − 12 = 28. Se Bea ha b anni: b + (b + 4) = 28, quindi b = 12 e Anna ha 16 anni."],[3,"Quanti numeri interi da 1 a 100 sono divisibili per 3 ma non per 5?","27","33","28","20","Multipli di 3 fino a 100: 33. Tra questi, i multipli di 15 (divisibili anche per 5) sono 6: 33 − 6 = 27."],[3,"Un treno parte alle 8:40 e viaggia alla velocità costante di 120 km/h. A che ora arriva in una città distante 300 km?","11:10","11:40","10:40","11:20","300 : 120 = 2,5 ore = 2 ore e 30 minuti. 8:40 + 2:30 = 11:10."],[3,"Una lampada costa il 20% in meno di un'altra da 150 €. Quanto si risparmia comprando 3 lampade economiche invece di 3 lampade da 150 €?","90 €","30 €","60 €","120 €","Il 20% di 150 è 30 €: su ogni lampada si risparmiano 30 €, su tre 90 €."],[3,"Completare la successione: 2, 6, 12, 20, 30, …","42","40","36","44","Le differenze sono 4, 6, 8, 10: la prossima è 12, quindi 30 + 12 = 42. (Ogni termine è n × (n + 1).)"]],"2":[[1,"Quanto è il 10% di 350?","35","3,5","350","30","Il 10% si ottiene dividendo per 10: 350 : 10 = 35."],[1,"Quanto è 1/5 di 45?","9","5","15","225","45 : 5 = 9."],[1,"Completare la successione: 10, 20, 30, 40, …","50","45","60","80","Si aggiunge 10 a ogni termine."],[2,"Con 3 kg di farina si preparano 12 pizze. Quante pizze si preparano con 5 kg?","20","15","18","60","12 : 3 = 4 pizze per kg; 4 × 5 = 20."],[2,"Un paio di scarpe costa 120 € e il prezzo aumenta del 15%. Qual è il nuovo prezzo?","138 €","135 €","18 €","132 €","Il 15% di 120 è 18 (10% = 12, 5% = 6); 120 + 18 = 138 €."],[2,"Qual è la media dei voti 7, 5, 8, 6 e 9?","7","6,5","7,5","35","(7 + 5 + 8 + 6 + 9) : 5 = 35 : 5 = 7."],[2,"Completare la successione: 1, 3, 9, 27, …","81","36","54","30","Ogni termine è il triplo del precedente: 27 × 3 = 81."],[2,"Completare la successione: 100, 95, 85, 70, …","50","55","60","45","Si tolgono 5, 10, 15, poi 20: 70 − 20 = 50."],[2,"Quattro stampanti completano un lavoro in 6 ore. Quante ore servono a tre stampanti uguali?","8","4,5","7","9","Il lavoro vale 4 × 6 = 24 ore-stampante; con 3 stampanti: 24 : 3 = 8 ore."],[2,"Quanto fa 0,25 × 16?","4","0,4","40","3,2","0,25 equivale a 1/4: un quarto di 16 è 4."],[2,"Un ciclista procede a 18 km/h. Quanti km percorre in 40 minuti?","12","7,2","10","14","40 minuti sono 2/3 di ora: 18 × 2/3 = 12 km."],[2,"Il 30% di un numero è 27. Qual è il numero?","90","81","57","8,1","27 : 30 = 0,9 è l'1%; il 100% è 0,9 × 100 = 90. Oppure: 30% = 27 → 10% = 9 → 100% = 90."],[2,"Quanto fa 3/5 − 1/4?","7/20","2/1","2/9","1/5","Minimo comune denominatore 20: 12/20 − 5/20 = 7/20."],[2,"Completare la successione: 2, 5, 11, 23, …","47","46","35","44","Ogni termine è il doppio del precedente più 1: 23 × 2 + 1 = 47."],[2,"Sono le 22:50. Che ora sarà fra 3 ore e 25 minuti?","2:15","1:15","25:75","2:25","22:50 + 3 ore = 1:50 del giorno dopo; + 25 minuti = 2:15."],[2,"Se 4x − 6 = 2x + 10, quanto vale x?","8","2","4","16","4x − 2x = 10 + 6, cioè 2x = 16, quindi x = 8."],[2,"Su 40 pazienti, il 35% ha prenotato online. Quanti NON hanno prenotato online?","26","14","35","24","Il 35% di 40 è 14 (10% = 4, quindi 30% = 12, più 5% = 2). Non online: 40 − 14 = 26."],[2,"Quanti minuti ci sono in 2,4 ore?","144","124","240","140","2 ore = 120 minuti; 0,4 ore = 0,4 × 60 = 24 minuti. Totale 144."],[2,"La somma di due numeri è 50 e la loro differenza è 14. Qual è il numero maggiore?","32","18","36","25","Maggiore = (50 + 14) : 2 = 32; minore = 50 − 32 = 18."],[3,"Completare la successione: 1, 2, 4, 7, 11, 16, …","22","21","23","32","Le differenze crescono di uno: +1, +2, +3, +4, +5, poi +6: 16 + 6 = 22."],[3,"Completare la successione: 2, 4, 3, 6, 5, 10, 9, …","18","8","12","11","Si alternano due operazioni: ×2 e −1. Dopo 9 tocca ×2: 18."],[3,"Un capitale di 2.000 € è depositato al tasso di interesse semplice del 3% annuo. Quanti interessi matura in 2 anni?","120 €","60 €","2.120 €","600 €","Interesse annuo: 3% di 2.000 = 60 €; in 2 anni 120 €. 2.120 € è il montante (capitale + interessi), non l'interesse."],[3,"Un'eredità di 36.000 € è divisa tra tre fratelli in parti proporzionali alle loro età: 10, 12 e 14 anni. Quanto riceve il più giovane?","10.000 €","12.000 €","14.000 €","9.000 €","Parti totali: 10 + 12 + 14 = 36; ogni parte vale 1.000 €; al più giovane 10 parti = 10.000 €."],[3,"Un operaio completa un lavoro in 4 giorni, un altro in 12 giorni. Lavorando insieme, in quanti giorni lo completano?","3","8","6","16","In un giorno fanno 1/4 + 1/12 = 3/12 + 1/12 = 4/12 = 1/3 del lavoro: servono 3 giorni."],[3,"Un'urna contiene 3 palline rosse e 5 blu. Estraendone una a caso, qual è la probabilità che sia rossa?","3/8","3/5","1/3","5/8","Casi favorevoli 3, casi possibili 3 + 5 = 8: probabilità 3/8. (3/5 confronta le rosse con le blu, non con il totale.)"],[3,"Un padre ha 40 anni e il figlio 10. Fra quanti anni il padre avrà il doppio degli anni del figlio?","20","10","15","30","40 + x = 2 × (10 + x) → 40 + x = 20 + 2x → x = 20. Tra 20 anni: padre 60, figlio 30."],[3,"Quanti numeri di due cifre hanno la somma delle cifre uguale a 9?","9","8","10","18","Sono 18, 27, 36, 45, 54, 63, 72, 81, 90: nove numeri (09 non ha due cifre)."],[3,"Un'auto consuma 6 litri di benzina ogni 100 km e la benzina costa 1,80 € al litro. Quanto si spende per percorrere 250 km?","27 €","15 €","25 €","30 €","Consumo: 6 × 2,5 = 15 litri; spesa: 15 × 1,80 = 27 €. (15 sono i litri, non gli euro.)"],[3,"Dopo uno sconto del 20% un articolo costa 64 €. Qual era il prezzo originale?","80 €","76,80 €","84 €","78 €","64 € corrisponde all'80% del prezzo: 64 : 0,8 = 80 €. Aggiungere il 20% di 64 (ottenendo 76,80) è un errore frequente."],[3,"Completare la successione: 1, 8, 27, 64, …","125","100","81","128","Sono i cubi dei numeri naturali: 1³, 2³, 3³, 4³, 5³ = 125."]],"3":[[1,"Quanto è il 25% di 60?","15","25","12","6","Il 25% è un quarto: 60 : 4 = 15."],[1,"Quanto sono i 2/3 di 90?","60","30","45","135","90 : 3 = 30; 30 × 2 = 60."],[1,"Completare la successione: 1, 3, 5, 7, …","9","8","10","11","Sono i numeri dispari: si aggiunge 2."],[2,"Un'auto percorre 260 km in 4 ore. Quanti km percorre in 6 ore alla stessa velocità?","390","360","420","400","260 : 4 = 65 km/h; 65 × 6 = 390 km."],[2,"Una giacca costa 150 € ed è scontata del 30%. Qual è il prezzo finale?","105 €","120 €","45 €","100 €","Il 30% di 150 è 45; 150 − 45 = 105 €."],[2,"La media di tre numeri è 12. Due di essi sono 10 e 15. Qual è il terzo?","11","12","13","9","La somma dei tre numeri è 12 × 3 = 36; 36 − 10 − 15 = 11."],[2,"Completare la successione: 64, 32, 16, 8, …","4","0","2","6","Ogni termine è la metà del precedente."],[2,"Completare la successione: 7, 14, 21, 28, …","35","32","36","42","Sono i multipli di 7."],[2,"Con 8 rubinetti uguali una vasca si riempie in 3 ore. Quante ore servono con 6 rubinetti?","4","2,25","5","6","Proporzionalità inversa: 8 × 3 = 24; 24 : 6 = 4 ore."],[2,"Quanto fa 1,5 × 1,5?","2,25","2,5","1,25","3","1,5 × 1,5 = 1,5 + 0,75 = 2,25."],[2,"Un treno viaggia a 150 km/h. Quanto tempo impiega per percorrere 375 km?","2 ore e 30 minuti","2 ore e 50 minuti","2 ore e 15 minuti","3 ore","375 : 150 = 2,5 ore = 2 ore e 30 minuti (0,5 ore = 30 minuti, non 50)."],[2,"Il 40% di un numero è 48. Qual è il numero?","120","19,2","88","100","40% = 48 → 10% = 12 → 100% = 120."],[2,"Quanto fa 1/2 × 3/4?","3/8","4/6","3/4","5/4","Si moltiplicano numeratori e denominatori: (1 × 3)/(2 × 4) = 3/8."],[2,"Completare la successione: 2, 6, 18, 54, …","162","108","72","156","Ogni termine è il triplo del precedente: 54 × 3 = 162."],[2,"Un film inizia alle 20:35 e dura 1 ora e 50 minuti. A che ora finisce?","22:25","21:85","22:15","22:35","20:35 + 1 ora = 21:35; + 50 minuti = 22:25."],[2,"Se 5(x − 2) = 3x + 4, quanto vale x?","7","3","6","14","5x − 10 = 3x + 4 → 2x = 14 → x = 7."],[2,"Un reparto ha 60 dipendenti e i 2/5 lavorano part-time. Quanti lavorano a tempo pieno?","36","24","40","12","Part-time: 60 × 2/5 = 24; a tempo pieno: 60 − 24 = 36."],[2,"A quante ore corrispondono 270 minuti?","4,5","4,3","2,7","4,7","270 : 60 = 4,5 ore (4 ore e 30 minuti)."],[2,"Tre numeri interi consecutivi hanno somma 72. Qual è il più grande?","25","24","26","23","Il numero centrale è 72 : 3 = 24; i tre numeri sono 23, 24, 25."],[3,"Completare la successione: 1, 4, 10, 22, 46, …","94","92","70","90","Ogni termine è il doppio del precedente più 2: 46 × 2 + 2 = 94. (Le differenze raddoppiano: 3, 6, 12, 24, 48.)"],[3,"Completare la successione: 5, 10, 8, 16, 14, 28, …","26","56","30","24","Si alternano ×2 e −2: dopo 28 tocca −2, quindi 26."],[3,"Un prezzo di 50 € viene aumentato del 20% e poi scontato del 20%. Qual è il prezzo finale?","48 €","50 €","52 €","40 €","50 + 20% = 60; 60 − 20% (cioè 12) = 48 €. Lo sconto si applica al prezzo già aumentato."],[3,"Tre amici investono 2.000 €, 3.000 € e 5.000 € e dividono un guadagno di 1.200 € in proporzione a quanto investito. Quanto spetta a chi ha investito 3.000 €?","360 €","400 €","300 €","600 €","Il totale investito è 10.000 €: 3.000 € ne sono il 30%; il 30% di 1.200 € è 360 €."],[3,"Una pompa svuota una cisterna piena in 8 ore; un'altra pompa la riempie in 12 ore. Se sono attive entrambe e la cisterna è piena, in quanto tempo si svuota?","24 ore","4 ore","20 ore","4 ore e 48 minuti","In un'ora si svuota 1/8 e si riempie 1/12: il saldo è 3/24 − 2/24 = 1/24 di cisterna all'ora, quindi servono 24 ore."],[3,"Lanciando due monete, qual è la probabilità di ottenere due teste?","1/4","1/2","1/3","2/4","I casi possibili sono TT, TC, CT, CC: uno solo è favorevole, quindi 1/4."],[3,"La somma delle età di una madre e di sua figlia è 50 anni; la madre ha 26 anni più della figlia. Quanti anni ha la figlia?","12","24","13","38","Figlia f: f + (f + 26) = 50 → 2f = 24 → f = 12 (la madre ne ha 38)."],[3,"Quanti multipli di 7 ci sono tra 1 e 100?","14","13","15","7","100 : 7 = 14 con resto 2: i multipli vanno da 7 a 98, cioè 14 numeri."],[3,"Un'auto percorre i primi 120 km a 60 km/h e i successivi 120 km a 120 km/h. Qual è la velocità media sull'intero percorso?","80 km/h","90 km/h","85 km/h","100 km/h","Tempo: 120 : 60 = 2 ore, più 120 : 120 = 1 ora, in totale 3 ore per 240 km: 240 : 3 = 80 km/h. La media delle due velocità (90) è sbagliata perché i due tratti durano tempi diversi."],[3,"Dopo un aumento del 20% un capo costa 90 €. Qual era il prezzo prima dell'aumento?","75 €","72 €","70 €","108 €","90 € è il 120% del prezzo iniziale: 90 : 1,2 = 75 €. Togliere il 20% di 90 (ottenendo 72) è l'errore tipico."],[3,"Completare la successione: 1, 1, 2, 3, 5, 8, 13, …","21","18","20","26","Ogni termine è la somma dei due precedenti: 8 + 13 = 21 (successione di Fibonacci)."]],"4":[[1,"Quanto è il 50% di 86?","43","42","86","50","Il 50% è la metà: 86 : 2 = 43."],[1,"Quanto sono i 3/10 di 200?","60","30","20","600","200 : 10 = 20; 20 × 3 = 60."],[1,"Completare la successione: 20, 17, 14, 11, …","8","9","7","10","Si toglie 3 a ogni termine."],[2,"Per 6 persone servono 900 g di pasta. Quanta pasta serve per 10 persone?","1,5 kg","1,2 kg","1,6 kg","1 kg","900 : 6 = 150 g a persona; 150 × 10 = 1.500 g = 1,5 kg."],[2,"Un telefono costa 400 € ed è scontato del 15%. Qual è il prezzo finale?","340 €","385 €","60 €","350 €","Il 15% di 400 è 60 (10% = 40, 5% = 20); 400 − 60 = 340 €."],[2,"Qual è la media aritmetica di 12, 15, 18, 21 e 24?","18","17","19","90","La somma è 90; 90 : 5 = 18. (Con numeri equidistanti la media coincide con il valore centrale.)"],[2,"Completare la successione: 1, 5, 25, 125, …","625","250","150","525","Ogni termine si moltiplica per 5: 125 × 5 = 625."],[2,"Completare la successione: 50, 47, 41, 32, …","20","23","29","22","Si tolgono 3, 6, 9, poi 12: 32 − 12 = 20."],[2,"Tre imbianchini imbiancano una casa in 8 giorni. In quanti giorni la imbiancano quattro imbianchini che lavorano allo stesso ritmo?","6","10","5","7","3 × 8 = 24 giornate di lavoro; 24 : 4 = 6 giorni."],[2,"Quanto fa 12 : 0,25?","48","3","4,8","36","Dividere per 0,25 (un quarto) equivale a moltiplicare per 4: 12 × 4 = 48."],[2,"Un podista corre 10 km in 50 minuti. Qual è la sua velocità media in km/h?","12","10","5","15","In 10 minuti percorre 2 km; in 60 minuti 12 km: 12 km/h."],[2,"Il 25% di un numero è 40. Qual è il numero?","160","100","10","120","Il 25% è un quarto: il numero è 40 × 4 = 160."],[2,"Quanto fa 5/6 − 1/3?","1/2","4/3","4/6","2/3","1/3 = 2/6: 5/6 − 2/6 = 3/6 = 1/2."],[2,"Completare la successione: 3, 4, 7, 11, 18, …","29","25","26","36","Ogni termine è la somma dei due precedenti: 11 + 18 = 29."],[2,"Un turno inizia alle 7:40 e dura 6 ore e 45 minuti. A che ora finisce?","14:25","13:85","14:15","13:25","7:40 + 6 ore = 13:40; + 45 minuti = 14:25."],[2,"Se 3x + 8 = 29, quanto vale x?","7","12,3","9","21","3x = 29 − 8 = 21, quindi x = 7."],[2,"Su 250 prenotazioni, il 12% è stato annullato. Quante prenotazioni sono state annullate?","30","12","25","220","Il 10% di 250 è 25, il 2% è 5: 25 + 5 = 30."],[2,"Quanti centimetri sono 3,75 metri?","375","37,5","3.750","0,0375","1 m = 100 cm: 3,75 × 100 = 375 cm."],[2,"La somma di un numero e del suo doppio è 57. Qual è il numero?","19","28,5","38","17","Numero + doppio = 3 volte il numero = 57, quindi il numero è 57 : 3 = 19."],[3,"Completare la successione: 2, 3, 6, 11, 18, 27, …","38","36","37","40","Le differenze sono i numeri dispari 1, 3, 5, 7, 9: la prossima è 11, quindi 27 + 11 = 38."],[3,"Completare la successione: 1, 10, 3, 9, 5, 8, 7, 7, …","9","6","11","8","Sono due successioni alternate: 1, 3, 5, 7, 9 (dispari crescenti) e 10, 9, 8, 7 (decrescenti). Dopo 7 della seconda tocca il 9 della prima."],[3,"Un prezzo viene scontato prima del 10% e poi di un ulteriore 20%. Qual è lo sconto complessivo?","28%","30%","32%","25%","Con 100 €: −10% → 90; −20% di 90 (cioè 18) → 72. Lo sconto totale è 28%, non 30%: il secondo sconto si applica a un prezzo già ridotto."],[3,"Un premio di 2.400 € viene diviso tra due persone in modo che una riceva il triplo dell'altra. Quanto riceve chi ottiene meno?","600 €","800 €","1.800 €","1.200 €","Le parti sono 1 + 3 = 4; una parte vale 2.400 : 4 = 600 €. L'altra persona riceve 1.800 €."],[3,"Anna riordina un archivio in 2 ore, Bruno in 3 ore. Lavorando insieme, quanto tempo impiegano?","1 ora e 12 minuti","2 ore e 30 minuti","1 ora e 30 minuti","5 ore","In un'ora fanno 1/2 + 1/3 = 5/6 dell'archivio: servono 6/5 di ora = 1,2 ore = 1 ora e 12 minuti."],[3,"Da un mazzo di 40 carte con 4 assi si pesca una carta a caso. Qual è la probabilità che sia un asso?","1/10","1/4","1/40","4/10","Casi favorevoli 4 su 40 possibili: 4/40 = 1/10."],[3,"Oggi Marco ha il triplo dell'età di suo figlio; fra 12 anni ne avrà il doppio. Quanti anni ha oggi Marco?","36","24","48","30","Figlio f, Marco 3f: 3f + 12 = 2(f + 12) → 3f + 12 = 2f + 24 → f = 12. Marco ha 36 anni."],[3,"Quanti sono i numeri pari di due cifre?","45","50","44","49","Da 10 a 98 i pari sono (98 − 10) : 2 + 1 = 45."],[3,"Un serbatoio da 60 litri è pieno per i 3/4. Si consumano 15 litri. Quale frazione del serbatoio resta piena?","1/2","1/4","2/3","3/8","3/4 di 60 = 45 litri; 45 − 15 = 30 litri, cioè 30/60 = 1/2 del serbatoio."],[3,"Il prezzo di un biglietto passa da 40 € a 50 €. Di quanto è aumentato in percentuale?","25%","20%","10%","50%","L'aumento è 10 € su una base di 40 €: 10/40 = 25%. (20% sarebbe 10 rapportato a 50, cioè al prezzo finale.)"],[3,"Completare la successione: 1, 2, 6, 24, 120, …","720","240","600","144","Si moltiplica per 2, 3, 4, 5 e poi per 6: 120 × 6 = 720."]],"5":[[1,"Quanto è il 20% di 45?","9","20","4,5","25","Il 20% è un quinto: 45 : 5 = 9."],[1,"Quanto sono i 5/8 di 64?","40","8","24","48","64 : 8 = 8; 8 × 5 = 40."],[1,"Completare la successione: 3, 6, 9, 12, …","15","14","18","24","Sono i multipli di 3."],[2,"Un'impiegata archivia 84 pratiche in 7 ore. Quante ne archivia in 4 ore allo stesso ritmo?","48","44","56","36","84 : 7 = 12 pratiche all'ora; 12 × 4 = 48."],[2,"Un abbonamento di 250 € aumenta dell'8%. Qual è il nuovo prezzo?","270 €","258 €","20 €","280 €","L'8% di 250 è 20 (1% = 2,5); 250 + 20 = 270 €."],[2,"Nelle prime quattro verifiche Paolo ha preso 6, 7, 8 e 5. Che voto deve prendere nella quinta per avere la media del 7?","9","7","8","10","Per una media di 7 su cinque prove serve una somma di 35; finora ha 26, quindi gli serve 35 − 26 = 9."],[2,"Completare la successione: 2, 8, 32, 128, …","512","256","384","136","Ogni termine si moltiplica per 4: 128 × 4 = 512."],[2,"Completare la successione: 1, 2, 5, 10, 17, …","26","24","25","27","Le differenze sono 1, 3, 5, 7: la prossima è 9, quindi 17 + 9 = 26."],[2,"Viaggiando a 60 km/h si impiegano 4 ore. Quanto tempo si impiega a 80 km/h?","3 ore","5 ore e 20 minuti","3 ore e 20 minuti","2 ore","La distanza è 60 × 4 = 240 km; a 80 km/h servono 240 : 80 = 3 ore."],[2,"Quanto fa 0,2 × 0,3?","0,06","0,6","0,5","6","2 × 3 = 6; i decimali in tutto sono due, quindi 0,06."],[2,"Quanti km percorre in 2 ore e 15 minuti un'auto che viaggia a 80 km/h?","180","172","200","160","2 ore e 15 minuti = 2,25 ore; 80 × 2,25 = 180 km."],[2,"Il 15% di un numero è 30. Qual è il numero?","200","45","150","450","15% = 30 → 5% = 10 → 100% = 200."],[2,"Quanto fa 2/5 + 3/10?","7/10","5/15","5/10","1/2","2/5 = 4/10: 4/10 + 3/10 = 7/10."],[2,"Completare la successione: 81, 27, 9, 3, …","1","0","2","1/3","Ogni termine è un terzo del precedente: 3 : 3 = 1."],[2,"Un pullman parte alle 13:55 e arriva alle 16:20. Quanto dura il viaggio?","2 ore e 25 minuti","2 ore e 35 minuti","3 ore e 25 minuti","2 ore e 65 minuti","Dalle 13:55 alle 14:00 passano 5 minuti; dalle 14:00 alle 16:20 altre 2 ore e 20 minuti: totale 2 ore e 25 minuti."],[2,"Se 2(x + 3) = 20, quanto vale x?","7","8,5","10","17","Dividendo per 2: x + 3 = 10, quindi x = 7."],[2,"In un ufficio di 45 persone, 1/3 usa i mezzi pubblici e 2/5 l'auto. Quante persone usano altri mezzi?","12","15","18","33","Mezzi pubblici: 45 : 3 = 15; auto: 45 × 2/5 = 18. Altri mezzi: 45 − 15 − 18 = 12."],[2,"Quanti grammi sono 0,35 kg?","350","35","3.500","0,35","1 kg = 1.000 g: 0,35 × 1.000 = 350 g."],[2,"Un padre ha il quadruplo degli anni del figlio; insieme hanno 50 anni. Quanti anni ha il padre?","40","10","45","36","Figlio = 1 parte, padre = 4 parti: 5 parti = 50 anni, una parte = 10. Il padre ha 40 anni."],[3,"Completare la successione: 1, 3, 6, 10, 15, …","21","20","25","18","Le differenze sono 2, 3, 4, 5: la prossima è 6, quindi 15 + 6 = 21 (numeri triangolari)."],[3,"Completare la successione: 3, 9, 7, 21, 19, 57, …","55","171","59","63","Si alternano ×3 e −2: dopo 57 tocca −2, quindi 55."],[3,"Uno stipendio di 1.500 € aumenta del 10%; sul nuovo importo si applica poi una trattenuta del 5%. Qual è l'importo finale?","1.567,50 €","1.575,00 €","1.650,00 €","1.582,50 €","1.500 + 10% = 1.650; il 5% di 1.650 è 82,50; 1.650 − 82,50 = 1.567,50 €. Fare +10% −5% = +5% sul valore iniziale (1.575) è sbagliato."],[3,"Tre squadre si dividono 900 punti in parti inversamente proporzionali ai minuti impiegati per una prova: 2, 3 e 6 minuti. Quanti punti riceve la squadra più veloce?","450","150","300","600","Inversamente proporzionale significa proporzionale a 1/2, 1/3, 1/6, cioè a 3, 2, 1. Parti totali 6, una parte = 150; la più veloce ne ha 3: 450 punti."],[3,"Due autobus partono insieme dal capolinea: il primo ripassa ogni 12 minuti, il secondo ogni 18 minuti. Dopo quanti minuti ripartiranno di nuovo insieme?","36","30","72","216","Serve il minimo comune multiplo di 12 e 18: 36 minuti. (216 = 12 × 18 è un multiplo comune, ma non il minimo.)"],[3,"Lanciando due dadi a sei facce, qual è la probabilità che la somma sia 7?","1/6","1/12","7/36","1/11","Le coppie con somma 7 sono 6 (1-6, 2-5, 3-4, 4-3, 5-2, 6-1) su 36 possibili: 6/36 = 1/6."],[3,"Carla ha 30 anni e sua figlia 6. Fra quanti anni l'età di Carla sarà il triplo di quella della figlia?","6","4","8","12","30 + x = 3 × (6 + x) → 30 + x = 18 + 3x → x = 6. Fra 6 anni: Carla 36, figlia 12."],[3,"Un lucchetto ha una combinazione di 3 cifre, ciascuna da 0 a 9. Quante combinazioni diverse sono possibili?","1.000","30","720","999","Ogni cifra ha 10 possibilità: 10 × 10 × 10 = 1.000 (da 000 a 999). 720 sarebbe il caso con cifre tutte diverse."],[3,"Due città distano 300 km. Alle 9:00 un'auto parte dalla prima a 90 km/h e un'altra parte dalla seconda verso la prima a 60 km/h. A che ora si incontrano?","11:00","12:20","10:30","11:20","Andando una incontro all'altra si avvicinano di 90 + 60 = 150 km ogni ora: 300 : 150 = 2 ore, quindi alle 11:00."],[3,"Un prezzo che comprende una maggiorazione del 20% è di 120 €. Qual è il prezzo senza maggiorazione?","100 €","96 €","90 €","104 €","120 € corrisponde al 120% del prezzo di base: 120 : 1,2 = 100 €. Togliere il 20% di 120 (ottenendo 96) è l'errore tipico."],[3,"Completare la successione: 0, 3, 8, 15, 24, …","35","33","36","32","Le differenze sono 3, 5, 7, 9: la prossima è 11, quindi 24 + 11 = 35. (Ogni termine è n² − 1.)"]]},"LV":{"1":[[1,"Individuare il sinonimo di «arguto».","Perspicace","Ottuso","Lento","Pigro","Arguto = acuto, perspicace, che coglie con prontezza. Ottuso è il contrario."],[1,"Individuare il contrario di «effimero».","Duraturo","Breve","Fragile","Passeggero","Effimero = di breve durata; il contrario è duraturo. Breve e passeggero sono sinonimi."],[1,"Che cosa significa «procrastinare»?","Rinviare","Anticipare","Eseguire con cura","Dimenticare","Procrastinare = rimandare di giorno in giorno."],[2,"Individuare il sinonimo di «reticente».","Restio a parlare","Loquace","Sincero","Irascibile","Reticente = chi tace volutamente qualcosa; loquace è il contrario."],[2,"Individuare il contrario di «prodigo».","Avaro","Generoso","Ricco","Spendaccione","Prodigo = che spende o dona senza misura; il contrario è avaro. Generoso e spendaccione sono affini."],[2,"Individuare il termine da scartare.","Quercia","Rosa","Tulipano","Garofano","Rosa, tulipano e garofano sono fiori; la quercia è un albero."],[2,"Individuare il termine da scartare.","Garda","Po","Tevere","Arno","Po, Tevere e Arno sono fiumi; il Garda è un lago."],[2,"Individuare il termine da scartare.","Cubo","Triangolo","Quadrato","Pentagono","Triangolo, quadrato e pentagono sono figure piane; il cubo è un solido."],[2,"Completare la proporzione: medico : ospedale = insegnante : ?","Scuola","Alunno","Lezione","Cattedra","Relazione professionista – luogo di lavoro: il medico lavora in ospedale, l'insegnante a scuola."],[2,"Completare la proporzione: pagina : libro = mattone : ?","Muro","Cazzuola","Argilla","Muratore","Relazione parte – tutto: la pagina è parte del libro, il mattone è parte del muro. L'argilla è il materiale del mattone (relazione diversa)."],[2,"Completare la proporzione: freddo : caldo = buio : ?","Luce","Notte","Ombra","Sera","Relazione tra contrari: il contrario di buio è luce."],[2,"Quale binomio ha le stesse caratteristiche di PENNA – SCRIVERE?","Forbici – tagliare","Libro – biblioteca","Ago – sarta","Martello – chiodo","Strumento – azione che compie: la penna serve a scrivere, le forbici a tagliare. Martello – chiodo lega due oggetti, non uno strumento alla sua azione."],[2,"Individuare il contrario di «esplicito».","Implicito","Chiaro","Evidente","Espresso","Esplicito = dichiarato apertamente; il contrario è implicito, sottinteso."],[2,"Completare la frase: «Il testimone fu ______: rispose a ogni domanda senza tralasciare alcun dettaglio».","Esauriente","Reticente","Evasivo","Ambiguo","La seconda parte descrive risposte complete: esauriente. Reticente, evasivo e ambiguo esprimono il contrario."],[2,"Individuare il termine da scartare.","Raffaello","Leopardi","Manzoni","Carducci","Leopardi, Manzoni e Carducci sono scrittori e poeti; Raffaello è un pittore."],[2,"Quale binomio ha le stesse caratteristiche di GRANDE – ENORME?","Caldo – rovente","Alto – basso","Piccolo – grande","Bello – brutto","Il secondo termine è un grado più intenso del primo: enorme = molto grande, rovente = molto caldo. Le altre coppie sono di contrari."],[3,"Completare la frase con la coppia corretta: «Il relatore fu così ______ che nessuno riuscì a seguirlo; eppure il tema, in sé, era tutt'altro che ______».","Oscuro – complesso","Chiaro – semplice","Oscuro – banale","Brillante – complesso","«Eppure» introduce un contrasto: nessuno lo seguiva perché era oscuro, anche se il tema non era complesso. Con «banale» il contrasto sparisce; «chiaro» e «brillante» non spiegano perché nessuno lo seguisse."],[2,"Quale delle seguenti parole NON è un anagramma di ROMA?","Armi","Ramo","Mora","Orma","Ramo, mora e orma usano esattamente le lettere R, O, M, A; «armi» contiene una I al posto della O."],[2,"Individuare la parola che completa il brano: «Con il termine ______ si indica la disciplina che studia la popolazione umana nei suoi aspetti quantitativi: natalità, mortalità, migrazioni».","Demografia","Antropologia","Geografia","Sociologia","La demografia studia la popolazione in termini numerici; l'antropologia studia l'uomo e le culture."],[2,"Completare la proporzione: architetto : progetto = compositore : ?","Partitura","Orchestra","Pianoforte","Direttore","Relazione autore – opera che produce: l'architetto elabora un progetto, il compositore scrive una partitura."],[3,"Se X : Italia = Parigi : Y, allora:","X = Roma, Y = Francia","X = Milano, Y = Francia","X = Roma, Y = Lione","X = Italia, Y = Parigi","Relazione capitale – Stato: Roma sta all'Italia come Parigi sta alla Francia. Milano e Lione non sono capitali."],[3,"Se libro : X = Y : spettatore, allora:","X = lettore, Y = film","X = scrittore, Y = film","X = lettore, Y = regista","X = pagina, Y = cinema","Relazione opera – fruitore: il libro ha un lettore, il film ha uno spettatore. Scrittore e regista sono autori, non fruitori."],[3,"Se ago : X = Y : pittore, allora:","X = sarto, Y = pennello","X = filo, Y = pennello","X = sarto, Y = tela","X = cucire, Y = quadro","Relazione strumento – chi lo usa: l'ago è lo strumento del sarto, il pennello quello del pittore. La tela è il supporto, non lo strumento."],[3,"Se CASA = 2, TRENO = 3 e STRADA = 4, allora PORTONE = ?","4","3","5","7","Il numero corrisponde alle consonanti: C-S (2), T-R-N (3), S-T-R-D (4). PORTONE: P-R-T-N = 4. Non sono le vocali: TRENO ne ha 2, non 3."],[3,"Se LIBRO diventa ORBIL e PENNA diventa ANNEP, come diventa QUADERNO?","ONREDAUQ","ONREDUAQ","ONERDAUQ","QUADERON","La parola viene scritta al contrario: QUADERNO letto da destra a sinistra dà ONREDAUQ."],[3,"Se ALA = 2, NOTTE = 4 e BANANA = 3, allora STELLA = ?","5","6","4","3","Il numero indica le lettere diverse presenti: ALA {A, L}, NOTTE {N, O, T, E}, BANANA {B, A, N}. STELLA {S, T, E, L, A} = 5. Non sono le vocali (NOTTE ne ha 2) né la lunghezza (ALA ne ha 3)."],[3,"In un codice, CANE si scrive DBOF. Come si scrive GATTO?","HBUUP","HBTTP","FZSSN","HCUUP","Ogni lettera è sostituita dalla successiva nell'alfabeto: G→H, A→B, T→U, T→U, O→P."],[3,"Quale coppia ha la stessa relazione di SEME – ALBERO?","Uovo – pulcino","Foglia – ramo","Albero – bosco","Radice – terra","Dal primo termine si sviluppa il secondo: dal seme nasce l'albero, dall'uovo il pulcino. Le altre coppie esprimono relazioni parte-tutto, elemento-insieme o luogo."],[3,"Individuare la parola da scartare.","Orso","Radar","Anna","Otto","Radar, Anna e Otto sono palindromi (si leggono uguali nei due sensi); «orso» letto al contrario dà «osro»."],[3,"Quale elemento, anteposto a «-scopio», «-fono» e «-visione», forma tre parole di senso compiuto?","Tele","Micro","Radio","Video","Telescopio, telefono, televisione. «Micro» forma microscopio e microfono ma non «microvisione»."]],"2":[[1,"Individuare il sinonimo di «celere».","Rapido","Lento","Celebre","Cauto","Celere = veloce, rapido. Attenzione a «celebre» (famoso), che ha un suono simile ma un altro significato."],[1,"Individuare il contrario di «ostile».","Amichevole","Nemico","Avverso","Diffidente","Ostile = contrario, avverso; il contrario è amichevole. Nemico e avverso sono sinonimi."],[1,"Che cosa significa «inerme»?","Senza difese","Immobile","Inutile","Armato","Inerme = privo di armi o di difese. Non va confuso con «inerte» (immobile)."],[2,"Individuare il sinonimo di «ameno».","Piacevole","Aspro","Lontano","Isolato","Ameno = gradevole, piacevole (un luogo ameno)."],[2,"Individuare il contrario di «parsimonioso».","Sprecone","Economo","Attento","Modesto","Parsimonioso = che spende con misura; il contrario è sprecone. Economo è un sinonimo."],[2,"Individuare il termine da scartare.","Luna","Venere","Marte","Giove","Venere, Marte e Giove sono pianeti; la Luna è un satellite."],[2,"Individuare il termine da scartare.","Banca","Euro","Dollaro","Yen","Euro, dollaro e yen sono valute; la banca è un istituto di credito."],[2,"Completare la proporzione: pesce : branco = pecora : ?","Gregge","Pastore","Lana","Stalla","Relazione animale – gruppo: i pesci formano un branco, le pecore un gregge."],[2,"Completare la proporzione: sole : giorno = luna : ?","Notte","Stella","Pianeta","Cielo","Il sole caratterizza il giorno, la luna la notte."],[2,"Completare la proporzione: occhio : vedere = orecchio : ?","Udire","Suono","Parlare","Musica","Relazione organo – funzione: l'occhio serve a vedere, l'orecchio a udire. «Suono» è ciò che si ode, non la funzione."],[2,"Quale binomio ha le stesse caratteristiche di LUPO – BRANCO?","Ape – sciame","Cane – cuccia","Nave – porto","Albero – foglia","Animale – gruppo di cui fa parte: il lupo vive nel branco, l'ape nello sciame. Cane – cuccia e nave – porto indicano un luogo; albero – foglia il tutto e la parte."],[2,"Quale binomio ha le stesse caratteristiche di GIUDICE – SENTENZA?","Medico – diagnosi","Avvocato – tribunale","Studente – scuola","Pittore – pennello","Professionista – atto che formula: il giudice emette la sentenza, il medico formula la diagnosi. Le altre coppie indicano un luogo o uno strumento."],[2,"Completare la frase: «Dopo ore di discussione, le parti raggiunsero finalmente un ______ soddisfacente per entrambe».","Compromesso","Conflitto","Dissidio","Litigio","Un accordo «soddisfacente per entrambe» è un compromesso; le altre parole indicano un contrasto."],[2,"Individuare la parola che completa il brano: «La ______ è la forma di governo in cui il capo dello Stato è un sovrano che, di norma, ottiene la carica per via ereditaria».","Monarchia","Repubblica","Oligarchia","Anarchia","Nella monarchia il capo dello Stato è un re; nella repubblica è eletto; nell'oligarchia il potere è di pochi; l'anarchia è assenza di governo."],[2,"Individuare il contrario di «loquace».","Taciturno","Chiacchierone","Ciarliero","Estroverso","Loquace = che parla molto; il contrario è taciturno. Chiacchierone e ciarliero sono sinonimi."],[2,"Individuare il sinonimo di «esiguo».","Scarso","Abbondante","Enorme","Costoso","Esiguo = scarso, di piccola entità (un numero esiguo)."],[2,"Individuare il termine da scartare.","Pinguino","Aquila","Falco","Passero","Sono tutti uccelli, ma solo il pinguino non è in grado di volare."],[2,"Completare la proporzione: termometro : temperatura = bilancia : ?","Peso","Altezza","Piatto","Farmacia","Relazione strumento – grandezza misurata: il termometro misura la temperatura, la bilancia il peso."],[2,"Completare la proporzione: scrittore : romanzo = regista : ?","Film","Attore","Cinema","Platea","Relazione autore – opera: lo scrittore realizza il romanzo, il regista il film. Il cinema è il luogo, l'attore un collaboratore."],[3,"Individuare il termine da scartare.","Giugno","Gennaio","Marzo","Maggio","Gennaio, marzo e maggio hanno 31 giorni; giugno ne ha 30."],[3,"Se X : latte = ape : Y, allora:","X = mucca, Y = miele","X = formaggio, Y = miele","X = mucca, Y = fiore","X = pecora, Y = alveare","Relazione animale – prodotto: la mucca produce il latte, l'ape il miele. L'alveare è la casa dell'ape, non il suo prodotto."],[3,"Se X : scultore = pennello : Y, allora:","X = scalpello, Y = pittore","X = marmo, Y = pittore","X = scalpello, Y = tela","X = statua, Y = quadro","Relazione strumento – chi lo usa: lo scalpello è lo strumento dello scultore, il pennello quello del pittore. Il marmo è il materiale, non lo strumento."],[3,"Se PANE = 2, AEREO = 4 e STRADA = 2, allora AIUOLA = ?","5","4","6","3","Il numero corrisponde alle vocali: PANE (A, E) = 2, AEREO (A, E, E, O) = 4, STRADA (A, A) = 2. AIUOLA: A, I, U, O, A = 5. Non sono le vocali diverse: AEREO ne ha 3."],[3,"In un codice PORTA si scrive QPSUB. Come si scrive MELA?","NFMB","NFLB","LDKZ","NEMB","Ogni lettera è sostituita dalla successiva: M→N, E→F, L→M, A→B."],[3,"Se LAGO diventa AGOL e MONTE diventa ONTEM, come diventa COLLINA?","OLLINAC","ANILLOC","OLLINCA","CLLINAO","La prima lettera viene spostata in fondo alla parola: C-OLLINA → OLLINA-C."],[3,"Quale coppia ha la stessa relazione di FARINA – PANE?","Uva – vino","Pane – forno","Vino – bottiglia","Grano – campo","Materia prima – prodotto che se ne ricava: dalla farina si fa il pane, dall'uva il vino. Le altre coppie indicano un luogo o un contenitore."],[3,"L'ombrello sta alla pioggia come il cappotto sta al:","Freddo","Bottone","Armadio","Sarto","Relazione oggetto – ciò da cui protegge: l'ombrello ripara dalla pioggia, il cappotto dal freddo."],[3,"Individuare la parola da scartare.","Nuca","Cena","Acne","Cane","Cena, acne e cane sono anagrammi tra loro (lettere C, A, N, E); «nuca» contiene una U al posto della E."],[3,"Completare la frase con la coppia corretta: «Lo studio non ha fornito prove ______ dell'efficacia del farmaco: i risultati sono ancora ______».","Conclusive – provvisori","Definitive – certi","Decisive – consolidati","Insufficienti – parziali","Mancano prove definitive, quindi i risultati sono provvisori. «Certi» e «consolidati» contraddicono la prima parte; «non ha fornito prove insufficienti» non ha senso."],[3,"Quale coppia NON presenta la stessa relazione delle altre?","Milano – Adige","Roma – Tevere","Firenze – Arno","Torino – Po","Roma, Firenze e Torino sono attraversate dal fiume indicato; l'Adige non attraversa Milano (attraversa, ad esempio, Trento e Verona)."]],"3":[[1,"Individuare il sinonimo di «futile».","Frivolo","Importante","Utile","Grave","Futile = di poco conto, frivolo, vano."],[1,"Individuare il contrario di «ottimista».","Pessimista","Fiducioso","Allegro","Sereno","L'ottimista vede il lato positivo delle cose; il pessimista quello negativo."],[1,"Che cosa significa «indigente»?","Povero","Indolente","Indeciso","Straniero","Indigente = privo dei mezzi necessari per vivere. «Indolente» (pigro) è un falso amico per il suono simile."],[2,"Individuare il sinonimo di «solerte».","Diligente","Svogliato","Solitario","Lento","Solerte = zelante, diligente, sollecito nel fare il proprio dovere."],[2,"Individuare il contrario di «avvenente».","Brutto","Attraente","Giovane","Elegante","Avvenente = di bell'aspetto; il contrario è brutto. Attraente è un sinonimo."],[2,"Individuare il termine da scartare.","Chiodo","Martello","Cacciavite","Pinza","Martello, cacciavite e pinza sono attrezzi; il chiodo è l'oggetto su cui si lavora."],[2,"Individuare il termine da scartare.","Calabria","Sicilia","Sardegna","Elba","Sicilia, Sardegna ed Elba sono isole; la Calabria è una regione peninsulare."],[2,"Completare la proporzione: chiave : serratura = password : ?","Account","Tastiera","Schermo","Mouse","Relazione mezzo di apertura – ciò che apre: la chiave apre la serratura, la password dà accesso all'account."],[2,"Completare la proporzione: vite : uva = ulivo : ?","Oliva","Olio","Albero","Foglia","Relazione pianta – frutto: la vite produce l'uva, l'ulivo l'oliva
