. L'olio si ricava dal frutto (come il vino dall'uva)."],[2,"Completare la proporzione: capitano : nave = pilota : ?","Aereo","Aeroporto","Volo","Hostess","Relazione chi comanda – mezzo comandato: il capitano guida la nave, il pilota l'aereo."],[2,"Quale binomio ha le stesse caratteristiche di ALBA – TRAMONTO?","Inizio – fine","Giorno – ora","Sera – notte","Luce – lampada","L'alba è l'inizio del giorno, il tramonto la sua fine: una coppia di opposti. Sera – notte sono momenti consecutivi, non opposti."],[2,"Quale binomio ha le stesse caratteristiche di COLTELLO – LAMA?","Sedia – schienale","Pane – forno","Penna – scrivere","Libro – lettore","Relazione tutto – parte: la lama è una parte del coltello, lo schienale una parte della sedia."],[2,"Completare la frase: «La relazione era così ______ che in poche righe riassumeva l'intero progetto».","Concisa","Prolissa","Confusa","Lunga","Riassumere tutto «in poche righe» richiede una relazione concisa; prolissa e lunga sono l'opposto."],[2,"Individuare la parola che completa il brano: «Si definisce ______ un trattamento che ha lo scopo di prevenire l'insorgenza di una malattia».","Profilattico","Terapeutico","Palliativo","Diagnostico","Profilattico = preventivo. Terapeutico cura una malattia già presente; palliativo ne allevia i sintomi; diagnostico serve a individuarla."],[2,"Individuare il contrario di «umile».","Superbo","Modesto","Semplice","Povero","Umile = modesto, senza presunzione; il contrario è superbo."],[2,"Individuare il sinonimo di «dissuadere».","Distogliere","Convincere","Persuadere","Incoraggiare","Dissuadere = convincere qualcuno a non fare qualcosa, distoglierlo. Persuadere è il contrario."],[2,"Completare la proporzione: anello : catena = gradino : ?","Scala","Salita","Piano","Casa","Relazione elemento – struttura formata da elementi uguali ripetuti: gli anelli formano la catena, i gradini la scala."],[2,"Individuare il termine da scartare.","Svizzera","Germania","Francia","Spagna","Germania, Francia e Spagna fanno parte dell'Unione Europea; la Svizzera no."],[2,"Individuare il termine da scartare.","Tulipano","Mela","Pera","Pesca","Mela, pera e pesca sono frutti; il tulipano è un fiore."],[3,"Individuare il termine da scartare.","Rame","Ottone","Bronzo","Acciaio","Ottone, bronzo e acciaio sono leghe metalliche; il rame è un elemento puro (e anzi entra nella composizione di ottone e bronzo)."],[3,"Se X : Spagna = Lisbona : Y, allora:","X = Madrid, Y = Portogallo","X = Barcellona, Y = Portogallo","X = Madrid, Y = Brasile","X = Siviglia, Y = Porto","Relazione capitale – Stato: Madrid è la capitale della Spagna, Lisbona del Portogallo."],[3,"Se pompiere : X = Y : malattia, allora:","X = incendio, Y = medico","X = idrante, Y = medico","X = incendio, Y = ospedale","X = acqua, Y = farmaco","Relazione professionista – problema che combatte: il pompiere combatte l'incendio, il medico la malattia. Idrante e farmaco sono strumenti, l'ospedale un luogo."],[3,"Se BANANA = 1, CIELO = 3 e TAVOLO = 2, allora AUTOMOBILE = ?","5","6","4","10","Il numero indica le vocali diverse presenti: BANANA {A}, CIELO {I, E, O}, TAVOLO {A, O}. AUTOMOBILE: {A, U, O, I, E} = 5. Non è il numero totale di vocali: BANANA ne ha 3."],[3,"In un codice SERA si scrive RDQZ. Come si scrive PORTO?","ONQSN","QPSUP","ONRSN","NMPRM","Ogni lettera è sostituita dalla precedente nell'alfabeto (e la A dalla Z): P→O, O→N, R→Q, T→S, O→N."],[3,"Se CASA diventa ACAS e MELO diventa EMOL, come diventa FIUME?","IFMUE","EMUIF","IFUME","FIMUE","Si scambiano di posto le lettere a coppie: FI→IF, UM→MU; la E, rimasta sola, resta in fondo: IFMUE."],[3,"Quale coppia ha la stessa relazione di LIBRO – BIBLIOTECA?","Quadro – pinacoteca","Pagina – libro","Scaffale – legno","Lettore – autore","Oggetto – luogo in cui oggetti di quel tipo sono raccolti e conservati: i libri in biblioteca, i quadri in pinacoteca. Pagina – libro è una relazione parte-tutto."],[3,"Qual è il contrario del contrario di «generoso»?","Generoso","Avaro","Tirchio","Egoista","Il contrario di generoso è avaro; il contrario di avaro è di nuovo generoso."],[3,"Individuare la parola da scartare.","Luna","Lame","Mela","Male","Lame, mela e male sono anagrammi tra loro (lettere L, A, M, E); «luna» no."],[3,"Completare la frase con la coppia corretta: «Pur essendo ______ di carattere, in quell'occasione si mostrò sorprendentemente ______».","Timido – audace","Timido – riservato","Coraggioso – intrepido","Audace – sfrontato","«Pur essendo» e «sorprendentemente» richiedono due qualità opposte: timido per natura, audace in quell'occasione. Le altre coppie sono di sinonimi o termini affini."],[3,"Quale coppia NON presenta la stessa relazione delle altre?","Petrarca – Gerusalemme liberata","Dante – Divina Commedia","Manzoni – I promessi sposi","Boccaccio – Decameron","Nelle altre coppie l'autore è abbinato alla sua opera; la Gerusalemme liberata è di Torquato Tasso, non di Petrarca."]],"4":[[1,"Individuare il sinonimo di «astuto».","Furbo","Ingenuo","Sincero","Onesto","Astuto = furbo, scaltro; ingenuo è il contrario."],[1,"Individuare il contrario di «pigro».","Attivo","Indolente","Svogliato","Stanco","Pigro = restio a fare fatica; il contrario è attivo. Indolente e svogliato sono sinonimi."],[1,"Chi è un «bibliofilo»?","Chi ama e colleziona i libri","Chi vende libri","Chi scrive libri","Chi non sopporta i libri","Biblio- = libro, -filo = che ama: il bibliofilo ama e colleziona libri. Chi li vende è il libraio."],[2,"Individuare il sinonimo di «intrepido».","Coraggioso","Pauroso","Prudente","Impaziente","Intrepido = che non ha paura, coraggioso."],[2,"Individuare il contrario di «superfluo».","Indispensabile","Eccessivo","Inutile","Abbondante","Superfluo = non necessario; il contrario è indispensabile."],[2,"Individuare il termine da scartare.","Lampadina","Sedia","Tavolo","Armadio","Sedia, tavolo e armadio sono mobili; la lampadina no."],[2,"Individuare il termine da scartare.","Perugia","Napoli","Bari","Palermo","Napoli, Bari e Palermo sono città sul mare; Perugia no."],[2,"Completare la proporzione: calciatore : calcio = ciclista : ?","Ciclismo","Bicicletta","Giro d'Italia","Strada","Relazione atleta – sport praticato: il calciatore pratica il calcio, il ciclista il ciclismo. La bicicletta è l'attrezzo."],[2,"Completare la proporzione: miele : dolce = limone : ?","Aspro","Giallo","Frutto","Succo","Relazione alimento – sapore caratteristico: il miele è dolce, il limone è aspro."],[2,"Completare la proporzione: vocabolario : parole = atlante : ?","Carte geografiche","Viaggi","Globo","Esploratori","Relazione raccolta – elementi raccolti: il vocabolario raccoglie parole, l'atlante carte geografiche."],[2,"Quale binomio ha le stesse caratteristiche di TENTARE – RIUSCIRE?","Cercare – trovare","Correre – camminare","Leggere – libro","Dormire – letto","Azione – esito positivo: si tenta e si riesce, si cerca e si trova."],[2,"Quale binomio ha le stesse caratteristiche di PECORA – LANA?","Baco – seta","Cane – osso","Gatto – topo","Cavallo – stalla","Animale – fibra che produce: la pecora fornisce la lana, il baco la seta."],[2,"Completare la frase: «Il medico ha ______ una terapia di due settimane».","Prescritto","Proscritto","Descritto","Iscritto","Prescrivere = ordinare una cura. «Proscritto» (esiliato, bandito) è un termine dal suono simile ma di significato diverso."],[2,"Come si chiama un periodo di mille anni?","Millennio","Secolo","Decennio","Lustro","Millennio = 1000 anni; secolo = 100; decennio = 10; lustro = 5."],[2,"Individuare il contrario di «consueto».","Insolito","Abituale","Solito","Frequente","Consueto = abituale; il contrario è insolito."],[2,"Individuare il sinonimo di «ostinato».","Testardo","Arrendevole","Docile","Distratto","Ostinato = testardo, caparbio; arrendevole e docile sono contrari."],[2,"Completare la proporzione: nave : porto = aereo : ?","Aeroporto","Pilota","Cielo","Ala","Relazione mezzo – luogo in cui arriva e sosta: la nave attracca al porto, l'aereo atterra all'aeroporto."],[2,"Individuare il termine da scartare.","Squalo","Balena","Delfino","Foca","Balena, delfino e foca sono mammiferi; lo squalo è un pesce."],[2,"Completare la proporzione: primavera : estate = autunno : ?","Inverno","Freddo","Primavera","Settembre","Relazione stagione – stagione successiva: dopo la primavera viene l'estate, dopo l'autunno l'inverno."],[3,"Se X : chirurgo = forbici : Y, allora:","X = bisturi, Y = parrucchiere","X = ospedale, Y = parrucchiere","X = bisturi, Y = capelli","X = paziente, Y = barba","Relazione strumento – professionista che lo usa: il bisturi è lo strumento del chirurgo, le forbici quello del parrucchiere."],[3,"Se orologio : X = Y : temperatura, allora:","X = tempo, Y = termometro","X = ora, Y = febbre","X = lancette, Y = termometro","X = tempo, Y = caldo","Relazione strumento – grandezza misurata: l'orologio misura il tempo, il termometro la temperatura. Le lancette sono una parte dell'orologio."],[3,"Se CASSA = 2, BELLEZZA = 3 e TORTA = 2, allora CAPPELLO = ?","3","5","4","2","Il numero indica le consonanti diverse: CASSA {C, S}, BELLEZZA {B, L, Z}, TORTA {T, R}. CAPPELLO {C, P, L} = 3. Non è il totale delle consonanti: CASSA ne ha 3. Contando le vocali si ottiene lo stesso risultato (CAPPELLO: A, E, O = 3)."],[3,"Se FIORE diventa EFIOR e PRATO diventa OPRAT, come diventa GIARDINO?","OGIARDIN","IARDINOG","ONIDRAIG","OGIRADIN","L'ultima lettera viene spostata all'inizio della parola: GIARDIN-O → O-GIARDIN."],[3,"Se A = 1, B = 2, C = 3 e così via secondo l'ordine alfabetico, qual è la somma dei valori delle lettere della parola FEDE?","20","18","22","24","F = 6, E = 5, D = 4, E = 5: 6 + 5 + 4 + 5 = 20."],[3,"Quale coppia ha la stessa relazione di PREFAZIONE – LIBRO?","Preludio – opera lirica","Capitolo – romanzo","Epilogo – racconto","Copertina – libreria","La prefazione è la parte introduttiva del libro, il preludio quella dell'opera lirica. Il capitolo è una parte qualsiasi, l'epilogo la parte finale."],[3,"Individuare il termine da scartare.","Pollice","Metro","Secondo","Chilogrammo","Metro, secondo e chilogrammo sono unità di misura fondamentali del Sistema Internazionale; il pollice è un'unità anglosassone che non ne fa parte."],[3,"Quale parola si può associare sia a «porta», sia a «cassaforte», sia a «musica»?","Chiave","Nota","Serratura","Combinazione","Si parla di chiave della porta, chiave della cassaforte e chiave musicale (ad esempio di violino). «Combinazione» vale per la cassaforte ma non per la musica."],[3,"Individuare la parola da scartare.","Cammino","Pappagallo","Cappello","Bellezza","Pappagallo (PP, LL), cappello (PP, LL) e bellezza (LL, ZZ) contengono due doppie; cammino ne contiene una sola (MM)."],[3,"Completare la frase con la coppia corretta: «Le misure adottate si sono rivelate ______: invece di risolvere il problema, lo hanno ______».","Controproducenti – aggravato","Efficaci – risolto","Inutili – attenuato","Tempestive – evitato","«Invece di risolvere» richiede un effetto contrario a quello voluto: misure controproducenti che hanno aggravato il problema."],[3,"Quale coppia NON presenta la stessa relazione delle altre?","Raffaello – Cenacolo","Leonardo – Gioconda","Michelangelo – David","Botticelli – Nascita di Venere","Nelle altre coppie l'artista è abbinato a una sua opera; il Cenacolo (Ultima Cena) è di Leonardo da Vinci, non di Raffaello."]],"5":[[1,"Individuare il sinonimo di «gelido».","Freddissimo","Tiepido","Umido","Ventoso","Gelido = freddissimo, ghiacciato."],[1,"Individuare il contrario di «vicino».","Lontano","Accanto","Prossimo","Attiguo","Accanto, prossimo e attiguo sono sinonimi di vicino; il contrario è lontano."],[1,"Chi è un «filantropo»?","Chi si dedica al bene dell'umanità","Chi colleziona francobolli","Chi studia le piante","Chi disprezza il genere umano","Filantropo = che ama gli uomini e si adopera per il loro bene. Chi colleziona francobolli è un filatelico; chi disprezza gli uomini è un misantropo."],[2,"Individuare il sinonimo di «mite».","Pacato","Feroce","Irascibile","Severo","Mite = calmo, pacato, mansueto."],[2,"Individuare il contrario di «fertile».","Sterile","Fecondo","Produttivo","Ricco","Fertile = che produce frutti; il contrario è sterile. Fecondo è un sinonimo."],[2,"Individuare il termine da scartare.","Legno","Ferro","Oro","Argento","Ferro, oro e argento sono metalli; il legno no."],[2,"Individuare il termine da scartare.","Sahara","Alpi","Appennini","Pirenei","Alpi, Appennini e Pirenei sono catene montuose; il Sahara è un deserto."],[2,"Completare la proporzione: pane : fornaio = carne : ?","Macellaio","Pescivendolo","Fruttivendolo","Lattaio","Relazione prodotto – chi lo vende o lo lavora: il pane dal fornaio, la carne dal macellaio."],[2,"Completare la proporzione: scarpa : piede = guanto : ?","Mano","Dito","Braccio","Inverno","Relazione indumento – parte del corpo che copre: la scarpa copre il piede, il guanto la mano."],[2,"Completare la proporzione: acqua : sete = cibo : ?","Fame","Piatto","Cuoco","Gusto","Relazione ciò che soddisfa – bisogno: l'acqua toglie la sete, il cibo la fame."],[2,"Quale binomio ha le stesse caratteristiche di FULMINE – TUONO?","Pioggia – allagamento","Sole – luna","Neve – montagna","Fiume – mare","Causa – effetto: il fulmine provoca il tuono, la pioggia (abbondante) provoca l'allagamento."],[2,"Quale binomio ha le stesse caratteristiche di SARTO – ABITO?","Falegname – mobile","Postino – lettera","Cuoco – cucina","Medico – paziente","Artigiano – oggetto che realizza: il sarto confeziona l'abito, il falegname costruisce il mobile. Il postino consegna le lettere ma non le produce."],[2,"Completare la frase: «Il testo presentava numerosi errori, perciò fu necessaria un'attenta ______».","Revisione","Pubblicazione","Traduzione","Stampa","Per correggere errori serve una revisione; «perciò» indica la conseguenza logica degli errori."],[2,"Individuare la parola che completa il brano: «La ______ è la scienza che studia i fenomeni atmosferici, anche allo scopo di prevedere il tempo».","Meteorologia","Astronomia","Geologia","Idrologia","La meteorologia studia l'atmosfera e fa le previsioni del tempo; l'astronomia studia i corpi celesti, la geologia la Terra, l'idrologia le acque."],[2,"Individuare il contrario di «pacifico».","Bellicoso","Tranquillo","Calmo","Mite","Pacifico = amante della pace; il contrario è bellicoso."],[2,"Individuare il sinonimo di «erudito».","Colto","Ignorante","Anziano","Timido","Erudito = molto istruito, colto."],[2,"Completare la proporzione: secondo : minuto = ora : ?","Giorno","Minuto","Settimana","Anno","Relazione unità – unità immediatamente superiore che la contiene: i secondi formano il minuto, le ore formano il giorno."],[2,"Individuare il termine da scartare.","Picasso","Mozart","Beethoven","Verdi","Mozart, Beethoven e Verdi sono compositori; Picasso è un pittore."],[2,"Completare la proporzione: gallina : pulcino = cavallo : ?","Puledro","Stalla","Fieno","Criniera","Relazione animale adulto – piccolo: il piccolo della gallina è il pulcino, quello del cavallo il puledro."],[3,"Se X : Grecia = Berlino : Y, allora:","X = Atene, Y = Germania","X = Sparta, Y = Germania","X = Atene, Y = Austria","X = Creta, Y = Monaco","Relazione capitale – Stato: Atene è la capitale della Grecia, Berlino della Germania."],[3,"Se pittore : quadro = X : Y, allora:","X = poeta, Y = poesia","X = poeta, Y = libreria","X = lettore, Y = poesia","X = musica, Y = compositore","Relazione autore – opera: il pittore dipinge il quadro, il poeta scrive la poesia. L'ultima opzione inverte l'ordine della relazione."],[3,"Se CARTA = 0, BELLO = 1 e ZUCCHERO = 1, allora CAPPELLO = ?","2","1","3","8","Il numero indica le doppie presenti: CARTA nessuna, BELLO (LL) una, ZUCCHERO (CC) una. CAPPELLO: PP e LL = 2."],[3,"In un codice SOLE si scrive TPMF. Come si scrive NUBE?","OVCF","OVBF","MTAD","OUCF","Ogni lettera è sostituita dalla successiva nell'alfabeto: N→O, U→V, B→C, E→F."],[3,"Se A = 1, B = 2, C = 3 e così via secondo l'ordine alfabetico, quale parola ha un valore complessivo pari a 10?","Dea","Bada","Cede","Fida","DEA: 4 + 5 + 1 = 10. BADA = 8, CEDE = 17, FIDA = 20."],[3,"Quale coppia ha la stessa relazione di FARMACO – MALATTIA?","Antidoto – veleno","Medico – ospedale","Pillola – scatola","Sintomo – febbre","Rimedio – male che contrasta: il farmaco combatte la malattia, l'antidoto neutralizza il veleno."],[3,"Quale parola si può associare sia ad «albero», sia a «dente», sia a «matematica»?","Radice","Ramo","Foglia","Numero","Radice dell'albero, radice del dente, radice quadrata. «Ramo» vale per l'albero ma non per il dente."],[3,"Individuare il termine da scartare.","Napoli","Torino","Firenze","Roma","Torino, Firenze e Roma sono state capitali del Regno d'Italia dopo l'Unità; Napoli no (era stata capitale del Regno delle Due Sicilie, prima dell'Unità)."],[3,"Individuare la parola da scartare.","Mela","Banana","Casa","Patata","In banana, casa e patata l'unica vocale presente è la A; in «mela» compare anche la E."],[3,"Completare la frase con la coppia corretta: «Il nuovo regolamento, anziché ______ le procedure, le ha rese ancora più ______».","Semplificare – complesse","Complicare – difficili","Snellire – rapide","Aggiornare – moderne","«Anziché» indica un risultato opposto all'intenzione: doveva semplificare e invece ha reso le procedure più complesse."],[3,"Quale coppia NON presenta la stessa relazione delle altre?","Galilei – lampadina","Marconi – radio","Volta – pila","Meucci – telefono","Nelle altre coppie l'inventore è abbinato alla sua invenzione; la lampadina a incandescenza è legata a Edison (e Swan), non a Galileo Galilei."]]}};
const VERSIONE = "Versione completa · v3.1 con simulazione · 28/09/2026";

const BLOCCHI = [
  {id:"CG",  nome:"Cultura generale", sigla:"CG"},
  {id:"INF", nome:"Informatica",      sigla:"INF"},
  {id:"LV",  nome:"Logica verbale",   sigla:"LV"},
  {id:"ING", nome:"Inglese",          sigla:"EN"},
  {id:"LD",  nome:"Logica deduttiva", sigla:"LD"},
  {id:"LN",  nome:"Logica numerica",  sigla:"LN"}
];
const N_ES = 5;
const PUNTI = {ok:2.5, err:-0.833, om:-0.416};
const SOGLIA = 60;
const SEC_PER_DOMANDA = 75;               /* 50 minuti / 40 domande */
const LIVELLI = {1:"Liv. 1 · Ricordo",2:"Liv. 2 · Abilità",3:"Liv. 3 · Strategico"};
const LETT = ["A","B","C","D"];
const KEY = "pz-preselettiva-v1";

/* ---------- archivio locale ---------- */
function loadDB(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {tentativi:[],incorso:null,timer:true}; }catch(e){ return {tentativi:[],incorso:null,timer:true}; } }
function saveDB(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }
let DB = loadDB();
if(!Array.isArray(DB.tentativi)) DB.tentativi=[];
if(DB.timer===undefined) DB.timer=true;

const $app = document.getElementById("app");
const $modal = document.getElementById("modal");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt1 = n => (Math.round(n*10)/10).toFixed(1).replace(".",",");
const mmss = s => { s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); };
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function domande(bid,n){ return (BANCA && BANCA[bid] && BANCA[bid][n]) || null; }
function tentativiDi(code){ return DB.tentativi.filter(t=>t.es===code); }
function migliore(code){ const t=tentativiDi(code); return t.length ? Math.max(...t.map(x=>x.punteggio)) : null; }

/* ---------- navigazione ---------- */
let timerId = null;
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function go(view, arg){ stopTimer(); closeModal(); window.scrollTo(0,0); view(arg); }

function header(titolo, sub, back, extra){
  return `<header class="top">
    ${back?`<button class="iconbtn" data-act="${back}" aria-label="Indietro">&#8249;</button>`:""}
    <h1>${titolo}${sub?`<span class="sub">${sub}</span>`:""}</h1>${extra||""}
  </header>`;
}

/* ---------- HOME ---------- */
function viewHome(){
  const righe = BLOCCHI.map(b=>{
    const pronte=[...Array(N_ES)].filter((_,i)=>domande(b.id,i+1)).length;
    const svolte=[...Array(N_ES)].filter((_,i)=>tentativiDi(b.id+"-"+(i+1)).length).length;
    const info = pronte ? `${pronte} esercitazioni · ${svolte} svolte` : "In arrivo nei prossimi aggiornamenti";
    return `<button class="block ${pronte?"":"soon"}" data-act="blocco" data-b="${b.id}">
      <span class="ico">${b.sigla}</span>
      <span class="t"><b>${b.nome}</b><span>${info}</span></span>
      <span class="chev">&#8250;</span></button>`;
  }).join("");
  $app.innerHTML = header("Preselettiva PuntoZero","Esercitazioni per blocco", null,
      `<button class="iconbtn" data-act="storico">Storico</button>`)+
    `<div class="card intro"><p>30 domande per esercitazione, 4 risposte, una sola corretta. Punteggio come nella prova: <b>+2,5</b> giusta, <b>−0,833</b> sbagliata, <b>−0,416</b> non data, riportato su base 100. Soglia: <b>60</b>.</p></div>
    ${DB.incorso?`<div class="card intro" style="border-color:var(--warn)"><p><b>Prova in sospeso</b> (${esc(titoloEs(DB.incorso.es))}): ${DB.incorso.risp.filter(r=>r!==null).length} risposte date.</p>
      <div class="qnav" style="margin-top:10px"><button class="btn" data-act="m:scarta">Scarta</button><button class="btn primary" data-act="m:riprendi">Riprendi</button></div></div>`:""}
    ${simPronta()?(()=>{ const ts=tentativiDi("SIM"), best=migliore("SIM");
      return `<button class="block" data-act="pre" data-code="SIM" style="border-color:var(--accent);margin-bottom:10px">
        <span class="ico" style="background:var(--accent);color:var(--accent-ink)">40</span>
        <span class="t"><b>Simulazione completa</b><span>40 domande · 50 minuti · schema della prova${ts.length?` · migliore ${fmt1(best)} (${ts.length} svolte)`:""}</span></span>
        <span class="chev">&#8250;</span></button>`; })():""}
    <div class="blocks">${righe}</div>
    <footer>${esc(VERSIONE)} · i risultati restano solo su questo dispositivo</footer>`;
}

/* ---------- BLOCCO ---------- */
function viewBlocco(bid){
  const b = BLOCCHI.find(x=>x.id===bid);
  const righe=[...Array(N_ES)].map((_,i)=>{
    const n=i+1, code=bid+"-"+n, pronta=!!domande(bid,n), t=tentativiDi(code), best=migliore(code);
    let dx = pronta ? (best===null?`<span class="tag">da fare</span>`
      : `<div class="best num" style="color:var(${best>=SOGLIA?"--ok":"--bad"})">${fmt1(best)}<small>migliore · ${t.length} tent.</small></div>`)
      : `<span class="tag">in arrivo</span>`;
    return `<button class="card ex" ${pronta?`data-act="pre" data-code="${code}"`:"disabled"}>
      <span class="n">${n}</span><span class="t"><b>Esercitazione ${n}</b><span class="small muted">30 domande</span></span>${dx}</button>`;
  }).join("");
  $app.innerHTML = header(b.nome,"Scegli l'esercitazione","home")+`<div class="exlist">${righe}</div>`;
}

/* ---------- SIMULAZIONE: schema della busta ufficiale ---------- */
const SCHEMA_SIM = [["CG",5],["INF",10],["LV",5],["ING",10],["LD",5],["LN",5]];
const N_SIM = SCHEMA_SIM.reduce((a,x)=>a+x[1],0);
const getD = it => BANCA[it[0]][it[1]][it[2]];
const codeOf = it => `${it[0]}-${it[1]}-${it[2]+1}`;
const nomeB = bid => (BLOCCHI.find(x=>x.id===bid)||{nome:bid}).nome;
function titoloEs(es){ if(es==="SIM") return "Simulazione completa"; const [b,n]=es.split("-"); return `${nomeB(b)} · Es. ${n}`; }
function backEs(es){ return es==="SIM" ? "home" : "blocco:"+es.split("-")[0]; }
function simPronta(){ return SCHEMA_SIM.every(([b])=>BANCA && BANCA[b]); }
function componiSimulazione(){
  const usati = new Set(DB.usati||[]); const items=[];
  for(const [bid,k] of SCHEMA_SIM){
    const tutte=[]; Object.keys(BANCA[bid]).forEach(n=>BANCA[bid][n].forEach((_,i)=>tutte.push([bid,n,i])));
    const nuove=shuffle(tutte.filter(it=>!usati.has(codeOf(it)))), viste=shuffle(tutte.filter(it=>usati.has(codeOf(it))));
    items.push(...nuove.concat(viste).slice(0,k));
  }
  return items;
}

/* ---------- PRIMA DI INIZIARE ---------- */
function viewPre(code){
  const sim = code==="SIM";
  const n = sim ? N_SIM : domande(...code.split("-")).length;
  const regolaExtra = sim
    ? `<li>${N_SIM} domande estratte dall'intera banca dati con lo schema della prova: ${SCHEMA_SIM.map(([b,k])=>`${k} di ${nomeB(b)}`).join(", ")}.</li>
       <li>Le domande compaiono per blocco, nello stesso ordine della busta ufficiale; vengono preferite quelle non uscite nelle simulazioni precedenti.</li>
       <li>Punteggio massimo 100 (40 × 2,5), soglia 60: esattamente come nella prova.</li>`
    : `<li>${n} domande in ordine casuale; anche le risposte vengono rimescolate a ogni tentativo.</li>`;
  $app.innerHTML = header(titoloEs(code),"Prima di iniziare",backEs(code))+
   `<div class="card rules"><h2>Regole</h2><ul>${regolaExtra}
     <li>Puoi spostarti tra le domande e cambiare risposta fino alla consegna.</li>
     <li>Risposta giusta +2,5 · sbagliata −0,833 · non data −0,416.</li>
     <li><b>Non lasciare risposte in bianco:</b> tirare a indovinare vale in media 0 punti, lasciare in bianco costa sempre −0,416.</li>
     <li>La correzione compare solo alla fine, come nella prova.</li></ul></div>
   <label class="card switch"><span><b>Cronometro</b><br><span class="small muted">${mmss(n*SEC_PER_DOMANDA)} (stesso ritmo della prova: 50 minuti per 40 domande)</span></span>
     <input type="checkbox" id="chkTimer" ${DB.timer?"checked":""}></label>
   <button class="btn primary wide" data-act="start" data-code="${code}">Inizia</button>`;
}

/* ---------- QUIZ ---------- */
let Q = null;  /* stato della prova in corso */
function startQuiz(code){
  DB.timer = !!document.getElementById("chkTimer")?.checked;
  let items;
  if(code==="SIM") items = componiSimulazione();
  else { const [bid,n]=code.split("-"); items = shuffle(domande(bid,+n).map((_,i)=>[bid,n,i])); }
  Q = { es:code, items, opz: items.map(()=>shuffle([0,1,2,3])), risp: items.map(()=>null),
        cur:0, timer:DB.timer, durata: items.length*SEC_PER_DOMANDA, inizio: Date.now(), trascorso:0 };
  DB.incorso=Q; saveDB(); viewQuiz();
}
function tempoTrascorso(){ return Q.trascorso + (Date.now()-Q.inizio)/1000; }
function viewQuiz(){
  const N=Q.items.length, i=Q.cur, it=Q.items[i], d=getD(it);
  const fatte=Q.risp.filter(r=>r!==null).length;
  const opts=Q.opz[i].map((o,k)=>`<button class="opt ${Q.risp[i]===o?"sel":""}" data-act="scegli" data-o="${o}"><span class="l">${LETT[k]}</span><span>${esc(d[2+o])}</span></button>`).join("");
  const grid=Q.items.map((_,k)=>`<button class="${Q.risp[k]!==null?"done":""} ${k===i?"cur":""}" data-act="vai" data-i="${k}">${k+1}</button>`).join("");
  $app.innerHTML = header(titoloEs(Q.es),`${fatte} risposte su ${N}`,"esci")+
   `<div class="qbar"><div class="prog"><i style="width:${(i+1)/N*100}%"></i></div>
     ${Q.timer?`<span class="timer num" id="tmr">--:--</span>`:""}</div>
   <div class="card qcard">
     <div class="qhead"><span>Domanda <b>${i+1}</b> di ${N}${Q.es==="SIM"?` · ${nomeB(it[0])}`:""}</span><span class="code">${codeOf(it)}</span></div>
     <p class="qtext">${esc(d[1])}</p>
     <div class="opts">${opts}</div>
     ${Q.risp[i]!==null?`<button class="clear" data-act="svuota">Togli la risposta</button>`:""}
   </div>
   <div class="qnav">
     <button class="btn" data-act="prev" ${i===0?"disabled":""}>&#8249; Precedente</button>
     <button class="btn primary" data-act="next" ${i===N-1?"disabled":""}>Successiva &#8250;</button>
   </div>
   <div class="grid">${grid}</div>
   <button class="btn wide submit" data-act="consegna">Consegna</button>`;
  if(Q.timer) tick();
}
function tick(){
  stopTimer();
  const upd=()=>{
    const rest=Q.durata-tempoTrascorso(); const el=document.getElementById("tmr");
    if(el){ el.textContent=mmss(rest); el.classList.toggle("low", rest<=300); }
    if(rest<=0){ stopTimer(); consegna(true); }
  };
  upd(); timerId=setInterval(upd,1000);
}
function pausaQuiz(){ if(Q){ Q.trascorso=tempoTrascorso(); Q.inizio=Date.now(); DB.incorso=Q; saveDB(); } }

function consegna(scaduto){
  stopTimer();
  let c=0,e=0,o=0; const perLiv={1:[0,0],2:[0,0],3:[0,0]}, perB={};
  Q.items.forEach((it,k)=>{
    const r=Q.risp[k], d=getD(it); perLiv[d[0]][1]++;
    const pb = perB[it[0]] || (perB[it[0]]={c:0,e:0,o:0});
    if(r===null){o++; pb.o++;} else if(r===0){c++; pb.c++; perLiv[d[0]][0]++;} else {e++; pb.e++;}
  });
  const grezzo=c*PUNTI.ok+e*PUNTI.err+o*PUNTI.om;
  const max=Q.items.length*PUNTI.ok;
  const punteggio=grezzo/max*100;
  const tempo=Math.min(Q.durata, tempoTrascorso());
  const t={es:Q.es, data:Date.now(), punteggio:Math.round(punteggio*10)/10, c,e,o, tempo:Math.round(tempo), timer:Q.timer};
  if(Q.es==="SIM"){ t.blocchi=perB; DB.usati=(DB.usati||[]).concat(Q.items.map(codeOf)).slice(-600); }
  DB.tentativi.push(t); DB.incorso=null; saveDB();
  const res={t, grezzo, max, perLiv, perB, scaduto:!!scaduto, items:Q.items, opz:Q.opz, risp:Q.risp};
  Q=null; go(viewRisultato, res);
}

/* ---------- RISULTATO ---------- */
let R=null, filtro="errori";
function viewRisultato(res){
  if(res) R=res;
  const es=R.t.es, sim=es==="SIM";
  const pass=R.t.punteggio>=SOGLIA;
  const liv=[1,2,3].filter(l=>R.perLiv[l][1]).map(l=>{
    const [ok,tot]=R.perLiv[l]; return `<div class="lvrow"><span>${LIVELLI[l]}</span><span class="bar"><i style="width:${ok/tot*100}%"></i></span><span class="num" style="text-align:right">${ok}/${tot}</span></div>`;
  }).join("");
  const blocchi = sim ? `<div class="card lv"><h3>Risultato per blocco</h3>${SCHEMA_SIM.map(([b,k])=>{
      const x=R.perB[b]||{c:0,e:0,o:0}; const pt=x.c*PUNTI.ok+x.e*PUNTI.err+x.o*PUNTI.om;
      return `<div class="lvrow"><span>${nomeB(b)}</span><span class="bar"><i style="width:${x.c/k*100}%"></i></span><span class="num" style="text-align:right">${x.c}/${k}</span></div>
        <div class="small muted" style="margin:-4px 0 10px">${x.e} errate · ${x.o} non date · punti ${fmt1(pt)} su ${fmt1(k*PUNTI.ok)}</div>`;
    }).join("")}</div>` : "";
  const voci=R.items.map((it,k)=>{
    const d=getD(it), r=R.risp[k];
    const stato = r===null?"o":(r===0?"c":"e");
    if(filtro==="errori" && stato==="c") return "";
    const lettera = o => LETT[R.opz[k].indexOf(o)];
    const tua = r===null ? `<div class="ans om">Non hai risposto</div>`
      : `<div class="ans ${stato==="c"?"ok":"bad"}">La tua risposta: ${lettera(r)}) ${esc(d[2+r])}</div>`;
    const giusta = stato==="c" ? "" : `<div class="ans ok">Risposta corretta: ${lettera(0)}) ${esc(d[2])}</div>`;
    return `<div class="card rev"><div class="qhead"><span>Domanda ${k+1} · ${sim?nomeB(it[0])+" · ":""}${LIVELLI[d[0]]}</span><span class="code">${codeOf(it)}</span></div>
      <p class="qt">${esc(d[1])}</p>${tua}${giusta}<p class="exp">${esc(d[6])}</p></div>`;
  }).join("") || `<p class="muted" style="text-align:center">Nessun errore: tutte corrette.</p>`;
  const altro = sim ? `<button class="btn" data-act="home">Schermata iniziale</button><button class="btn primary" data-act="pre" data-code="SIM">Nuova simulazione</button>`
                    : `<button class="btn" data-act="blocco" data-b="${es.split("-")[0]}">Altre esercitazioni</button><button class="btn primary" data-act="pre" data-code="${es}">Rifai</button>`;
  $app.innerHTML = header(titoloEs(es),"Risultato",backEs(es))+
   `<div class="card score ${pass?"pass":"fail"}">
     <div class="big num">${fmt1(R.t.punteggio)}<small> /100</small></div>
     <div class="verdict">${pass?"Soglia superata":"Sotto la soglia di 60"}${R.scaduto?" · tempo scaduto":""}</div>
     <div class="stats">
       <div class="stat"><b class="num" style="color:var(--ok)">${R.t.c}</b><span>corrette</span></div>
       <div class="stat"><b class="num" style="color:var(--bad)">${R.t.e}</b><span>errate</span></div>
       <div class="stat"><b class="num" style="color:var(--warn)">${R.t.o}</b><span>non date</span></div>
     </div>
     <div class="small muted">Punti ${fmt1(R.grezzo)} su ${fmt1(R.max)} · tempo ${mmss(R.t.tempo)}</div>
   </div>
   ${blocchi}
   <div class="card lv"><h3>Risposte corrette per livello</h3>${liv}</div>
   <div class="qnav" style="margin:0 0 14px">${altro}</div>
   <div class="filt"><button data-act="filtro" data-f="errori" aria-pressed="${filtro==="errori"}">Errori e non date</button><button data-act="filtro" data-f="tutte" aria-pressed="${filtro==="tutte"}">Tutte</button></div>
   ${voci}
   <p class="small muted" style="text-align:center">Se una domanda ti sembra sbagliata, annota il codice che compare in alto a destra (es. INF-3-12) e segnalalo.</p>`;
}

/* ---------- STORICO ---------- */
function viewStorico(){
  const righe=DB.tentativi.slice().reverse().map(t=>{
    const d=new Date(t.data).toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"});
    return `<div class="hrow"><span><b>${t.es==="SIM"?"Simulazione completa":titoloEs(t.es)}</b><br><span class="small muted">${d} · ${t.c} ok, ${t.e} err, ${t.o} vuote</span></span>
      <b class="num ${t.punteggio>=SOGLIA?"ok":"bad"}">${fmt1(t.punteggio)}</b></div>`;
  }).join("");
  $app.innerHTML = header("Storico","Tutti i tentativi","home")+
    (righe?`<div class="card hist">${righe}</div><button class="btn wide" style="margin-top:16px" data-act="azzera">Cancella lo storico</button>`
          :`<p class="muted" style="text-align:center;margin-top:30px">Nessun tentativo registrato.</p>`);
}

/* ---------- modale ---------- */
function showModal(t,p,bottoni){
  $modal.innerHTML=`<div class="modal"><div class="box"><h3>${t}</h3><p>${p}</p>
    <div class="row">${bottoni.map((b,i)=>`<button class="btn ${i===bottoni.length-1?"primary":""}" data-act="m:${b[1]}">${b[0]}</button>`).join("")}</div></div></div>`;
}
function closeModal(){ $modal.innerHTML=""; }

/* ---------- eventi ---------- */
document.addEventListener("click", ev=>{
  const el=ev.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act;
  if(a==="home") return go(viewHome);
  if(a==="storico") return go(viewStorico);
  if(a==="blocco"){ const bid=el.dataset.b; const has=[...Array(N_ES)].some((_,i)=>domande(bid,i+1)); if(!has) return showModal("In arrivo","Le esercitazioni di questo blocco saranno aggiunte con i prossimi aggiornamenti.",[["Ok","chiudi"]]); return go(viewBlocco,bid); }
  if(a.startsWith("blocco:")) return go(viewBlocco,a.slice(7));
  if(a==="pre") return go(viewPre, el.dataset.code);
  if(a==="start"){ startQuiz(el.dataset.code); return; }
  if(Q){
    if(a==="scegli"){ Q.risp[Q.cur]=+el.dataset.o; pausaQuiz(); return viewQuiz(); }
    if(a==="svuota"){ Q.risp[Q.cur]=null; pausaQuiz(); return viewQuiz(); }
    if(a==="prev"&&Q.cur>0){ Q.cur--; pausaQuiz(); window.scrollTo(0,0); return viewQuiz(); }
    if(a==="next"&&Q.cur<Q.items.length-1){ Q.cur++; pausaQuiz(); window.scrollTo(0,0); return viewQuiz(); }
    if(a==="vai"){ Q.cur=+el.dataset.i; pausaQuiz(); window.scrollTo(0,0); return viewQuiz(); }
    if(a==="consegna"){ const v=Q.risp.filter(r=>r===null).length;
      return showModal("Consegnare?", v?`Hai ancora <b>${v}</b> domande senza risposta: ognuna costa −0,416. Conviene rispondere comunque.`:"Hai risposto a tutte le domande.",[["Torna alle domande","chiudi"],["Consegna","consegna"]]); }
    if(a==="esci"){ return showModal("Uscire?","L'esercitazione resta in sospeso: potrai riprenderla dalla schermata iniziale.",[["Continua","chiudi"],["Esci","esci"]]); }
  }
  if(a==="filtro"){ filtro=el.dataset.f; return viewRisultato(); }
  if(a==="azzera") return showModal("Cancellare lo storico?","Tutti i punteggi salvati su questo dispositivo verranno eliminati.",[["Annulla","chiudi"],["Cancella","azzera"]]);
  if(a.startsWith("m:")){
    const m=a.slice(2); closeModal();
    if(m==="consegna") return consegna(false);
    if(m==="esci"){ pausaQuiz(); Q=null; return go(viewHome); }
    if(m==="riprendi"){ Q=DB.incorso;
      if(!Q.items && Q.ordine){ const [rb,rn]=Q.es.split("-"); Q.items=Q.ordine.map(i=>[rb,rn,i]); }
      try{ Q.items.forEach(getD); if(!Q.items.every(getD)) throw 0; }catch(e){ DB.incorso=null; saveDB(); Q=null; return go(viewHome); }
      Q.inizio=Date.now(); return go(viewQuiz); }
    if(m==="scarta"){ DB.incorso=null; saveDB(); return go(viewHome); }
    if(m==="azzera"){ DB.tentativi=[]; saveDB(); return go(viewStorico); }
  }
});
document.addEventListener("change", ev=>{ if(ev.target.id==="chkTimer"){ DB.timer=ev.target.checked; saveDB(); } });
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) pausaQuiz(); });

if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("./sw.js").catch(()=>{}); }
viewHome();
</script>
</body>
</html>
