evitato","«Invece di risolvere» richiede un effetto contrario a quello voluto: misure controproducenti che hanno aggravato il problema."],[3,"Quale coppia NON presenta la stessa relazione delle altre?","Raffaello – Cenacolo","Leonardo – Gioconda","Michelangelo – David","Botticelli – Nascita di Venere","Nelle altre coppie l'artista è abbinato a una sua opera; il Cenacolo (Ultima Cena) è di Leonardo da Vinci, non di Raffaello."]],"5":[[1,"Individuare il sinonimo di «gelido».","Freddissimo","Tiepido","Umido","Ventoso","Gelido = freddissimo, ghiacciato."],[1,"Individuare il contrario di «vicino».","Lontano","Accanto","Prossimo","Attiguo","Accanto, prossimo e attiguo sono sinonimi di vicino; il contrario è lontano."],[1,"Chi è un «filantropo»?","Chi si dedica al bene dell'umanità","Chi colleziona francobolli","Chi studia le piante","Chi disprezza il genere umano","Filantropo = che ama gli uomini e si adopera per il loro bene. Chi colleziona francobolli è un filatelico; chi disprezza gli uomini è un misantropo."],[2,"Individuare il sinonimo di «mite».","Pacato","Feroce","Irascibile","Severo","Mite = calmo, pacato, mansueto."],[2,"Individuare il contrario di «fertile».","Sterile","Fecondo","Produttivo","Ricco","Fertile = che produce frutti; il contrario è sterile. Fecondo è un sinonimo."],[2,"Individuare il termine da scartare.","Legno","Ferro","Oro","Argento","Ferro, oro e argento sono metalli; il legno no."],[2,"Individuare il termine da scartare.","Sahara","Alpi","Appennini","Pirenei","Alpi, Appennini e Pirenei sono catene montuose; il Sahara è un deserto."],[2,"Completare la proporzione: pane : fornaio = carne : ?","Macellaio","Pescivendolo","Fruttivendolo","Lattaio","Relazione prodotto – chi lo vende o lo lavora: il pane dal fornaio, la carne dal macellaio."],[2,"Completare la proporzione: scarpa : piede = guanto : ?","Mano","Dito","Braccio","Inverno","Relazione indumento – parte del corpo che copre: la scarpa copre il piede, il guanto la mano."],[2,"Completare la proporzione: acqua : sete = cibo : ?","Fame","Piatto","Cuoco","Gusto","Relazione ciò che soddisfa – bisogno: l'acqua toglie la sete, il cibo la fame."],[2,"Quale binomio ha le stesse caratteristiche di FULMINE – TUONO?","Pioggia – allagamento","Sole – luna","Neve – montagna","Fiume – mare","Causa – effetto: il fulmine provoca il tuono, la pioggia (abbondante) provoca l'allagamento."],[2,"Quale binomio ha le stesse caratteristiche di SARTO – ABITO?","Falegname – mobile","Postino – lettera","Cuoco – cucina","Medico – paziente","Artigiano – oggetto che realizza: il sarto confeziona l'abito, il falegname costruisce il mobile. Il postino consegna le lettere ma non le produce."],[2,"Completare la frase: «Il testo presentava numerosi errori, perciò fu necessaria un'attenta ______».","Revisione","Pubblicazione","Traduzione","Stampa","Per correggere errori serve una revisione; «perciò» indica la conseguenza logica degli errori."],[2,"Individuare la parola che completa il brano: «La ______ è la scienza che studia i fenomeni atmosferici, anche allo scopo di prevedere il tempo».","Meteorologia","Astronomia","Geologia","Idrologia","La meteorologia studia l'atmosfera e fa le previsioni del tempo; l'astronomia studia i corpi celesti, la geologia la Terra, l'idrologia le acque."],[2,"Individuare il contrario di «pacifico».","Bellicoso","Tranquillo","Calmo","Mite","Pacifico = amante della pace; il contrario è bellicoso."],[2,"Individuare il sinonimo di «erudito».","Colto","Ignorante","Anziano","Timido","Erudito = molto istruito, colto."],[2,"Completare la proporzione: secondo : minuto = ora : ?","Giorno","Minuto","Settimana","Anno","Relazione unità – unità immediatamente superiore che la contiene: i secondi formano il minuto, le ore formano il giorno."],[2,"Individuare il termine da scartare.","Picasso","Mozart","Beethoven","Verdi","Mozart, Beethoven e Verdi sono compositori; Picasso è un pittore."],[2,"Completare la proporzione: gallina : pulcino = cavallo : ?","Puledro","Stalla","Fieno","Criniera","Relazione animale adulto – piccolo: il piccolo della gallina è il pulcino, quello del cavallo il puledro."],[3,"Se X : Grecia = Berlino : Y, allora:","X = Atene, Y = Germania","X = Sparta, Y = Germania","X = Atene, Y = Austria","X = Creta, Y = Monaco","Relazione capitale – Stato: Atene è la capitale della Grecia, Berlino della Germania."],[3,"Se pittore : quadro = X : Y, allora:","X = poeta, Y = poesia","X = poeta, Y = libreria","X = lettore, Y = poesia","X = musica, Y = compositore","Relazione autore – opera: il pittore dipinge il quadro, il poeta scrive la poesia. L'ultima opzione inverte l'ordine della relazione."],[3,"Se CARTA = 0, BELLO = 1 e ZUCCHERO = 1, allora CAPPELLO = ?","2","1","3","8","Il numero indica le doppie presenti: CARTA nessuna, BELLO (LL) una, ZUCCHERO (CC) una. CAPPELLO: PP e LL = 2."],[3,"In un codice SOLE si scrive TPMF. Come si scrive NUBE?","OVCF","OVBF","MTAD","OUCF","Ogni lettera è sostituita dalla successiva nell'alfabeto: N→O, U→V, B→C, E→F."],[3,"Se A = 1, B = 2, C = 3 e così via secondo l'ordine alfabetico, quale parola ha un valore complessivo pari a 10?","Dea","Bada","Cede","Fida","DEA: 4 + 5 + 1 = 10. BADA = 8, CEDE = 17, FIDA = 20."],[3,"Quale coppia ha la stessa relazione di FARMACO – MALATTIA?","Antidoto – veleno","Medico – ospedale","Pillola – scatola","Sintomo – febbre","Rimedio – male che contrasta: il farmaco combatte la malattia, l'antidoto neutralizza il veleno."],[3,"Quale parola si può associare sia ad «albero», sia a «dente», sia a «matematica»?","Radice","Ramo","Foglia","Numero","Radice dell'albero, radice del dente, radice quadrata. «Ramo» vale per l'albero ma non per il dente."],[3,"Individuare il termine da scartare.","Napoli","Torino","Firenze","Roma","Torino, Firenze e Roma sono state capitali del Regno d'Italia dopo l'Unità; Napoli no (era stata capitale del Regno delle Due Sicilie, prima dell'Unità)."],[3,"Individuare la parola da scartare.","Mela","Banana","Casa","Patata","In banana, casa e patata l'unica vocale presente è la A; in «mela» compare anche la E."],[3,"Completare la frase con la coppia corretta: «Il nuovo regolamento, anziché ______ le procedure, le ha rese ancora più ______».","Semplificare – complesse","Complicare – difficili","Snellire – rapide","Aggiornare – moderne","«Anziché» indica un risultato opposto all'intenzione: doveva semplificare e invece ha reso le procedure più complesse."],[3,"Quale coppia NON presenta la stessa relazione delle altre?","Galilei – lampadina","Marconi – radio","Volta – pila","Meucci – telefono","Nelle altre coppie l'inventore è abbinato alla sua invenzione; la lampadina a incandescenza è legata a Edison (e Swan), non a Galileo Galilei."]]}};
const VERSIONE = "Lotto 1 · v1.0 · 27/09/2026";

const BLOCCHI = [
  {id:"CG",  nome:"Cultura generale", sigla:"CG"},
  {id:"INF", nome:"Informatica",      sigla:"INF"},
  {id:"LV",  nome:"Logica verbale",   sigla:"LV"},
  {id:"ING", nome:"Inglese",          sigla:"EN"},
  {id:"LD",  nome:"Logica deduttiva", sigla:"LD"},
  {id:"LN",  nome:"Logica numerica",  sigla:"LN"}
];
const N_ES = 5;
const PUNTI = {ok:2.5, err:-0.833, om:-0.416};
const SOGLIA = 60;
const SEC_PER_DOMANDA = 75;               /* 50 minuti / 40 domande */
const LIVELLI = {1:"Liv. 1 · Ricordo",2:"Liv. 2 · Abilità",3:"Liv. 3 · Strategico"};
const LETT = ["A","B","C","D"];
const KEY = "pz-preselettiva-v1";

/* ---------- archivio locale ---------- */
function loadDB(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {tentativi:[],incorso:null,timer:true}; }catch(e){ return {tentativi:[],incorso:null,timer:true}; } }
function saveDB(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }
let DB = loadDB();
if(!Array.isArray(DB.tentativi)) DB.tentativi=[];
if(DB.timer===undefined) DB.timer=true;

const $app = document.getElementById("app");
const $modal = document.getElementById("modal");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt1 = n => (Math.round(n*10)/10).toFixed(1).replace(".",",");
const mmss = s => { s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); };
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function domande(bid,n){ return (BANCA && BANCA[bid] && BANCA[bid][n]) || null; }
function tentativiDi(code){ return DB.tentativi.filter(t=>t.es===code); }
function migliore(code){ const t=tentativiDi(code); return t.length ? Math.max(...t.map(x=>x.punteggio)) : null; }

/* ---------- navigazione ---------- */
let timerId = null;
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function go(view, arg){ stopTimer(); closeModal(); window.scrollTo(0,0); view(arg); }

function header(titolo, sub, back, extra){
  return `<header class="top">
    ${back?`<button class="iconbtn" data-act="${back}" aria-label="Indietro">&#8249;</button>`:""}
    <h1>${titolo}${sub?`<span class="sub">${sub}</span>`:""}</h1>${extra||""}
  </header>`;
}

/* ---------- HOME ---------- */
function viewHome(){
  const righe = BLOCCHI.map(b=>{
    const pronte=[...Array(N_ES)].filter((_,i)=>domande(b.id,i+1)).length;
    const svolte=[...Array(N_ES)].filter((_,i)=>tentativiDi(b.id+"-"+(i+1)).length).length;
    const info = pronte ? `${pronte} esercitazioni · ${svolte} svolte` : "In arrivo nei prossimi aggiornamenti";
    return `<button class="block ${pronte?"":"soon"}" data-act="blocco" data-b="${b.id}">
      <span class="ico">${b.sigla}</span>
      <span class="t"><b>${b.nome}</b><span>${info}</span></span>
      <span class="chev">&#8250;</span></button>`;
  }).join("");
  $app.innerHTML = header("Preselettiva PuntoZero","Esercitazioni per blocco", null,
      `<button class="iconbtn" data-act="storico">Storico</button>`)+
    `<div class="card intro"><p>30 domande per esercitazione, 4 risposte, una sola corretta. Punteggio come nella prova: <b>+2,5</b> giusta, <b>−0,833</b> sbagliata, <b>−0,416</b> non data, riportato su base 100. Soglia: <b>60</b>.</p></div>
    ${DB.incorso?`<div class="card intro" style="border-color:var(--warn)"><p><b>Esercitazione in sospeso</b> (${esc(DB.incorso.es)}): ${DB.incorso.risp.filter(r=>r!==null).length} risposte date.</p>
      <div class="qnav" style="margin-top:10px"><button class="btn" data-act="m:scarta">Scarta</button><button class="btn primary" data-act="m:riprendi">Riprendi</button></div></div>`:""}
    <div class="blocks">${righe}</div>
    <footer>${esc(VERSIONE)} · i risultati restano solo su questo dispositivo</footer>`;
}

/* ---------- BLOCCO ---------- */
function viewBlocco(bid){
  const b = BLOCCHI.find(x=>x.id===bid);
  const righe=[...Array(N_ES)].map((_,i)=>{
    const n=i+1, code=bid+"-"+n, pronta=!!domande(bid,n), t=tentativiDi(code), best=migliore(code);
    let dx = pronta ? (best===null?`<span class="tag">da fare</span>`
      : `<div class="best num" style="color:var(${best>=SOGLIA?"--ok":"--bad"})">${fmt1(best)}<small>migliore · ${t.length} tent.</small></div>`)
      : `<span class="tag">in arrivo</span>`;
    return `<button class="card ex" ${pronta?`data-act="pre" data-code="${code}"`:"disabled"}>
      <span class="n">${n}</span><span class="t"><b>Esercitazione ${n}</b><span class="small muted">30 domande</span></span>${dx}</button>`;
  }).join("");
  $app.innerHTML = header(b.nome,"Scegli l'esercitazione","home")+`<div class="exlist">${righe}</div>`;
}

/* ---------- PRIMA DI INIZIARE ---------- */
function viewPre(code){
  const [bid,n]=code.split("-"); const b=BLOCCHI.find(x=>x.id===bid);
  const q=domande(bid,+n); const sec=q.length*SEC_PER_DOMANDA;
  $app.innerHTML = header(`${b.nome} · Es. ${n}`,"Prima di iniziare",`blocco:${bid}`)+
   `<div class="card rules"><h2>Regole</h2><ul>
     <li>${q.length} domande in ordine casuale; anche le risposte vengono rimescolate a ogni tentativo.</li>
     <li>Puoi spostarti tra le domande e cambiare risposta fino alla consegna.</li>
     <li>Risposta giusta +2,5 · sbagliata −0,833 · non data −0,416.</li>
     <li><b>Non lasciare risposte in bianco:</b> tirare a indovinare vale in media 0 punti, lasciare in bianco costa sempre −0,416.</li>
     <li>La correzione compare solo alla fine, come nella prova.</li></ul></div>
   <label class="card switch"><span><b>Cronometro</b><br><span class="small muted">${mmss(sec)} (stesso ritmo della prova: 50 minuti per 40 domande)</span></span>
     <input type="checkbox" id="chkTimer" ${DB.timer?"checked":""}></label>
   <button class="btn primary block" data-act="start" data-code="${code}">Inizia</button>`;
}

/* ---------- QUIZ ---------- */
let Q = null;  /* stato dell'esercitazione in corso */
function startQuiz(code){
  const [bid,n]=code.split("-"); const src=domande(bid,+n);
  DB.timer = !!document.getElementById("chkTimer")?.checked;
  const ordine = shuffle(src.map((_,i)=>i));
  Q = { es:code, ordine, opz: ordine.map(()=>shuffle([0,1,2,3])), risp: ordine.map(()=>null),
        cur:0, timer:DB.timer, durata: src.length*SEC_PER_DOMANDA, inizio: Date.now(), trascorso:0 };
  DB.incorso=Q; saveDB(); viewQuiz();
}
function tempoTrascorso(){ return Q.trascorso + (Date.now()-Q.inizio)/1000; }
function viewQuiz(){
  const [bid,n]=Q.es.split("-"); const b=BLOCCHI.find(x=>x.id===bid); const src=domande(bid,+n);
  const i=Q.cur, qi=Q.ordine[i], d=src[qi];
  const fatte=Q.risp.filter(r=>r!==null).length;
  const opts=Q.opz[i].map((o,k)=>`<button class="opt ${Q.risp[i]===o?"sel":""}" data-act="scegli" data-o="${o}"><span class="l">${LETT[k]}</span><span>${esc(d[2+o])}</span></button>`).join("");
  const grid=Q.ordine.map((_,k)=>`<button class="${Q.risp[k]!==null?"done":""} ${k===i?"cur":""}" data-act="vai" data-i="${k}">${k+1}</button>`).join("");
  $app.innerHTML = header(`${b.nome} · Es. ${n}`,`${fatte} risposte su ${src.length}`,"esci")+
   `<div class="qbar"><div class="prog"><i style="width:${(i+1)/src.length*100}%"></i></div>
     ${Q.timer?`<span class="timer num" id="tmr">--:--</span>`:""}</div>
   <div class="card qcard">
     <div class="qhead"><span>Domanda <b>${i+1}</b> di ${src.length}</span><span class="code">${esc(Q.es)}-${qi+1}</span></div>
     <p class="qtext">${esc(d[1])}</p>
     <div class="opts">${opts}</div>
     ${Q.risp[i]!==null?`<button class="clear" data-act="svuota">Togli la risposta</button>`:""}
   </div>
   <div class="qnav">
     <button class="btn" data-act="prev" ${i===0?"disabled":""}>&#8249; Precedente</button>
     <button class="btn primary" data-act="next" ${i===src.length-1?"disabled":""}>Successiva &#8250;</button>
   </div>
   <div class="grid">${grid}</div>
   <button class="btn block submit" data-act="consegna">Consegna</button>`;
  if(Q.timer) tick();
}
function tick(){
  stopTimer();
  const upd=()=>{
    const rest=Q.durata-tempoTrascorso(); const el=document.getElementById("tmr");
    if(el){ el.textContent=mmss(rest); el.classList.toggle("low", rest<=300); }
    if(rest<=0){ stopTimer(); consegna(true); }
  };
  upd(); timerId=setInterval(upd,1000);
}
function pausaQuiz(){ if(Q){ Q.trascorso=tempoTrascorso(); Q.inizio=Date.now(); DB.incorso=Q; saveDB(); } }

function consegna(scaduto){
  stopTimer();
  const [bid,n]=Q.es.split("-"); const src=domande(bid,+n);
  let c=0,e=0,o=0; const perLiv={1:[0,0],2:[0,0],3:[0,0]};
  const dettaglio=Q.ordine.map((qi,k)=>{
    const r=Q.risp[k], d=src[qi]; perLiv[d[0]][1]++;
    if(r===null){o++; return "o";} if(r===0){c++; perLiv[d[0]][0]++; return "c";} e++; return "e";
  });
  const grezzo=c*PUNTI.ok+e*PUNTI.err+o*PUNTI.om;
  const max=src.length*PUNTI.ok;
  const punteggio=grezzo/max*100;
  const tempo=Math.min(Q.durata, tempoTrascorso());
  const t={es:Q.es, data:Date.now(), punteggio:Math.round(punteggio*10)/10, c,e,o, tempo:Math.round(tempo), timer:Q.timer};
  DB.tentativi.push(t); DB.incorso=null; saveDB();
  const res={t, grezzo, max, perLiv, scaduto:!!scaduto, ordine:Q.ordine, opz:Q.opz, risp:Q.risp};
  Q=null; go(viewRisultato, res);
}

/* ---------- RISULTATO ---------- */
let R=null, filtro="errori";
function viewRisultato(res){
  if(res) R=res;
  const [bid,n]=R.t.es.split("-"); const b=BLOCCHI.find(x=>x.id===bid); const src=domande(bid,+n);
  const pass=R.t.punteggio>=SOGLIA;
  const liv=[1,2,3].filter(l=>R.perLiv[l][1]).map(l=>{
    const [ok,tot]=R.perLiv[l]; return `<div class="lvrow"><span>${LIVELLI[l]}</span><span class="bar"><i style="width:${ok/tot*100}%"></i></span><span class="num" style="text-align:right">${ok}/${tot}</span></div>`;
  }).join("");
  const voci=R.ordine.map((qi,k)=>{
    const d=src[qi], r=R.risp[k];
    const stato = r===null?"o":(r===0?"c":"e");
    if(filtro==="errori" && stato==="c") return "";
    const lettera = o => LETT[R.opz[k].indexOf(o)];
    const tua = r===null ? `<div class="ans om">Non hai risposto</div>`
      : `<div class="ans ${stato==="c"?"ok":"bad"}">La tua risposta: ${lettera(r)}) ${esc(d[2+r])}</div>`;
    const giusta = stato==="c" ? "" : `<div class="ans ok">Risposta corretta: ${lettera(0)}) ${esc(d[2])}</div>`;
    return `<div class="card rev"><div class="qhead"><span>Domanda ${k+1} · ${LIVELLI[d[0]]}</span><span class="code">${esc(R.t.es)}-${qi+1}</span></div>
      <p class="qt">${esc(d[1])}</p>${tua}${giusta}<p class="exp">${esc(d[6])}</p></div>`;
  }).join("") || `<p class="muted" style="text-align:center">Nessun errore: tutte corrette.</p>`;
  $app.innerHTML = header(`${b.nome} · Es. ${n}`,"Risultato",`blocco:${bid}`)+
   `<div class="card score ${pass?"pass":"fail"}">
     <div class="big num">${fmt1(R.t.punteggio)}<small> /100</small></div>
     <div class="verdict">${pass?"Soglia superata":"Sotto la soglia di 60"}${R.scaduto?" · tempo scaduto":""}</div>
     <div class="stats">
       <div class="stat"><b class="num" style="color:var(--ok)">${R.t.c}</b><span>corrette</span></div>
       <div class="stat"><b class="num" style="color:var(--bad)">${R.t.e}</b><span>errate</span></div>
       <div class="stat"><b class="num" style="color:var(--warn)">${R.t.o}</b><span>non date</span></div>
     </div>
     <div class="small muted">Punti ${fmt1(R.grezzo)} su ${fmt1(R.max)} · tempo ${mmss(R.t.tempo)}</div>
   </div>
   <div class="card lv"><h3>Risposte corrette per livello</h3>${liv}</div>
   <div class="qnav" style="margin:0 0 14px"><button class="btn" data-act="blocco" data-b="${bid}">Altre esercitazioni</button><button class="btn primary" data-act="pre" data-code="${R.t.es}">Rifai</button></div>
   <div class="filt"><button data-act="filtro" data-f="errori" aria-pressed="${filtro==="errori"}">Errori e non date</button><button data-act="filtro" data-f="tutte" aria-pressed="${filtro==="tutte"}">Tutte</button></div>
   ${voci}
   <p class="small muted" style="text-align:center">Se una domanda ti sembra sbagliata, annota il codice (es. ${esc(R.t.es)}-12) e segnalalo.</p>`;
}

/* ---------- STORICO ---------- */
function viewStorico(){
  const righe=DB.tentativi.slice().reverse().map(t=>{
    const [bid,n]=t.es.split("-"); const b=BLOCCHI.find(x=>x.id===bid);
    const d=new Date(t.data).toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"});
    return `<div class="hrow"><span><b>${b?b.nome:bid}</b> · Es. ${n}<br><span class="small muted">${d} · ${t.c} ok, ${t.e} err, ${t.o} vuote</span></span>
      <b class="num ${t.punteggio>=SOGLIA?"ok":"bad"}">${fmt1(t.punteggio)}</b></div>`;
  }).join("");
  $app.innerHTML = header("Storico","Tutti i tentativi","home")+
    (righe?`<div class="card hist">${righe}</div><button class="btn block" style="margin-top:16px" data-act="azzera">Cancella lo storico</button>`
          :`<p class="muted" style="text-align:center;margin-top:30px">Nessun tentativo registrato.</p>`);
}

/* ---------- modale ---------- */
function showModal(t,p,bottoni){
  $modal.innerHTML=`<div class="modal"><div class="box"><h3>${t}</h3><p>${p}</p>
    <div class="row">${bottoni.map((b,i)=>`<button class="btn ${i===bottoni.length-1?"primary":""}" data-act="m:${b[1]}">${b[0]}</button>`).join("")}</div></div></div>`;
}
function closeModal(){ $modal.innerHTML=""; }

/* ---------- eventi ---------- */
document.addEventListener("click", ev=>{
  const el=ev.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act;
  if(a==="home") return go(viewHome);
  if(a==="storico") return go(viewStorico);
  if(a==="blocco"){ const bid=el.dataset.b; const has=[...Array(N_ES)].some((_,i)=>domande(bid,i+1)); if(!has) return showModal("In arrivo","Le esercitazioni di questo blocco saranno aggiunte con i prossimi aggiornamenti.",[["Ok","chiudi"]]); return go(viewBlocco,bid); }
  if(a.startsWith("blocco:")) return go(viewBlocco,a.slice(7));
  if(a==="pre") return go(viewPre, el.dataset.code);
  if(a==="start"){ startQuiz(el.dataset.code); return; }
  if(Q){
    if(a==="scegli"){ Q.risp[Q.cur]=+el.dataset.o; pausaQuiz(); return viewQuiz(); }
    if(a==="svuota"){ Q.risp[Q.cur]=null; pausaQuiz(); return viewQuiz(); }
    if(a==="prev"&&Q.cur>0){ Q.cur--; pausaQuiz(); window.scrollTo(0,0); return viewQuiz(); }
    if(a==="next"&&Q.cur<Q.ordine.length-1){ Q.cur++; pausaQuiz(); window.scrollTo(0,0); return viewQuiz(); }
    if(a==="vai"){ Q.cur=+el.dataset.i; pausaQuiz(); window.scrollTo(0,0); return viewQuiz(); }
    if(a==="consegna"){ const v=Q.risp.filter(r=>r===null).length;
      return showModal("Consegnare?", v?`Hai ancora <b>${v}</b> domande senza risposta: ognuna costa −0,416. Conviene rispondere comunque.`:"Hai risposto a tutte le domande.",[["Torna alle domande","chiudi"],["Consegna","consegna"]]); }
    if(a==="esci"){ return showModal("Uscire?","L'esercitazione resta in sospeso: potrai riprenderla dalla schermata iniziale.",[["Continua","chiudi"],["Esci","esci"]]); }
  }
  if(a==="filtro"){ filtro=el.dataset.f; return viewRisultato(); }
  if(a==="azzera") return showModal("Cancellare lo storico?","Tutti i punteggi salvati su questo dispositivo verranno eliminati.",[["Annulla","chiudi"],["Cancella","azzera"]]);
  if(a.startsWith("m:")){
    const m=a.slice(2); closeModal();
    if(m==="consegna") return consegna(false);
    if(m==="esci"){ pausaQuiz(); Q=null; return go(viewHome); }
    if(m==="riprendi"){ Q=DB.incorso; Q.inizio=Date.now(); const [rb,rn]=Q.es.split("-"); if(!domande(rb,+rn)){DB.incorso=null;saveDB();Q=null;return go(viewHome);} return go(viewQuiz); }
    if(m==="scarta"){ DB.incorso=null; saveDB(); return go(viewHome); }
    if(m==="azzera"){ DB.tentativi=[]; saveDB(); return go(viewStorico); }
  }
});
document.addEventListener("change", ev=>{ if(ev.target.id==="chkTimer"){ DB.timer=ev.target.checked; saveDB(); } });
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) pausaQuiz(); });

if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("./sw.js").catch(()=>{}); }
viewHome();
</script>
</body>
</html>
