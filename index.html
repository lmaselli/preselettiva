<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Preselettiva PuntoZero</title>
<meta name="theme-color" content="#1D4E6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Preselettiva">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface2:#EBEFF3; --line:#D8DEE5;
  --ink:#16222C; --ink2:#4A5866; --ink3:#7A8794;
  --accent:#1D4E6B; --accent-ink:#FFFFFF; --accent-soft:#DCE8F0;
  --ok:#1E7A4C; --ok-soft:#DDF1E6; --bad:#B23A2E; --bad-soft:#F8E1DE; --warn:#9A6400; --warn-soft:#FBEFD6;
  --shadow:0 1px 2px rgba(16,30,45,.06),0 6px 16px -10px rgba(16,30,45,.25);
  --r:12px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F151A; --surface:#172028; --surface2:#1F2A33; --line:#2B3843;
    --ink:#E6EDF2; --ink2:#A9B6C1; --ink3:#7C8A96;
    --accent:#6FB3DB; --accent-ink:#0B1620; --accent-soft:#1B3242;
    --ok:#5CC48C; --ok-soft:#173326; --bad:#E57A6E; --bad-soft:#3A1F1C; --warn:#E0AE52; --warn-soft:#33291A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px -12px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 32px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:19px;margin:0;flex:1;line-height:1.2}
header.top .sub{display:block;font-size:12.5px;font-weight:500;color:var(--ink3)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:40px;height:40px;padding:0 12px;font-size:14px;font-weight:600}
.btn{text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 16px;font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.muted{color:var(--ink3)} .small{font-size:13px}
.hidden{display:none!important}

/* home */
.intro{padding:14px 16px;margin-bottom:14px}
.intro p{margin:0;font-size:14px;color:var(--ink2)}
.blocks{display:grid;gap:10px}
.block{display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.block .ico{width:44px;height:44px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.block .t{flex:1;min-width:0}
.block .t b{display:block;font-size:16px}
.block .t span{font-size:13px;color:var(--ink3)}
.block .chev{color:var(--ink3);font-size:20px}
.block.soon{opacity:.6}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:20px;background:var(--surface2);color:var(--ink3)}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.bad{background:var(--bad-soft);color:var(--bad)}

/* esercitazioni */
.exlist{display:grid;gap:10px}
.ex{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left}
.ex .n{width:38px;height:38px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-weight:800;flex:none}
.ex .t{flex:1}
.ex .t b{display:block}
.ex .best{text-align:right;font-weight:800;font-size:18px}
.ex .best small{display:block;font-size:11px;font-weight:600;color:var(--ink3)}

/* pre-start */
.rules{padding:16px;margin:4px 0 14px}
.rules h2{font-size:17px;margin:0 0 8px}
.rules ul{margin:0;padding-left:18px;color:var(--ink2);font-size:14.5px}
.rules li{margin-bottom:4px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;margin-bottom:14px}
.switch input{width:22px;height:22px;accent-color:var(--accent)}

/* quiz */
.qbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qbar .prog{flex:1;height:6px;background:var(--surface2);border-radius:4px;overflow:hidden}
.qbar .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.timer{font-weight:800;font-size:15px;padding:4px 10px;border-radius:8px;background:var(--surface2)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.qcard{padding:18px 16px}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--ink3)}
.qtext{overflow-wrap:anywhere;font-size:17.5px;font-weight:600;margin:0 0 16px;line-height:1.4}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:15.5px}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:800;font-size:13px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:var(--accent-ink)}
.qnav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.clear{margin-top:10px;background:none;border:0;color:var(--ink3);font-size:13.5px;text-decoration:underline;padding:6px 0}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:16px}
.grid button{aspect-ratio:1;border:1px solid var(--line);background:var(--surface);border-radius:7px;font-size:12px;font-weight:700;padding:0}
.grid button.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.grid button.cur{outline:2px solid var(--ink);outline-offset:1px}
.submit{margin-top:16px}

/* result */
.score{padding:22px 16px;text-align:center;margin-bottom:14px}
.score .big{font-size:52px;font-weight:800;line-height:1;letter-spacing:-.02em}
.score .big small{font-size:20px;color:var(--ink3);font-weight:700}
.score .verdict{margin-top:8px;font-weight:700}
.score.pass .big,.score.pass .verdict{color:var(--ok)}
.score.fail .big,.score.fail .verdict{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}
.stat{background:var(--surface2);border-radius:10px;padding:10px 6px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--ink3)}
.lv{padding:14px 16px;margin-bottom:14px}
.lv h3{margin:0 0 10px;font-size:15px}
.lvrow{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;font-size:13.5px;margin-bottom:8px}
.lvrow .bar{height:8px;background:var(--surface2);border-radius:5px;overflow:hidden}
.lvrow .bar i{display:block;height:100%;background:var(--accent)}
.filt{display:flex;gap:8px;margin:6px 0 12px}
.filt button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:8px;font-size:13.5px;font-weight:600}
.filt button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rev{padding:14px 16px;margin-bottom:10px}
.rev .qhead{margin-bottom:6px}
.rev .qt{overflow-wrap:anywhere;font-weight:600;margin:0 0 10px}
.rev .ans{font-size:14.5px;padding:8px 10px;border-radius:8px;margin-bottom:6px}
.rev .ans.ok{background:var(--ok-soft);color:var(--ok)}
.rev .ans.bad{background:var(--bad-soft);color:var(--bad)}
.rev .ans.om{background:var(--warn-soft);color:var(--warn)}
.rev .exp{font-size:14px;color:var(--ink2);margin:8px 0 0;padding-top:8px;border-top:1px dashed var(--line)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--surface2);padding:2px 7px;border-radius:6px;color:var(--ink2)}

/* storico */
.hist{padding:4px 0}
.hrow{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px}
.hrow:last-child{border-bottom:0}
.hrow b.ok{color:var(--ok)} .hrow b.bad{color:var(--bad)}

/* modale */
.modal{position:fixed;inset:0;background:rgba(10,20,30,.5);display:grid;place-items:center;padding:20px;z-index:20}
.modal .box{background:var(--surface);border-radius:14px;padding:20px;max-width:420px;width:100%;box-shadow:var(--shadow)}
.modal h3{margin:0 0 8px;font-size:18px}
.modal p{margin:0 0 16px;color:var(--ink2);font-size:14.5px}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
footer{text-align:center;font-size:12px;color:var(--ink3);margin-top:22px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modal"></div>

<script>
/* ============================================================
   BANCA DATI DOMANDE
   Formato di ogni domanda: [livello, testo, corretta, errata1, errata2, errata3, spiegazione]
   ============================================================ */
const BANCA = {"INF":{"1":[[1,"Quale componente del computer esegue le istruzioni dei programmi?","La CPU","La RAM","L'hard disk","L'alimentatore","La CPU (processore) elabora ed esegue le istruzioni; la RAM le contiene temporaneamente."],[1,"Quanti bit compongono un byte?","8","4","10","16","Per convenzione 1 byte = 8 bit."],[1,"Quale tra i seguenti è un dispositivo di input?","Lo scanner","Il monitor","La stampante","Le casse audio","Lo scanner acquisisce dati e li invia al computer: è un dispositivo di ingresso."],[1,"Che cosa caratterizza la memoria RAM?","È volatile: perde i dati allo spegnimento","Conserva i dati anche a computer spento","È una memoria di sola lettura","È il supporto su cui si installa il sistema operativo","La RAM è memoria di lavoro volatile; la ROM è di sola lettura; il sistema operativo si installa sul disco."],[1,"Quale programma del pacchetto Microsoft Office è un foglio di calcolo?","Excel","Word","PowerPoint","Outlook","Excel gestisce celle, formule e grafici; Word è un elaboratore di testi, PowerPoint serve per presentazioni, Outlook per la posta."],[1,"Un file con estensione .pdf è normalmente:","Un documento impaginato in formato portabile","Un file audio compresso","Un foglio di calcolo modificabile","Un programma eseguibile","PDF (Portable Document Format) conserva l'impaginazione indipendentemente dal dispositivo."],[1,"Che cosa si intende con «phishing»?","Un tentativo di ottenere dati riservati fingendosi un soggetto affidabile","Un programma che velocizza la connessione","La copia di sicurezza dei dati","Un tipo di cavo di rete","Il phishing usa email o siti falsi (banca, corriere, ente) per carpire password o dati di pagamento."],[1,"Che cosa indica la sigla URL?","L'indirizzo di una risorsa su Internet","Il nome del processore","Un tipo di memoria di massa","Un protocollo per la posta elettronica","URL (Uniform Resource Locator) è l'indirizzo che identifica una pagina o una risorsa in rete."],[1,"Quale combinazione di tasti, in Windows, copia l'elemento selezionato?","CTRL + C","CTRL + V","CTRL + X","CTRL + Z","CTRL+C copia, CTRL+V incolla, CTRL+X taglia, CTRL+Z annulla l'ultima operazione."],[1,"Che cos'è un sistema operativo?","Il software che gestisce le risorse hardware e permette di eseguire i programmi","Un programma per scrivere testi","Un componente fisico della scheda madre","Un antivirus preinstallato","Il sistema operativo (Windows, Linux, macOS, Android) fa da intermediario tra hardware, programmi e utente."],[1,"In un indirizzo email, che cosa separa il nome utente dal dominio?","Il simbolo @","Il punto","Il simbolo #","La barra /","Formato: nomeutente@dominio.it."],[1,"Quale dei seguenti è un browser?","Mozilla Firefox","Microsoft Access","Adobe Photoshop","WinZip","Firefox è un browser; Access è un database, Photoshop un programma di grafica, WinZip un compressore."],[1,"Che cos'è il «cloud storage»?","L'archiviazione di file su server remoti accessibili via Internet","Una memoria interna del processore","Un tipo di chiavetta USB","Un sistema di raffreddamento del computer","Con il cloud (es. Google Drive, OneDrive) i file risiedono su server remoti e sono raggiungibili da più dispositivi."],[1,"In Excel, con quale simbolo deve iniziare una formula?","=","#","$","&","Una formula in Excel inizia sempre con il segno di uguale."],[2,"In Excel le celle A1, A2 e A3 contengono 4, 6 e 8. Quale risultato restituisce =MEDIA(A1:A3)?","6","18","8","3","MEDIA somma i valori (18) e divide per il loro numero (3): 18/3 = 6."],[2,"Il numero binario 1010 a quale numero decimale corrisponde?","10","12","5","1010","1×8 + 0×4 + 1×2 + 0×1 = 10."],[2,"Un utente ha scritto un testo in Word e vuole conservare sia la versione originale sia una modificata. Quale comando deve usare prima di apportare le modifiche?","Salva con nome, dando un nome diverso al file","Salva","Chiudi senza salvare","Annulla","«Salva con nome» crea un nuovo file lasciando intatto l'originale; «Salva» sovrascriverebbe il file esistente."],[2,"Quale tra le seguenti password è la più robusta?","T7#qLm!2vR","password2024","12345678","MarioRossi","Una password robusta è lunga e mescola maiuscole, minuscole, numeri e simboli, senza parole o dati personali."],[2,"Un utente riceve un'email dalla «sua banca» che chiede di cliccare un link per confermare le credenziali entro 24 ore. Qual è il comportamento corretto?","Non cliccare e verificare contattando la banca con i canali ufficiali","Cliccare subito per evitare il blocco del conto","Rispondere all'email inserendo le credenziali","Inoltrare l'email a tutti i contatti per avvisarli","Urgenza e richiesta di credenziali sono segnali tipici del phishing: le banche non chiedono password via email."],[2,"Qual è la differenza principale tra «Taglia» e «Copia»?","Taglia rimuove l'elemento dalla posizione originale, Copia lo lascia dov'è","Copia rimuove l'elemento dalla posizione originale, Taglia lo lascia dov'è","Taglia funziona solo con le immagini","Non c'è alcuna differenza","In entrambi i casi l'elemento va negli Appunti; con Taglia viene rimosso dall'origine al momento di incollare."],[2,"Quale estensione ha normalmente un documento creato con le versioni recenti di Word?",".docx",".xlsx",".pptx",".txt",".docx è il formato di Word; .xlsx di Excel; .pptx di PowerPoint; .txt è testo semplice."],[2,"In Excel la cella B2 contiene 50. Quale risultato dà la formula =SE(B2>=60;\"Promosso\";\"Respinto\")?","Respinto","Promosso","50","Errore","50 non è maggiore o uguale a 60: la condizione è falsa e SE restituisce il terzo argomento."],[2,"Un file di 3 MB viene compresso in formato ZIP. Che cosa accade tipicamente?","Il file occupa meno spazio e va estratto prima dell'uso","Il file diventa un programma eseguibile","Il file viene cancellato dal disco","Il file viene protetto automaticamente da antivirus","La compressione riduce la dimensione; per usare il contenuto occorre decomprimerlo."],[2,"Quale indirizzo web indica che la connessione con il sito è cifrata?","https://www.esempio.it","http://www.esempio.it","ftp://www.esempio.it","www.esempio.it/sicuro","La «s» di HTTPS indica il protocollo sicuro con cifratura (TLS) tra browser e server."],[2,"Per inviare la stessa email a più destinatari senza che ciascuno veda gli indirizzi degli altri, quale campo si usa?","Ccn","Cc","A","Oggetto","Ccn (copia conoscenza nascosta) nasconde gli indirizzi agli altri destinatari; in Cc sono visibili a tutti."],[2,"Quanti valori diversi si possono rappresentare con 3 bit?","8","3","6","9","Con n bit si hanno 2^n combinazioni: 2^3 = 8."],[2,"Quale dispositivo, in una rete domestica, instrada i dati tra la rete locale e Internet?","Il router","La stampante","Il monitor","Il masterizzatore","Il router collega la rete di casa a Internet e smista i pacchetti tra i dispositivi."],[3,"Un'operatrice deve inviare a un utente un referto di 25 MB, ma la sua casella email accetta allegati fino a 10 MB. Qual è la soluzione più corretta?","Caricare il file su un servizio di condivisione autorizzato e inviare il link con accesso riservato","Rinominare il file cambiandone l'estensione","Inviare il file dividendolo a caso in tre email senza avvisare","Stampare il referto e fotografarlo con il cellulare personale","Il limite dipende dal server di posta; la condivisione tramite link riservato è la soluzione standard. Rinominare non riduce la dimensione, e usare il cellulare personale per dati sanitari viola le regole di riservatezza."],[3,"In Excel la cella C1 contiene =A1*B1 e viene copiata in C2. Quale formula conterrà C2?","=A2*B2","=A1*B1","=A1*B2","=A2*B1","I riferimenti relativi si adattano allo spostamento: scendendo di una riga, A1 diventa A2 e B1 diventa B2. Per bloccarli servirebbe il $ (riferimento assoluto)."],[3,"Un computer si è rallentato molto dopo l'installazione di un programma scaricato da un sito sconosciuto e compaiono finestre pubblicitarie. Qual è la prima azione più sensata?","Disconnettersi dalla rete ed eseguire una scansione antivirus completa","Installare altri programmi per velocizzare il PC","Aumentare la luminosità del monitor","Ignorare il problema finché il PC funziona","I sintomi indicano un probabile malware (adware): isolare la macchina e fare una scansione limita i danni e la diffusione."]],"2":[[1,"Che cosa significa la sigla SSD?","Solid State Drive, un'unità di memoria di massa senza parti meccaniche","Super Speed Display, un tipo di monitor","System Software Device, un driver di sistema","Secure Server Domain, un dominio protetto","L'SSD memorizza i dati su chip di memoria flash: è più veloce e resistente agli urti di un disco meccanico."],[1,"Su quale componente sono montati CPU, RAM e schede di espansione?","La scheda madre","L'alimentatore","Il case","Il dissipatore","La scheda madre (motherboard) collega tra loro tutti i componenti principali."],[1,"Un file con estensione .mp3 contiene normalmente:","Audio","Un'immagine","Un foglio di calcolo","Un video con sottotitoli","MP3 è un formato di compressione audio."],[1,"Che cos'è un software «open source»?","Un software il cui codice sorgente è pubblico e modificabile secondo la sua licenza","Un software che funziona solo online","Un software a pagamento con codice segreto","Un software che non richiede un sistema operativo","Open source significa codice sorgente accessibile; esempi: Linux, LibreOffice, Firefox."],[1,"Quale combinazione di tasti annulla l'ultima operazione nella maggior parte dei programmi Windows?","CTRL + Z","CTRL + Y","CTRL + A","CTRL + P","CTRL+Z annulla; CTRL+Y ripete; CTRL+A seleziona tutto; CTRL+P stampa."],[1,"Che cos'è un firewall?","Un sistema che controlla e filtra il traffico di rete in entrata e in uscita","Un programma per masterizzare dischi","Un dispositivo di raffreddamento della CPU","Un formato di file compresso","Il firewall blocca le connessioni non autorizzate secondo regole prestabilite."],[1,"Quale programma di Office serve a creare presentazioni con diapositive?","PowerPoint","Excel","Access","Word","PowerPoint crea presentazioni composte da diapositive (slide)."],[1,"Che cosa indica la sigla LAN?","Una rete locale, limitata a un edificio o a un'area ristretta","Una rete che copre un intero continente","Un tipo di stampante laser","Un linguaggio di programmazione","LAN = Local Area Network, rete locale (ufficio, casa, scuola)."],[1,"Che cosa fa la funzione SOMMA di Excel?","Addiziona i valori delle celle indicate","Conta le celle non vuote","Calcola il valore medio","Restituisce il valore più alto","SOMMA addiziona; CONTA.VALORI conta; MEDIA calcola la media; MAX il valore più alto."],[1,"Che cos'è il «desktop» in un sistema operativo grafico?","L'area di lavoro principale dello schermo con icone e finestre","Il disco su cui è installato il sistema","Il cestino dei file eliminati","La tastiera del computer","Il desktop è la schermata di base su cui compaiono icone, finestre e barra delle applicazioni."],[1,"Quale tra i seguenti è un motore di ricerca?","Google","Windows","Excel","Outlook","Google è un motore di ricerca; Windows è un sistema operativo, Excel un foglio di calcolo, Outlook un client di posta."],[1,"Che cosa si intende con «autenticazione a due fattori»?","Un accesso che richiede, oltre alla password, un secondo elemento come un codice inviato al telefono","L'uso di due password uguali","Un accesso consentito a due utenti contemporaneamente","Il cambio della password ogni due mesi","Il secondo fattore (codice SMS, app, impronta) protegge l'account anche se la password viene rubata."],[1,"Una porta USB serve principalmente a:","Collegare periferiche e dispositivi esterni al computer","Raffreddare il processore","Collegare il monitor all'alimentazione elettrica","Aumentare la memoria RAM","USB (Universal Serial Bus) collega chiavette, mouse, stampanti, telefoni e altre periferiche."],[1,"Che cos'è un «virus» informatico?","Un programma dannoso capace di replicarsi infettando altri file","Un guasto fisico del disco","Un errore di battitura in un documento","Un aggiornamento del sistema operativo","Il virus è un tipo di malware che si propaga copiandosi in altri file o programmi."],[2,"In Excel A1 = 10, A2 = 20, A3 vuota, A4 = 30. Quale valore restituisce =CONTA.NUMERI(A1:A4)?","3","4","60","20","CONTA.NUMERI conta solo le celle contenenti numeri: A3 è vuota, quindi il risultato è 3."],[2,"Il numero decimale 13 in binario si scrive:","1101","1011","1110","1001","13 = 8 + 4 + 1 → 1101."],[2,"Quale formato è più adatto per inviare un documento che il destinatario deve solo leggere e stampare, senza modificarlo facilmente?","PDF","DOCX","XLSX","TXT","Il PDF conserva l'impaginazione ed è pensato per la lettura; DOCX e XLSX sono formati modificabili."],[2,"Un utente cancella per errore un file dal desktop di Windows. Dove può recuperarlo, se non ha svuotato il cestino?","Nel Cestino","Nella cartella Download","Negli Appunti","Nel menu Stampa","I file eliminati dal disco locale finiscono nel Cestino e possono essere ripristinati finché non viene svuotato."],[2,"Perché è importante installare gli aggiornamenti del sistema operativo?","Perché correggono vulnerabilità di sicurezza ed errori","Perché aumentano la memoria RAM installata","Perché eliminano la necessità di un antivirus","Perché cancellano i file temporanei dell'utente","Gli aggiornamenti chiudono falle di sicurezza note, che altrimenti potrebbero essere sfruttate da malware."],[2,"In Word, quale funzione permette di trovare una parola e sostituirla automaticamente in tutto il documento?","Sostituisci","Controllo ortografia","Interruzione di pagina","Revisione","«Sostituisci» (CTRL+H in Word) cerca un testo e lo rimpiazza con un altro, anche in tutte le occorrenze."],[2,"Quale dispositivo è più adatto per conservare una copia di sicurezza (backup) dei dati lontano dal computer principale?","Un disco esterno conservato in un luogo diverso","Una seconda cartella sullo stesso disco","Il Cestino","La memoria RAM","Il backup deve stare su un supporto separato: una cartella sullo stesso disco si perde insieme al disco; la RAM è volatile."],[2,"Un'immagine digitale con risoluzione 1920×1080 è composta da:","Circa 2 milioni di pixel","Circa 3.000 pixel","Circa 200.000 pixel","Circa 20 milioni di pixel","1920 × 1080 = 2.073.600 pixel, cioè circa 2 milioni."],[2,"Quale tra questi è un esempio di software applicativo e non di sistema?","Un programma di videoscrittura","Il sistema operativo","Il driver della scheda video","Il BIOS/UEFI","Il software applicativo svolge compiti per l'utente (scrivere, calcolare); sistema operativo, driver e firmware sono software di sistema."],[2,"Nel Blocco note di Windows, che cosa accade premendo CTRL + S con un documento aperto?","Il documento viene salvato","Il documento viene stampato","Il testo selezionato viene sottolineato","Il documento viene chiuso","CTRL+S (Save) salva il file. Nelle versioni italiane di alcuni programmi (es. Word) le scorciatoie di formattazione sono localizzate e possono differire."],[2,"Un utente riceve da uno sconosciuto un'email inattesa con un allegato .exe. Qual è il rischio principale nell'aprire l'allegato?","Eseguire un programma potenzialmente dannoso","Perdere la formattazione dell'email","Esaurire lo spazio della casella","Nessun rischio, i file .exe sono sempre sicuri","I file .exe sono programmi eseguibili: aprirli significa avviarli, con il rischio di installare malware."],[2,"Quanti byte sono 3 kilobyte, adottando la convenzione binaria tradizionale (1 KB = 1024 byte)?","3072","3000","1024","3024","3 × 1024 = 3072 byte."],[2,"In una rete, che cosa identifica un indirizzo IP?","Un dispositivo connesso alla rete","Il nome dell'utente che usa il computer","La marca del router","La velocità della connessione","L'indirizzo IP identifica univocamente un dispositivo all'interno di una rete."],[3,"Un ufficio vuole che tre colleghi lavorino contemporaneamente sullo stesso foglio di calcolo, vedendo le modifiche degli altri. Quale soluzione è più adatta?","Un foglio condiviso in cloud con modifica simultanea","Inviare il file via email a ciascuno e poi unire le copie a mano","Salvare il file su tre chiavette USB diverse","Stampare il foglio e compilarlo a penna","La co-editing in cloud (es. Excel online, Fogli Google) permette modifiche simultanee su un'unica copia; le copie separate generano versioni contrastanti."],[3,"In Excel la cella D1 contiene =B1*$E$1 e viene copiata in D5. Quale formula conterrà D5?","=B5*$E$1","=B5*$E$5","=B1*$E$1","=B5*E5","B1 è relativo e diventa B5; $E$1 è assoluto (bloccato dai simboli $) e resta invariato."],[3,"Un utente nota che la sua casella email ha inviato messaggi pubblicitari ai suoi contatti senza che lui li abbia scritti. Quale azione è prioritaria?","Cambiare subito la password e attivare l'autenticazione a due fattori","Cancellare i messaggi inviati e non fare altro","Creare una nuova cartella per archiviare la posta","Disattivare le notifiche del telefono","È probabile che l'account sia stato violato: va messa in sicurezza cambiando la password e aggiungendo un secondo fattore."]],"3":[[1,"Un touchscreen è un dispositivo:","Sia di input sia di output","Solo di input","Solo di output","Di memorizzazione","Lo schermo tattile mostra le immagini (output) e riceve i tocchi dell'utente (input)."],[1,"In quale unità si esprime comunemente la frequenza di clock di un processore?","Gigahertz (GHz)","Gigabyte (GB)","Pollici","Megapixel","La frequenza indica quanti cicli al secondo esegue la CPU e si misura in hertz (oggi in GHz)."],[1,"Quale tra i seguenti è un sistema operativo per smartphone?","Android","Chrome","Word","Wi-Fi","Android (Google) è un sistema operativo mobile; Chrome è un browser."],[1,"Un file con estensione .xlsx è stato creato con:","Excel","Word","PowerPoint","Paint","L'estensione .xlsx identifica le cartelle di lavoro di Excel."],[1,"Che cos'è lo «spam»?","Posta elettronica indesiderata inviata in massa","Un programma per creare backup","La cartella dei documenti salvati","Un tipo di memoria rimovibile","Lo spam è la posta non richiesta, spesso pubblicitaria o fraudolenta."],[1,"In Esplora file o nel Blocco note di Windows, quale combinazione di tasti seleziona tutto il contenuto?","CTRL + A","CTRL + T","CTRL + E","CTRL + N","CTRL+A (All) seleziona tutto. Attenzione: alcuni programmi in versione italiana, come Word, adottano combinazioni localizzate diverse."],[1,"Che cos'è un «ransomware»?","Un malware che cifra i dati e chiede un riscatto per sbloccarli","Un programma gratuito per ascoltare musica","Un dispositivo per la connessione Wi-Fi","Un antivirus integrato in Windows","Il ransomware rende inaccessibili i file e chiede un pagamento: la difesa principale sono i backup regolari."],[1,"In Word, l'area che si ripete in cima a ogni pagina si chiama:","Intestazione","Piè di pagina","Margine sinistro","Barra di stato","L'intestazione compare in alto su ogni pagina; il piè di pagina in basso."],[1,"Quale estensione indica un file compresso?",".zip",".doc",".jpg",".html",".zip è un archivio compresso; .doc è un documento Word, .jpg un'immagine, .html una pagina web."],[1,"La dimensione di un monitor, indicata ad esempio come 24'', si misura:","Sulla diagonale dello schermo, in pollici","Sulla base dello schermo, in centimetri","Sull'altezza dello schermo, in pollici","Sul peso del monitor","La misura in pollici (1 pollice ≈ 2,54 cm) si riferisce alla diagonale."],[1,"Che cos'è un antivirus?","Un programma che individua e rimuove software dannoso","Un componente hardware del processore","Un tipo di connessione a Internet","Un formato di file protetto","L'antivirus analizza file e processi alla ricerca di malware conosciuto o sospetto."],[1,"Nell'indirizzo www.regione.umbria.it, che cosa indica «.it»?","Il dominio di primo livello nazionale dell'Italia","Il nome del computer dell'utente","Il protocollo di trasferimento","La cartella del sito","«.it» è il dominio di primo livello (TLD) assegnato all'Italia."],[1,"Che cosa fa la funzione MAX di Excel?","Restituisce il valore più alto in un intervallo","Somma tutti i valori","Arrotonda un numero","Conta le celle vuote","MAX restituisce il valore massimo; MIN il minimo."],[1,"Quale stampante utilizza il toner?","La stampante laser","La stampante a getto d'inchiostro","Il plotter a penna","La stampante ad aghi","La laser fissa il toner (polvere) sulla carta con calore; la getto d'inchiostro usa cartucce di inchiostro liquido."],[2,"In Excel A1 = 7, A2 = 3, A3 = 12, A4 = 5. Quale valore restituisce =MAX(A1:A4)-MIN(A1:A4)?","9","12","3","27","MAX = 12, MIN = 3: 12 − 3 = 9."],[2,"Il numero binario 11001 a quale numero decimale corrisponde?","25","19","21","11001","1×16 + 1×8 + 0×4 + 0×2 + 1×1 = 25."],[2,"Un collega riceve un'email indirizzata a lui e ad altri dieci colleghi. Vuole rispondere solo al mittente. Quale comando deve usare?","Rispondi","Rispondi a tutti","Inoltra","Sposta nel cestino","«Rispondi» invia la risposta solo al mittente; «Rispondi a tutti» include tutti i destinatari."],[2,"Che cosa sono i «cookie» di un sito web?","Piccoli file salvati dal browser che memorizzano informazioni sulla navigazione","Virus che si attivano visitando un sito","Immagini pubblicitarie inserite nelle pagine","Programmi che velocizzano la connessione","I cookie conservano preferenze, sessioni di accesso o dati di tracciamento; per questo la legge richiede il consenso per quelli non tecnici."],[2,"Per mettere in ordine alfabetico un elenco di cognomi in una colonna di Excel si usa la funzione:","Ordina","Filtro avanzato","Convalida dati","Unisci celle","«Ordina» dispone le righe in ordine crescente o decrescente; il filtro nasconde righe, non le ordina."],[2,"Quale combinazione di tasti, in Windows, chiude la finestra o il programma attivo?","ALT + F4","CTRL + F4 + TAB","SHIFT + CANC","ALT + TAB","ALT+F4 chiude la finestra attiva; ALT+TAB passa da una finestra all'altra; SHIFT+CANC elimina definitivamente un file."],[2,"Un'operatrice deve allontanarsi per pochi minuti dalla postazione con dati sensibili aperti. Qual è il comportamento corretto?","Bloccare la sessione (ad esempio con il tasto Windows + L)","Spegnere il monitor lasciando la sessione aperta","Chiedere a un utente allo sportello di sorvegliare lo schermo","Ridurre a icona le finestre","Il blocco della sessione richiede la password per riprendere il lavoro; spegnere il monitor non protegge l'accesso."],[2,"Quale formato di immagine supporta la trasparenza ed è comune per loghi e grafiche web?","PNG","MP4","DOCX","WAV","Il PNG gestisce il canale di trasparenza; MP4 è video, DOCX un documento, WAV un file audio."],[2,"Nella memoria di un computer, la memoria cache serve a:","Conservare dati usati di frequente per renderli più rapidamente disponibili alla CPU","Archiviare i file in modo permanente","Collegare il computer alla rete","Stampare più velocemente","La cache è una memoria piccola e molto veloce che riduce i tempi di accesso ai dati più richiesti."],[2,"In PowerPoint, l'effetto che si vede nel passaggio da una diapositiva alla successiva si chiama:","Transizione","Animazione personalizzata","Layout","Schema colori","La transizione riguarda il cambio di diapositiva; l'animazione riguarda i singoli oggetti all'interno della diapositiva."],[2,"Un file .csv contiene tipicamente:","Dati tabellari in testo semplice separati da un delimitatore","Un video compresso","Un programma eseguibile","Un'immagine vettoriale","CSV (Comma-Separated Values): righe di testo con valori separati da virgola o punto e virgola, apribili in Excel."],[2,"Un collegamento (scorciatoia) sul desktop a un documento viene eliminato. Che cosa accade al documento originale?","Resta intatto nella sua posizione originale","Viene eliminato anche lui","Viene spostato nel Cestino","Diventa di sola lettura","Il collegamento è solo un puntatore: cancellarlo non tocca il file a cui rimanda."],[2,"Quale tra questi dati è corretto?","1 GB corrisponde a circa mille MB","1 GB corrisponde a circa mille KB","1 MB corrisponde a circa mille GB","1 KB corrisponde a circa mille MB","La scala è KB < MB < GB < TB; ogni passaggio vale circa 1000 (o 1024 nella convenzione binaria)."],[3,"Un ufficio subisce un attacco ransomware che cifra tutti i file del server. Quale misura, adottata prima dell'attacco, avrebbe permesso il recupero più rapido senza pagare?","Backup regolari conservati offline o separati dalla rete","Un monitor più grande per ogni postazione","Una password più lunga per il Wi-Fi degli ospiti","L'installazione di un secondo browser","Se il backup è scollegato dalla rete il ransomware non può cifrarlo, e i dati si ripristinano senza pagare il riscatto."],[3,"In Excel, in B1 c'è =A1*2. Si inserisce una nuova riga sopra la riga 1. Che cosa accade alla formula, che ora si trova in B2?","Diventa =A2*2 e continua a riferirsi allo stesso dato","Resta =A1*2 e si riferisce alla nuova riga vuota","Restituisce sempre un errore","Viene cancellata","Quando si inseriscono righe, Excel aggiorna automaticamente i riferimenti perché puntino alle stesse celle, che si sono spostate in basso."],[3,"Un utente deve inviare via email a un collega un foglio Excel con dati personali di pazienti. Quale soluzione riduce di più il rischio in caso di invio al destinatario sbagliato?","Proteggere il file con una password comunicata al collega su un canale diverso","Scrivere «riservato» nell'oggetto dell'email","Inviare il file in formato .csv","Mettere il file in una cartella compressa senza password","La cifratura con password rende il file illeggibile a chi lo riceve per errore; comunicare la password su un altro canale evita che viaggi insieme al file."]],"4":[[1,"Che cos'è la PEC?","La posta elettronica certificata, che dà valore legale all'invio e alla ricezione dei messaggi","Un programma per creare presentazioni","Un tipo di chiavetta USB protetta","Un sistema per pagare online con carta di credito","La PEC attesta invio e consegna del messaggio con ricevute che hanno valore legale, come una raccomandata con ricevuta di ritorno."],[1,"Che cos'è lo SPID?","Il Sistema Pubblico di Identità Digitale per accedere ai servizi online della Pubblica Amministrazione","Un antivirus gratuito del Ministero","Un formato di file per documenti firmati","Un tipo di connessione in fibra ottica","Con lo SPID il cittadino accede con un'unica identità ai servizi online di PA e privati aderenti."],[1,"Che cos'è un «driver»?","Il software che permette al sistema operativo di comunicare con una periferica","Il cavo che collega la stampante","Un utente amministratore del computer","Un programma per navigare in Internet","Il driver traduce i comandi del sistema operativo in istruzioni comprensibili per un dispositivo (stampante, scheda video…)."],[1,"Un file con estensione .txt contiene:","Testo semplice, senza formattazione","Un'immagine ad alta risoluzione","Un foglio di calcolo con formule","Un file audio","Il .txt contiene solo caratteri, senza grassetti, tabelle o immagini."],[1,"Che cosa significa «scaricare» (download) un file?","Trasferirlo da Internet o da un server al proprio dispositivo","Trasferirlo dal proprio dispositivo a un server","Cancellarlo definitivamente","Comprimerlo per ridurne la dimensione","Download = dal server al proprio dispositivo; upload = dal proprio dispositivo al server."],[1,"Che cosa si intende per «freeware»?","Software distribuito gratuitamente","Software che si può usare solo senza connessione","Software a pagamento con abbonamento","Software privo di interfaccia grafica","Freeware significa uso gratuito, non necessariamente con codice sorgente aperto."],[1,"Quale componente elabora le immagini da visualizzare sul monitor?","La scheda video (GPU)","La scheda di rete","L'hard disk","La porta USB","La GPU (Graphics Processing Unit) calcola le immagini e le invia al monitor."],[1,"Che cos'è il Wi-Fi?","Una tecnologia per collegare i dispositivi a una rete senza fili","Un tipo di cavo di rete","Un programma di posta elettronica","Un sistema operativo per tablet","Il Wi-Fi collega dispositivi a una rete locale tramite onde radio."],[1,"In PowerPoint, quale tasto avvia la presentazione dalla prima diapositiva?","F5","F1","F12","ESC","F5 avvia la presentazione dall'inizio; ESC la interrompe; F1 apre la guida."],[1,"In Word, quale strumento crea un elenco con simboli all'inizio di ogni voce?","Elenco puntato","Interlinea","Allineamento giustificato","Colonne","L'elenco puntato antepone un simbolo a ogni paragrafo; l'elenco numerato un numero progressivo."],[1,"Che cos'è una «cartella» in un sistema operativo?","Un contenitore che raggruppa file e altre cartelle","Un file eseguibile","Un tipo di virus","Una periferica di archiviazione","Le cartelle organizzano i file in una struttura gerarchica ad albero."],[1,"Una webcam è un dispositivo:","Di input","Di output","Di memorizzazione permanente","Di alimentazione","La webcam acquisisce immagini e le invia al computer: è un dispositivo di ingresso."],[1,"Che cosa si intende per «malware»?","Qualsiasi software progettato per danneggiare o accedere senza autorizzazione a un sistema","Un programma di videoscrittura","Un aggiornamento ufficiale del sistema","Un componente hardware difettoso","Malware è il termine generale che comprende virus, worm, trojan, spyware, ransomware."],[1,"Un file con estensione .mp4 contiene normalmente:","Un video","Un documento di testo","Un database","Un foglio di calcolo","MP4 è un formato contenitore usato soprattutto per video."],[2,"In Excel, A1:A5 contengono 3, 8, 5, 10, 6. Quale valore restituisce =CONTA.SE(A1:A5;\">5\")?","3","4","24","2","I valori maggiori di 5 sono 8, 10 e 6: tre celle (il 5 non è maggiore di 5)."],[2,"Il numero decimale 20 in binario si scrive:","10100","10010","11000","10110","20 = 16 + 4 → 10100."],[2,"Il percorso C:\\Documenti\\Referti\\2026\\esame.pdf indica che il file esame.pdf si trova:","Nella cartella 2026, contenuta in Referti, contenuta in Documenti, sul disco C","Nella cartella Documenti, direttamente sul disco C","Nella cartella Referti, fuori dal disco C","Sul desktop, in una cartella chiamata C","Il percorso si legge da sinistra a destra, dalla radice del disco fino al file: ogni barra rovescia separa una cartella dalla successiva."],[2,"Qual è il vantaggio principale di un gestore di password (password manager)?","Permette di usare password diverse e complesse per ogni servizio senza doverle ricordare","Elimina la necessità di qualsiasi password","Rende il computer più veloce","Impedisce di ricevere spam","Il password manager conserva in modo cifrato password uniche per ogni account; l'utente ricorda solo la password principale."],[2,"Un utente carica 200 foto sul cloud: quale caratteristica della connessione conta di più?","La velocità di upload","La velocità di download","La risoluzione del monitor","La capienza della RAM","Caricare file verso un server dipende dalla banda in uscita (upload), di solito più bassa di quella in download."],[2,"Un documento Word ha 30 pagine e l'utente vuole che i numeri di pagina compaiano automaticamente in basso. Quale strumento usa?","Numero di pagina nel piè di pagina","Scrivere a mano il numero su ogni pagina","Interruzione di sezione","Controllo ortografia","Inserendo il numero di pagina nel piè di pagina, Word lo aggiorna automaticamente su tutte le pagine."],[2,"Quale tra questi è un esempio di «ingegneria sociale»?","Una telefonata di un finto tecnico che chiede la password per «risolvere un problema»","Un aggiornamento automatico dell'antivirus","Un backup programmato di notte","La deframmentazione del disco","L'ingegneria sociale manipola le persone, non i sistemi, per ottenere informazioni riservate."],[2,"In Excel si scrive in A1 il numero 3,456 e in B1 la formula =ARROTONDA(A1;1). Quale risultato si ottiene?","3,5","3,4","3,46","3","ARROTONDA con 1 cifra decimale: 3,456 → 3,5 (la seconda cifra decimale, 5, fa arrotondare per eccesso)."],[2,"Quale differenza c'è tra un hard disk tradizionale (HDD) e un SSD a parità di prezzo?","L'HDD offre di solito più capacità, l'SSD più velocità","L'HDD è più veloce, l'SSD offre più capacità","Non esiste alcuna differenza","L'SSD funziona solo con i computer portatili","A parità di costo l'HDD meccanico dà più spazio, l'SSD tempi di accesso molto inferiori e maggiore resistenza agli urti."],[2,"Che cosa si ottiene con la «stampa unione» di Word?","Più lettere personalizzate a partire da un modello e da un elenco di dati","La stampa fronte-retro di un documento","L'unione di due documenti in un unico file","La stampa di tutte le pagine su un solo foglio","La stampa unione combina un documento modello con un elenco (es. nomi e indirizzi), generando una copia personalizzata per ogni riga."],[2,"Perché è sconsigliato collegarsi al conto online da una rete Wi-Fi pubblica e aperta?","Perché altri utenti della rete potrebbero intercettare il traffico","Perché le reti pubbliche sono sempre più lente","Perché la banca blocca automaticamente il conto","Perché il telefono si scarica più in fretta","Su reti aperte e non protette il traffico può essere intercettato; per operazioni sensibili meglio la rete mobile o una connessione protetta."],[2,"Un file occupa 2 GB e una chiavetta USB ha 1,5 GB liberi. Che cosa si può affermare?","Il file non può essere copiato sulla chiavetta così com'è","Il file può essere copiato perché la chiavetta è USB","Il file verrà compresso automaticamente","Il file verrà copiato ma senza estensione","Lo spazio libero (1,5 GB) è inferiore alla dimensione del file (2 GB)."],[2,"Quale azione aiuta a riconoscere un sito web falso che imita quello di una banca?","Controllare con attenzione l'indirizzo nella barra del browser","Verificare che il sito abbia molte immagini","Controllare che la pagina si carichi velocemente","Verificare che il sito abbia il logo della banca","I siti di phishing copiano grafica e logo, ma l'indirizzo è diverso da quello ufficiale (anche per una sola lettera)."],[3,"Uno sportello deve registrare ogni giorno gli incassi di 5 operatori e ottenere automaticamente il totale mensile per operatore. Quale strumento è più adatto?","Un foglio di calcolo con una riga per incasso e formule di somma per operatore","Un documento Word con una tabella da sommare a mano","Una presentazione PowerPoint aggiornata ogni giorno","Un file di testo con gli importi scritti in sequenza","Il foglio di calcolo ricalcola i totali automaticamente (es. con SOMMA.SE per operatore) e riduce gli errori manuali."],[3,"Un'operatrice ha scritto un documento importante sul PC dell'ufficio. Il disco si guasta. In quale situazione avrebbe perso meno lavoro?","Se avesse avuto il salvataggio automatico su una cartella di rete o cloud","Se avesse salvato il file in due cartelle dello stesso disco","Se avesse stampato solo la prima pagina","Se avesse chiuso Word senza salvare","Due copie sullo stesso disco si perdono insieme; la copia su un sistema diverso (rete o cloud) sopravvive al guasto."],[3,"In Excel A1 = 10 e B1 = 0. Quale formula evita che compaia un messaggio di errore quando si calcola A1/B1?","=SE(B1=0;\"\";A1/B1)","=A1/B1","=SOMMA(A1/B1)","=MEDIA(A1;B1)","La divisione per zero genera l'errore #DIV/0!; con SE si controlla prima che B1 sia diverso da zero. SOMMA(A1/B1) restituirebbe comunque l'errore."]],"5":[[1,"Che cosa indica, in Excel, il riferimento B3?","La cella all'incrocio tra la colonna B e la riga 3","La terza cella della riga B","Il terzo foglio della cartella di lavoro","La colonna B moltiplicata per 3","In Excel le colonne sono indicate da lettere e le righe da numeri: B3 = colonna B, riga 3."],[1,"Che cos'è la memoria ROM?","Una memoria di sola lettura che conserva i dati anche senza alimentazione","Una memoria volatile di lavoro","Un disco esterno rimovibile","La memoria della scheda video","ROM = Read Only Memory: contiene istruzioni permanenti, ad esempio il firmware di avvio."],[1,"Quale linguaggio si usa per descrivere la struttura delle pagine web?","HTML","SQL","ZIP","USB","HTML (HyperText Markup Language) definisce titoli, paragrafi, link e immagini di una pagina web."],[1,"Che cos'è un «trojan» (cavallo di Troia)?","Un malware nascosto dentro un programma apparentemente innocuo","Un antivirus per smartphone","Un dispositivo di rete senza fili","Un tipo di backup automatico","Il trojan si presenta come software utile ma, una volta installato, esegue azioni dannose."],[1,"Quale tasto, in Windows, cattura un'immagine dello schermo?","Stamp (Print Screen)","Canc","Ins","Bloc Num","Il tasto Stamp copia negli Appunti l'immagine dello schermo, che si può poi incollare."],[1,"Quale tipo di grafico di Excel è più adatto a mostrare come un totale si suddivide in parti percentuali?","Il grafico a torta","Il grafico a linee","Il grafico a dispersione","Il grafico azionario","Il grafico a torta rappresenta le parti di un intero; quello a linee è adatto agli andamenti nel tempo."],[1,"Che cos'è LibreOffice?","Una suite per l'ufficio gratuita e open source","Un sistema operativo per server","Un browser per dispositivi mobili","Un antivirus a pagamento","LibreOffice comprende Writer (testi), Calc (fogli di calcolo) e Impress (presentazioni)."],[1,"Che cos'è un «link» (collegamento ipertestuale)?","Un elemento che, cliccato, porta a un'altra pagina o risorsa","Un cavo di rete","Un tipo di file compresso","Una cartella del disco","Il link collega un testo o un'immagine a un'altra pagina, a un documento o a un indirizzo email."],[1,"Che cosa conserva la «cronologia» di un browser?","L'elenco dei siti visitati","Le password della posta elettronica","I file di sistema del computer","L'elenco dei programmi installati","La cronologia registra le pagine visitate e può essere cancellata dall'utente."],[1,"Un terabyte (TB) è:","Maggiore di un gigabyte","Minore di un megabyte","Uguale a un gigabyte","Minore di un kilobyte","Ordine crescente: KB < MB < GB < TB."],[1,"Una stampante multifunzione, oltre a stampare, di solito può:","Scansionare e fotocopiare","Elaborare i programmi al posto della CPU","Aumentare la memoria del computer","Collegare il computer alla rete elettrica","La multifunzione unisce stampante, scanner e fotocopiatrice (talvolta anche fax)."],[1,"In Word, l'allineamento che distribuisce il testo in modo uniforme tra i margini sinistro e destro si chiama:","Giustificato","Centrato","A sinistra","Rientro sporgente","Il testo giustificato è allineato su entrambi i margini."],[1,"Che cos'è Linux?","Un sistema operativo","Un programma di videoscrittura","Un tipo di processore","Un formato audio","Linux è un sistema operativo open source; Ubuntu e Fedora sono sue distribuzioni."],[1,"Che cos'è un «allegato» in un'email?","Un file inviato insieme al messaggio","Il campo con l'indirizzo del destinatario","La firma automatica in fondo al messaggio","Un messaggio di risposta automatica","L'allegato è un file (documento, immagine, PDF) unito al messaggio di posta."],[2,"Il numero binario 1111 a quale numero decimale corrisponde?","15","16","4","1111","8 + 4 + 2 + 1 = 15."],[2,"In Excel A1 = 4, A2 = 6, A3 = 10. Quale risultato restituisce =SOMMA(A1:A3)/A1?","5","20","2,5","4","SOMMA = 20; 20 diviso A1 (4) = 5."],[2,"Il programma di un computer si è bloccato e non risponde ai comandi. Quale combinazione di tasti permette di aprire la schermata da cui avviare Gestione attività?","CTRL + ALT + CANC","CTRL + SHIFT + A","ALT + F1","FN + ESC","CTRL+ALT+CANC apre una schermata di sistema da cui si può avviare Gestione attività e chiudere il programma bloccato."],[2,"Che cosa garantisce la navigazione «in incognito» (o privata) del browser?","Che cronologia e cookie della sessione non vengano salvati sul dispositivo","Che il sito visitato non possa sapere chi si collega","Che la connessione sia protetta da qualsiasi virus","Che il datore di lavoro non possa vedere il traffico di rete","La modalità privata non salva dati sul dispositivo, ma non rende anonimi: sito, gestore di rete e datore di lavoro possono vedere il traffico."],[2,"In un foglio Excel con 500 righe di prenotazioni, si vogliono vedere solo quelle di un certo reparto senza cancellare le altre. Quale strumento si usa?","Filtro","Ordina","Elimina righe","Unisci e allinea al centro","Il filtro nasconde temporaneamente le righe che non soddisfano il criterio, senza cancellarle."],[2,"In Word, l'interlinea regola:","La distanza tra le righe di un paragrafo","La distanza tra le parole","La dimensione dei caratteri","La larghezza dei margini","L'interlinea (singola, 1,5, doppia…) stabilisce lo spazio verticale tra le righe."],[2,"Un utente apre un sito e il browser segnala «La connessione non è privata / certificato non valido». Qual è la scelta più prudente?","Non inserire dati personali e abbandonare il sito","Inserire comunque le credenziali","Disattivare l'antivirus per accedere","Salvare la pagina tra i preferiti","L'avviso indica che l'identità del sito non è verificabile o la cifratura non è affidabile: il rischio è che qualcuno intercetti i dati."],[2,"Che cos'è un server?","Un computer che fornisce servizi o risorse ad altri computer della rete","Un computer usato solo per i videogiochi","Un cavo che collega due computer","Un programma che scrive testi","Il server offre servizi (posta, file, pagine web, database) ai computer client che lo interrogano."],[2,"In un'email, a cosa serve la firma automatica?","A inserire in automatico nome, ruolo e recapiti in fondo ai messaggi","A garantire il valore legale del messaggio","A cifrare il contenuto dell'email","A bloccare lo spam","La firma automatica è solo un testo predefinito; non va confusa con la firma digitale, che ha valore legale."],[2,"Quante combinazioni diverse si ottengono con 1 byte?","256","8","128","1024","1 byte = 8 bit → 2^8 = 256 combinazioni (valori da 0 a 255)."],[2,"Quale tra questi comportamenti rispetta le buone pratiche di sicurezza in ufficio?","Non annotare la password su un foglio attaccato al monitor","Usare la stessa password per tutti i servizi","Comunicare la propria password ai colleghi per comodità","Disattivare gli aggiornamenti per non perdere tempo","Le credenziali sono personali e vanno custodite; riusarle o condividerle moltiplica i rischi."],[2,"Un grafico a linee in Excel è particolarmente adatto a rappresentare:","L'andamento delle prenotazioni mese per mese","La percentuale di uomini e donne tra gli utenti","L'elenco alfabetico dei medici","Il testo di un regolamento","Il grafico a linee mostra l'evoluzione di un valore nel tempo."],[2,"Un file PDF viene inviato con un nome come «Fattura_scaduta.pdf.exe». Che cosa si deve sospettare?","Che sia un programma eseguibile camuffato da documento","Che sia un PDF con doppia protezione","Che sia un PDF compresso","Che sia un'immagine scansionata","Conta l'ultima estensione: .exe. La doppia estensione è un trucco classico per far aprire un malware."],[3,"Un operatore riceve dal responsabile, via chat interna, il messaggio: «Sono in riunione, comprami subito 5 carte regalo e mandami i codici». Il tono è insolito. Qual è la reazione corretta?","Verificare la richiesta con il responsabile tramite un altro canale prima di agire","Eseguire subito per non contrariare il responsabile","Inoltrare i codici a un collega perché li invii lui","Ignorare definitivamente ogni messaggio del responsabile","È uno schema tipico di truffa (account compromesso o falso): urgenza, richiesta insolita, pagamenti non tracciabili. Si verifica sempre su un canale indipendente."],[3,"In Excel si vuole calcolare in C2:C100 il prezzo con IVA al 22% dei valori di B2:B100, con l'aliquota scritta una sola volta in E1. Quale formula va scritta in C2 per poterla copiare in basso?","=B2*(1+$E$1)","=B2*(1+E1)","=$B$2*(1+$E$1)","=B2+22","Il prezzo deve cambiare riga per riga (B2 relativo), l'aliquota deve restare fissa ($E$1 assoluto). Con E1 relativo, copiando, il riferimento scivolerebbe su celle vuote."],[3,"In un ufficio i documenti condivisi vengono salvati sul PC di un solo collega e gli altri li ricevono via chiavetta. Qual è il problema principale di questa organizzazione?","Rischio di versioni diverse dello stesso file e perdita dei dati se quel PC si guasta","Il consumo eccessivo di carta","La lentezza del monitor","L'impossibilità di stampare","Senza un archivio condiviso unico e con backup, le copie circolano disallineate e un solo guasto può far perdere tutto."]]},"LV":{"1":[[1,"Individuare il sinonimo di «arguto».","Perspicace","Ottuso","Lento","Pigro","Arguto = acuto, perspicace, che coglie con prontezza. Ottuso è il contrario."],[1,"Individuare il contrario di «effimero».","Duraturo","Breve","Fragile","Passeggero","Effimero = di breve durata; il contrario è duraturo. Breve e passeggero sono sinonimi."],[1,"Che cosa significa «procrastinare»?","Rinviare","Anticipare","Eseguire con cura","Dimenticare","Procrastinare = rimandare di giorno in giorno."],[2,"Individuare il sinonimo di «reticente».","Restio a parlare","Loquace","Sincero","Irascibile","Reticente = chi tace volutamente qualcosa; loquace è il contrario."],[2,"Individuare il contrario di «prodigo».","Avaro","Generoso","Ricco","Spendaccione","Prodigo = che spende o dona senza misura; il contrario è avaro. Generoso e spendaccione sono affini."],[2,"Individuare il termine da scartare.","Quercia","Rosa","Tulipano","Garofano","Rosa, tulipano e garofano sono fiori; la quercia è un albero."],[2,"Individuare il termine da scartare.","Garda","Po","Tevere","Arno","Po, Tevere e Arno sono fiumi; il Garda è un lago."],[2,"Individuare il termine da scartare.","Cubo","Triangolo","Quadrato","Pentagono","Triangolo, quadrato e pentagono sono figure piane; il cubo è un solido."],[2,"Completare la proporzione: medico : ospedale = insegnante : ?","Scuola","Alunno","Lezione","Cattedra","Relazione professionista – luogo di lavoro: il medico lavora in ospedale, l'insegnante a scuola."],[2,"Completare la proporzione: pagina : libro = mattone : ?","Muro","Cazzuola","Argilla","Muratore","Relazione parte – tutto: la pagina è parte del libro, il mattone è parte del muro. L'argilla è il materiale del mattone (relazione diversa)."],[2,"Completare la proporzione: freddo : caldo = buio : ?","Luce","Notte","Ombra","Sera","Relazione tra contrari: il contrario di buio è luce."],[2,"Quale binomio ha le stesse caratteristiche di PENNA – SCRIVERE?","Forbici – tagliare","Libro – biblioteca","Ago – sarta","Martello – chiodo","Strumento – azione che compie: la penna serve a scrivere, le forbici a tagliare. Martello – chiodo lega due oggetti, non uno strumento alla sua azione."],[2,"Individuare il contrario di «esplicito».","Implicito","Chiaro","Evidente","Espresso","Esplicito = dichiarato apertamente; il contrario è implicito, sottinteso."],[2,"Completare la frase: «Il testimone fu ______: rispose a ogni domanda senza tralasciare alcun dettaglio».","Esauriente","Reticente","Evasivo","Ambiguo","La seconda parte descrive risposte complete: esauriente. Reticente, evasivo e ambiguo esprimono il contrario."],[2,"Individuare il termine da scartare.","Raffaello","Leopardi","Manzoni","Carducci","Leopardi, Manzoni e Carducci sono scrittori e poeti; Raffaello è un pittore."],[2,"Quale binomio ha le stesse caratteristiche di GRANDE – ENORME?","Caldo – rovente","Alto – basso","Piccolo – grande","Bello – brutto","Il secondo termine è un grado più intenso del primo: enorme = molto grande, rovente = molto caldo. Le altre coppie sono di contrari."],[3,"Completare la frase con la coppia corretta: «Il relatore fu così ______ che nessuno riuscì a seguirlo; eppure il tema, in sé, era tutt'altro che ______».","Oscuro – complesso","Chiaro – semplice","Oscuro – banale","Brillante – complesso","«Eppure» introduce un contrasto: nessuno lo seguiva perché era oscuro, anche se il tema non era complesso. Con «banale» il contrasto sparisce; «chiaro» e «brillante» non spiegano perché nessuno lo seguisse."],[2,"Quale delle seguenti parole NON è un anagramma di ROMA?","Armi","Ramo","Mora","Orma","Ramo, mora e orma usano esattamente le lettere R, O, M, A; «armi» contiene una I al posto della O."],[2,"Individuare la parola che completa il brano: «Con il termine ______ si indica la disciplina che studia la popolazione umana nei suoi aspetti quantitativi: natalità, mortalità, migrazioni».","Demografia","Antropologia","Geografia","Sociologia","La demografia studia la popolazione in termini numerici; l'antropologia studia l'uomo e le culture."],[2,"Completare la proporzione: architetto : progetto = compositore : ?","Partitura","Orchestra","Pianoforte","Direttore","Relazione autore – opera che produce: l'architetto elabora un progetto, il compositore scrive una partitura."],[3,"Se X : Italia = Parigi : Y, allora:","X = Roma, Y = Francia","X = Milano, Y = Francia","X = Roma, Y = Lione","X = Italia, Y = Parigi","Relazione capitale – Stato: Roma sta all'Italia come Parigi sta alla Francia. Milano e Lione non sono capitali."],[3,"Se libro : X = Y : spettatore, allora:","X = lettore, Y = film","X = scrittore, Y = film","X = lettore, Y = regista","X = pagina, Y = cinema","Relazione opera – fruitore: il libro ha un lettore, il film ha uno spettatore. Scrittore e regista sono autori, non fruitori."],[3,"Se ago : X = Y : pittore, allora:","X = sarto, Y = pennello","X = filo, Y = pennello","X = sarto, Y = tela","X = cucire, Y = quadro","Relazione strumento – chi lo usa: l'ago è lo strumento del sarto, il pennello quello del pittore. La tela è il supporto, non lo strumento."],[3,"Se CASA = 2, TRENO = 3 e STRADA = 4, allora PORTONE = ?","4","3","5","7","Il numero corrisponde alle consonanti: C-S (2), T-R-N (3), S-T-R-D (4). PORTONE: P-R-T-N = 4. Non sono le vocali: TRENO ne ha 2, non 3."],[3,"Se LIBRO diventa ORBIL e PENNA diventa ANNEP, come diventa QUADERNO?","ONREDAUQ","ONREDUAQ","ONERDAUQ","QUADERON","La parola viene scritta al contrario: QUADERNO letto da destra a sinistra dà ONREDAUQ."],[3,"Se ALA = 2, NOTTE = 4 e BANANA = 3, allora STELLA = ?","5","6","4","3","Il numero indica le lettere diverse presenti: ALA {A, L}, NOTTE {N, O, T, E}, BANANA {B, A, N}. STELLA {S, T, E, L, A} = 5. Non sono le vocali (NOTTE ne ha 2) né la lunghezza (ALA ne ha 3)."],[3,"In un codice, CANE si scrive DBOF. Come si scrive GATTO?","HBUUP","HBTTP","FZSSN","HCUUP","Ogni lettera è sostituita dalla successiva nell'alfabeto: G→H, A→B, T→U, T→U, O→P."],[3,"Quale coppia ha la stessa relazione di SEME – ALBERO?","Uovo – pulcino","Foglia – ramo","Albero – bosco","Radice – terra","Dal primo termine si sviluppa il secondo: dal seme nasce l'albero, dall'uovo il pulcino. Le altre coppie esprimono relazioni parte-tutto, elemento-insieme o luogo."],[3,"Individuare la parola da scartare.","Orso","Radar","Anna","Otto","Radar, Anna e Otto sono palindromi (si leggono uguali nei due sensi); «orso» letto al contrario dà «osro»."],[3,"Quale elemento, anteposto a «-scopio», «-fono» e «-visione», forma tre parole di senso compiuto?","Tele","Micro","Radio","Video","Telescopio, telefono, televisione. «Micro» forma microscopio e microfono ma non «microvisione»."]],"2":[[1,"Individuare il sinonimo di «celere».","Rapido","Lento","Celebre","Cauto","Celere = veloce, rapido. Attenzione a «celebre» (famoso), che ha un suono simile ma un altro significato."],[1,"Individuare il contrario di «ostile».","Amichevole","Nemico","Avverso","Diffidente","Ostile = contrario, avverso; il contrario è amichevole. Nemico e avverso sono sinonimi."],[1,"Che cosa significa «inerme»?","Senza difese","Immobile","Inutile","Armato","Inerme = privo di armi o di difese. Non va confuso con «inerte» (immobile)."],[2,"Individuare il sinonimo di «ameno».","Piacevole","Aspro","Lontano","Isolato","Ameno = gradevole, piacevole (un luogo ameno)."],[2,"Individuare il contrario di «parsimonioso».","Sprecone","Economo","Attento","Modesto","Parsimonioso = che spende con misura; il contrario è sprecone. Economo è un sinonimo."],[2,"Individuare il termine da scartare.","Luna","Venere","Marte","Giove","Venere, Marte e Giove sono pianeti; la Luna è un satellite."],[2,"Individuare il termine da scartare.","Banca","Euro","Dollaro","Yen","Euro, dollaro e yen sono valute; la banca è un istituto di credito."],[2,"Completare la proporzione: pesce : branco = pecora : ?","Gregge","Pastore","Lana","Stalla","Relazione animale – gruppo: i pesci formano un branco, le pecore un gregge."],[2,"Completare la proporzione: sole : giorno = luna : ?","Notte","Stella","Pianeta","Cielo","Il sole caratterizza il giorno, la luna la notte."],[2,"Completare la proporzione: occhio : vedere = orecchio : ?","Udire","Suono","Parlare","Musica","Relazione organo – funzione: l'occhio serve a vedere, l'orecchio a udire. «Suono» è ciò che si ode, non la funzione."],[2,"Quale binomio ha le stesse caratteristiche di LUPO – BRANCO?","Ape – sciame","Cane – cuccia","Nave – porto","Albero – foglia","Animale – gruppo di cui fa parte: il lupo vive nel branco, l'ape nello sciame. Cane – cuccia e nave – porto indicano un luogo; albero – foglia il tutto e la parte."],[2,"Quale binomio ha le stesse caratteristiche di GIUDICE – SENTENZA?","Medico – diagnosi","Avvocato – tribunale","Studente – scuola","Pittore – pennello","Professionista – atto che formula: il giudice emette la sentenza, il medico formula la diagnosi. Le altre coppie indicano un luogo o uno strumento."],[2,"Completare la frase: «Dopo ore di discussione, le parti raggiunsero finalmente un ______ soddisfacente per entrambe».","Compromesso","Conflitto","Dissidio","Litigio","Un accordo «soddisfacente per entrambe» è un compromesso; le altre parole indicano un contrasto."],[2,"Individuare la parola che completa il brano: «La ______ è la forma di governo in cui il capo dello Stato è un sovrano che, di norma, ottiene la carica per via ereditaria».","Monarchia","Repubblica","Oligarchia","Anarchia","Nella monarchia il capo dello Stato è un re; nella repubblica è eletto; nell'oligarchia il potere è di pochi; l'anarchia è assenza di governo."],[2,"Individuare il contrario di «loquace».","Taciturno","Chiacchierone","Ciarliero","Estroverso","Loquace = che parla molto; il contrario è taciturno. Chiacchierone e ciarliero sono sinonimi."],[2,"Individuare il sinonimo di «esiguo».","Scarso","Abbondante","Enorme","Costoso","Esiguo = scarso, di piccola entità (un numero esiguo)."],[2,"Individuare il termine da scartare.","Pinguino","Aquila","Falco","Passero","Sono tutti uccelli, ma solo il pinguino non è in grado di volare."],[2,"Completare la proporzione: termometro : temperatura = bilancia : ?","Peso","Altezza","Piatto","Farmacia","Relazione strumento – grandezza misurata: il termometro misura la temperatura, la bilancia il peso."],[2,"Completare la proporzione: scrittore : romanzo = regista : ?","Film","Attore","Cinema","Platea","Relazione autore – opera: lo scrittore realizza il romanzo, il regista il film. Il cinema è il luogo, l'attore un collaboratore."],[3,"Individuare il termine da scartare.","Giugno","Gennaio","Marzo","Maggio","Gennaio, marzo e maggio hanno 31 giorni; giugno ne ha 30."],[3,"Se X : latte = ape : Y, allora:","X = mucca, Y = miele","X = formaggio, Y = miele","X = mucca, Y = fiore","X = pecora, Y = alveare","Relazione animale – prodotto: la mucca produce il latte, l'ape il miele. L'alveare è la casa dell'ape, non il suo prodotto."],[3,"Se X : scultore = pennello : Y, allora:","X = scalpello, Y = pittore","X = marmo, Y = pittore","X = scalpello, Y = tela","X = statua, Y = quadro","Relazione strumento – chi lo usa: lo scalpello è lo strumento dello scultore, il pennello quello del pittore. Il marmo è il materiale, non lo strumento."],[3,"Se PANE = 2, AEREO = 4 e STRADA = 2, allora AIUOLA = ?","5","4","6","3","Il numero corrisponde alle vocali: PANE (A, E) = 2, AEREO (A, E, E, O) = 4, STRADA (A, A) = 2. AIUOLA: A, I, U, O, A = 5. Non sono le vocali diverse: AEREO ne ha 3."],[3,"In un codice PORTA si scrive QPSUB. Come si scrive MELA?","NFMB","NFLB","LDKZ","NEMB","Ogni lettera è sostituita dalla successiva: M→N, E→F, L→M, A→B."],[3,"Se LAGO diventa AGOL e MONTE diventa ONTEM, come diventa COLLINA?","OLLINAC","ANILLOC","OLLINCA","CLLINAO","La prima lettera viene spostata in fondo alla parola: C-OLLINA → OLLINA-C."],[3,"Quale coppia ha la stessa relazione di FARINA – PANE?","Uva – vino","Pane – forno","Vino – bottiglia","Grano – campo","Materia prima – prodotto che se ne ricava: dalla farina si fa il pane, dall'uva il vino. Le altre coppie indicano un luogo o un contenitore."],[3,"L'ombrello sta alla pioggia come il cappotto sta al:","Freddo","Bottone","Armadio","Sarto","Relazione oggetto – ciò da cui protegge: l'ombrello ripara dalla pioggia, il cappotto dal freddo."],[3,"Individuare la parola da scartare.","Nuca","Cena","Acne","Cane","Cena, acne e cane sono anagrammi tra loro (lettere C, A, N, E); «nuca» contiene una U al posto della E."],[3,"Completare la frase con la coppia corretta: «Lo studio non ha fornito prove ______ dell'efficacia del farmaco: i risultati sono ancora ______».","Conclusive – provvisori","Definitive – certi","Decisive – consolidati","Insufficienti – parziali","Mancano prove definitive, quindi i risultati sono provvisori. «Certi» e «consolidati» contraddicono la prima parte; «non ha fornito prove insufficienti» non ha senso."],[3,"Quale coppia NON presenta la stessa relazione delle altre?","Milano – Adige","Roma – Tevere","Firenze – Arno","Torino – Po","Roma, Firenze e Torino sono attraversate dal fiume indicato; l'Adige non attraversa Milano (attraversa, ad esempio, Trento e Verona)."]],"3":[[1,"Individuare il sinonimo di «futile».","Frivolo","Importante","Utile","Grave","Futile = di poco conto, frivolo, vano."],[1,"Individuare il contrario di «ottimista».","Pessimista","Fiducioso","Allegro","Sereno","L'ottimista vede il lato positivo delle cose; il pessimista quello negativo."],[1,"Che cosa significa «indigente»?","Povero","Indolente","Indeciso","Straniero","Indigente = privo dei mezzi necessari per vivere. «Indolente» (pigro) è un falso amico per il suono simile."],[2,"Individuare il sinonimo di «solerte».","Diligente","Svogliato","Solitario","Lento","Solerte = zelante, diligente, sollecito nel fare il proprio dovere."],[2,"Individuare il contrario di «avvenente».","Brutto","Attraente","Giovane","Elegante","Avvenente = di bell'aspetto; il contrario è brutto. Attraente è un sinonimo."],[2,"Individuare il termine da scartare.","Chiodo","Martello","Cacciavite","Pinza","Martello, cacciavite e pinza sono attrezzi; il chiodo è l'oggetto su cui si lavora."],[2,"Individuare il termine da scartare.","Calabria","Sicilia","Sardegna","Elba","Sicilia, Sardegna ed Elba sono isole; la Calabria è una regione peninsulare."],[2,"Completare la proporzione: chiave : serratura = password : ?","Account","Tastiera","Schermo","Mouse","Relazione mezzo di apertura – ciò che apre: la chiave apre la serratura, la password dà accesso all'account."],[2,"Completare la proporzione: vite : uva = ulivo : ?","Oliva","Olio","Albero","Foglia","Relazione pianta – frutto: la vite produce l'uva, l'ulivo l'oliva. L'olio si ricava dal frutto (come il vino dall'uva)."],[2,"Completare la proporzione: capitano : nave = pilota : ?","Aereo","Aeroporto","Volo","Hostess","Relazione chi comanda – mezzo comandato: il capitano guida la nave, il pilota l'aereo."],[2,"Quale binomio ha le stesse caratteristiche di ALBA – TRAMONTO?","Inizio – fine","Giorno – ora","Sera – notte","Luce – lampada","L'alba è l'inizio del giorno, il tramonto la sua fine: una coppia di opposti. Sera – notte sono momenti consecutivi, non opposti."],[2,"Quale binomio ha le stesse caratteristiche di COLTELLO – LAMA?","Sedia – schienale","Pane – forno","Penna – scrivere","Libro – lettore","Relazione tutto – parte: la lama è una parte del coltello, lo schienale una parte della sedia."],[2,"Completare la frase: «La relazione era così ______ che in poche righe riassumeva l'intero progetto».","Concisa","Prolissa","Confusa","Lunga","Riassumere tutto «in poche righe» richiede una relazione concisa; prolissa e lunga sono l'opposto."],[2,"Individuare la parola che completa il brano: «Si definisce ______ un trattamento che ha lo scopo di prevenire l'insorgenza di una malattia».","Profilattico","Terapeutico","Palliativo","Diagnostico","Profilattico = preventivo. Terapeutico cura una malattia già presente; palliativo ne allevia i sintomi; diagnostico serve a individuarla."],[2,"Individuare il contrario di «umile».","Superbo","Modesto","Semplice","Povero","Umile = modesto, senza presunzione; il contrario è superbo."],[2,"Individuare il sinonimo di «dissuadere».","Distogliere","Convincere","Persuadere","Incoraggiare","Dissuadere = convincere qualcuno a non fare qualcosa, distoglierlo. Persuadere è il contrario."],[2,"Completare la proporzione: anello : catena = gradino : ?","Scala","Salita","Piano","Casa","Relazione elemento – struttura formata da elementi uguali ripetuti: gli anelli formano la catena, i gradini la scala."],[2,"Individuare il termine da scartare.","Svizzera","Germania","Francia","Spagna","Germania, Francia e Spagna fanno parte dell'Unione Europea; la Svizzera no."],[2,"Individuare il termine da scartare.","Tulipano","Mela","Pera","Pesca","Mela, pera e pesca sono frutti; il tulipano è un fiore."],[3,"Individuare il termine da scartare.","Rame","Ottone","Bronzo","Acciaio","Ottone, bronzo e acciaio sono leghe metalliche; il rame è un elemento puro (e anzi entra nella composizione di ottone e bronzo)."],[3,"Se X : Spagna = Lisbona : Y, allora:","X = Madrid, Y = Portogallo","X = Barcellona, Y = Portogallo","X = Madrid, Y = Brasile","X = Siviglia, Y = Porto","Relazione capitale – Stato: Madrid è la capitale della Spagna, Lisbona del Portogallo."],[3,"Se pompiere : X = Y : malattia, allora:","X = incendio, Y = medico","X = idrante, Y = medico","X = incendio, Y = ospedale","X = acqua, Y = farmaco","Relazione professionista – problema che combatte: il pompiere combatte l'incendio, il medico la malattia. Idrante e farmaco sono strumenti, l'ospedale un luogo."],[3,"Se BANANA = 1, CIELO = 3 e TAVOLO = 2, allora AUTOMOBILE = ?","5","6","4","10","Il numero indica le vocali diverse presenti: BANANA {A}, CIELO {I, E, O}, TAVOLO {A, O}. AUTOMOBILE: {A, U, O, I, E} = 5. Non è il numero totale di vocali: BANANA ne ha 3."],[3,"In un codice SERA si scrive RDQZ. Come si scrive PORTO?","ONQSN","QPSUP","ONRSN","NMPRM","Ogni lettera è sostituita dalla precedente nell'alfabeto (e la A dalla Z): P→O, O→N, R→Q, T→S, O→N."],[3,"Se CASA diventa ACAS e MELO diventa EMOL, come diventa FIUME?","IFMUE","EMUIF","IFUME","FIMUE","Si scambiano di posto le lettere a coppie: FI→IF, UM→MU; la E, rimasta sola, resta in fondo: IFMUE."],[3,"Quale coppia ha la stessa relazione di LIBRO – BIBLIOTECA?","Quadro – pinacoteca","Pagina – libro","Scaffale – legno","Lettore – autore","Oggetto – luogo in cui oggetti di quel tipo sono raccolti e conservati: i libri in biblioteca, i quadri in pinacoteca. Pagina – libro è una relazione parte-tutto."],[3,"Qual è il contrario del contrario di «generoso»?","Generoso","Avaro","Tirchio","Egoista","Il contrario di generoso è avaro; il contrario di avaro è di nuovo generoso."],[3,"Individuare la parola da scartare.","Luna","Lame","Mela","Male","Lame, mela e male sono anagrammi tra loro (lettere L, A, M, E); «luna» no."],[3,"Completare la frase con la coppia corretta: «Pur essendo ______ di carattere, in quell'occasione si mostrò sorprendentemente ______».","Timido – audace","Timido – riservato","Coraggioso – intrepido","Audace – sfrontato","«Pur essendo» e «sorprendentemente» richiedono due qualità opposte: timido per natura, audace in quell'occasione. Le altre coppie sono di sinonimi o termini affini."],[3,"Quale coppia NON presenta la stessa relazione delle altre?","Petrarca – Gerusalemme liberata","Dante – Divina Commedia","Manzoni – I promessi sposi","Boccaccio – Decameron","Nelle altre coppie l'autore è abbinato alla sua opera; la Gerusalemme liberata è di Torquato Tasso, non di Petrarca."]],"4":[[1,"Individuare il sinonimo di «astuto».","Furbo","Ingenuo","Sincero","Onesto","Astuto = furbo, scaltro; ingenuo è il contrario."],[1,"Individuare il contrario di «pigro».","Attivo","Indolente","Svogliato","Stanco","Pigro = restio a fare fatica; il contrario è attivo. Indolente e svogliato sono sinonimi."],[1,"Chi è un «bibliofilo»?","Chi ama e colleziona i libri","Chi vende libri","Chi scrive libri","Chi non sopporta i libri","Biblio- = libro, -filo = che ama: il bibliofilo ama e colleziona libri. Chi li vende è il libraio."],[2,"Individuare il sinonimo di «intrepido».","Coraggioso","Pauroso","Prudente","Impaziente","Intrepido = che non ha paura, coraggioso."],[2,"Individuare il contrario di «superfluo».","Indispensabile","Eccessivo","Inutile","Abbondante","Superfluo = non necessario; il contrario è indispensabile."],[2,"Individuare il termine da scartare.","Lampadina","Sedia","Tavolo","Armadio","Sedia, tavolo e armadio sono mobili; la lampadina no."],[2,"Individuare il termine da scartare.","Perugia","Napoli","Bari","Palermo","Napoli, Bari e Palermo sono città sul mare; Perugia no."],[2,"Completare la proporzione: calciatore : calcio = ciclista : ?","Ciclismo","Bicicletta","Giro d'Italia","Strada","Relazione atleta – sport praticato: il calciatore pratica il calcio, il ciclista il ciclismo. La bicicletta è l'attrezzo."],[2,"Completare la proporzione: miele : dolce = limone : ?","Aspro","Giallo","Frutto","Succo","Relazione alimento – sapore caratteristico: il miele è dolce, il limone è aspro."],[2,"Completare la proporzione: vocabolario : parole = atlante : ?","Carte geografiche","Viaggi","Globo","Esploratori","Relazione raccolta – elementi raccolti: il vocabolario raccoglie parole, l'atlante carte geografiche."],[2,"Quale binomio ha le stesse caratteristiche di TENTARE – RIUSCIRE?","Cercare – trovare","Correre – camminare","Leggere – libro","Dormire – letto","Azione – esito positivo: si tenta e si riesce, si cerca e si trova."],[2,"Quale binomio ha le stesse caratteristiche di PECORA – LANA?","Baco – seta","Cane – osso","Gatto – topo","Cavallo – stalla","Animale – fibra che produce: la pecora fornisce la lana, il baco la seta."],[2,"Completare la frase: «Il medico ha ______ una terapia di due settimane».","Prescritto","Proscritto","Descritto","Iscritto","Prescrivere = ordinare una cura. «Proscritto» (esiliato, bandito) è un termine dal suono simile ma di significato diverso."],[2,"Come si chiama un periodo di mille anni?","Millennio","Secolo","Decennio","Lustro","Millennio = 1000 anni; secolo = 100; decennio = 10; lustro = 5."],[2,"Individuare il contrario di «consueto».","Insolito","Abituale","Solito","Frequente","Consueto = abituale; il contrario è insolito."],[2,"Individuare il sinonimo di «ostinato».","Testardo","Arrendevole","Docile","Distratto","Ostinato = testardo, caparbio; arrendevole e docile sono contrari."],[2,"Completare la proporzione: nave : porto = aereo : ?","Aeroporto","Pilota","Cielo","Ala","Relazione mezzo – luogo in cui arriva e sosta: la nave attracca al porto, l'aereo atterra all'aeroporto."],[2,"Individuare il termine da scartare.","Squalo","Balena","Delfino","Foca","Balena, delfino e foca sono mammiferi; lo squalo è un pesce."],[2,"Completare la proporzione: primavera : estate = autunno : ?","Inverno","Freddo","Primavera","Settembre","Relazione stagione – stagione successiva: dopo la primavera viene l'estate, dopo l'autunno l'inverno."],[3,"Se X : chirurgo = forbici : Y, allora:","X = bisturi, Y = parrucchiere","X = ospedale, Y = parrucchiere","X = bisturi, Y = capelli","X = paziente, Y = barba","Relazione strumento – professionista che lo usa: il bisturi è lo strumento del chirurgo, le forbici quello del parrucchiere."],[3,"Se orologio : X = Y : temperatura, allora:","X = tempo, Y = termometro","X = ora, Y = febbre","X = lancette, Y = termometro","X = tempo, Y = caldo","Relazione strumento – grandezza misurata: l'orologio misura il tempo, il termometro la temperatura. Le lancette sono una parte dell'orologio."],[3,"Se CASSA = 2, BELLEZZA = 3 e TORTA = 2, allora CAPPELLO = ?","3","5","4","2","Il numero indica le consonanti diverse: CASSA {C, S}, BELLEZZA {B, L, Z}, TORTA {T, R}. CAPPELLO {C, P, L} = 3. Non è il totale delle consonanti: CASSA ne ha 3. Contando le vocali si ottiene lo stesso risultato (CAPPELLO: A, E, O = 3)."],[3,"Se FIORE diventa EFIOR e PRATO diventa OPRAT, come diventa GIARDINO?","OGIARDIN","IARDINOG","ONIDRAIG","OGIRADIN","L'ultima lettera viene spostata all'inizio della parola: GIARDIN-O → O-GIARDIN."],[3,"Se A = 1, B = 2, C = 3 e così via secondo l'ordine alfabetico, qual è la somma dei valori delle lettere della parola FEDE?","20","18","22","24","F = 6, E = 5, D = 4, E = 5: 6 + 5 + 4 + 5 = 20."],[3,"Quale coppia ha la stessa relazione di PREFAZIONE – LIBRO?","Preludio – opera lirica","Capitolo – romanzo","Epilogo – racconto","Copertina – libreria","La prefazione è la parte introduttiva del libro, il preludio quella dell'opera lirica. Il capitolo è una parte qualsiasi, l'epilogo la parte finale."],[3,"Individuare il termine da scartare.","Pollice","Metro","Secondo","Chilogrammo","Metro, secondo e chilogrammo sono unità di misura fondamentali del Sistema Internazionale; il pollice è un'unità anglosassone che non ne fa parte."],[3,"Quale parola si può associare sia a «porta», sia a «cassaforte», sia a «musica»?","Chiave","Nota","Serratura","Combinazione","Si parla di chiave della porta, chiave della cassaforte e chiave musicale (ad esempio di violino). «Combinazione» vale per la cassaforte ma non per la musica."],[3,"Individuare la parola da scartare.","Cammino","Pappagallo","Cappello","Bellezza","Pappagallo (PP, LL), cappello (PP, LL) e bellezza (LL, ZZ) contengono due doppie; cammino ne contiene una sola (MM)."],[3,"Completare la frase con la coppia corretta: «Le misure adottate si sono rivelate ______: invece di risolvere il problema, lo hanno ______».","Controproducenti – aggravato","Efficaci – risolto","Inutili – attenuato","Tempestive –
